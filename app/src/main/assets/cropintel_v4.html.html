PAGES.market = function() {
  const entries = DB.getList('market_prices');
  const MANDIS = ['Sheikhupura','Lahore (Data Gunj Bakhsh)','Lahore (Badami Bagh)','Gujranwala','Faisalabad','Sargodha'];
  const CROPS = ['Wheat','Rice (Basmati)','Rice (IRRI)','Maize','Sugarcane','Cotton','Potato','Onion','Tomato','Chilli'];

  window._showAddMarketModal = () => {
    openModal('Add Mandi Price', `
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Crop *</label><select class="form-select" id="mp-crop">${CROPS.map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Mandi *</label><select class="form-select" id="mp-mandi">${MANDIS.map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Price/Maund (PKR) *</label><input class="form-input" id="mp-price" type="number" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Date *</label><input class="form-input" id="mp-date" type="date" value="${today()}"></div>
        <div class="form-group"><label class="form-label">Quality Grade</label><select class="form-select" id="mp-grade"><option>A</option><option>B</option><option>C</option></select></div>
        <div class="form-group"><label class="form-label">Source</label><select class="form-select" id="mp-src"><option>Manual Entry</option><option>Phone Call</option><option>Market Agent</option><option>WhatsApp</option></select></div>
      </div>
      <div class="form-group" style="margin-top:12px"><label class="form-label">Notes</label><textarea class="form-textarea" id="mp-notes" placeholder="Any notes about this price..."></textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="saveMarketPrice()">Save</button>`
    );
  };

  window.saveMarketPrice = (editId=null) => {
    const crop = document.getElementById('mp-crop')?.value;
    const price = document.getElementById('mp-price')?.value;
    const date = document.getElementById('mp-date')?.value;
    if (!crop || !price || !date) { showToast('Fill required fields'); return; }
    const data = {
      cropName:crop, mandiName:document.getElementById('mp-mandi')?.value,
      pricePerMaundPKR:Number(price), date,
      qualityGrade:document.getElementById('mp-grade')?.value||'A',
      sourceType:document.getElementById('mp-src')?.value||'Manual Entry',
      notes:document.getElementById('mp-notes')?.value||'',
    };
    if (editId) { DB.updateItem('market_prices', editId, data); showToast('✓ Updated'); }
    else { DB.addItem('market_prices', data); showToast('✓ Price saved'); }
    closeModal(); navigate('market');
  };

  window.deleteMarketPrice = (id) => openConfirm('Delete this price entry?', () => { DB.deleteItem('market_prices', id); navigate('market'); showToast('Deleted'); });

  const sorted = [...entries].sort((a,b)=>b.date.localeCompare(a.date));

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div>
      <div style="font-size:0.78rem;font-weight:700;color:var(--t1)">${entries.length} price entries</div>
      <div style="font-family:var(--mono);font-size:0.6rem;color:var(--t3)">Enter mandi prices to track trends</div>
    </div>
    <button class="btn btn-primary" onclick="_showAddMarketModal()">+ Add Price</button>
  </div>
  ${entries.length===0?`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No Prices Yet</div><div class="empty-desc">Add mandi prices from Sheikhupura, Lahore, and Gujranwala to track market trends.</div></div>`:`
  <div class="card">
    ${sorted.map(e=>`<div class="list-item">
      <div class="list-item-icon">📊</div>
      <div class="list-item-content">
        <div class="list-item-title">${e.cropName} <span style="color:var(--p1);font-family:var(--mono)">${formatPKR(e.pricePerMaundPKR)}/maund</span></div>
        <div class="list-item-meta">${e.mandiName} · ${e.date} · Grade ${e.qualityGrade||'A'} · ${e.sourceType}</div>
        ${e.notes?`<div style="font-size:0.7rem;color:var(--t4);margin-top:2px;font-style:italic">${e.notes}</div>`:''}
      </div>
      <div class="list-item-actions">
        <button class="btn btn-danger btn-sm btn-icon" onclick="deleteMarketPrice('${e.id}')">🗑</button>
      </div>
    </div>`).join('')}
  </div>`}
  <button class="fab" onclick="_showAddMarketModal()">+</button>`;
},

PAGES.irrigation = function() {
  const logs = DB.getList('irrigation');
  const crops = DB.getList('crops');
  const fields = DB.getList('fields');
  const METHODS = ['Canal (Flood)', 'Tubewell (Flood)', 'Drip', 'Sprinkler', 'Rainfed', 'Warabandi Turn'];
  const SOURCES = ['Canal', 'Tubewell', 'River', 'Rainwater', 'Pond'];

  window.showAddIrrModal = () => {
    openModal('Log Irrigation', `
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Field *</label>
          <select class="form-select" id="ir-field">
            <option value="">Select field</option>
            ${fields.map(f => `<option value="${f.id}">${f.name} (${f.areaAcres}ac)</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Crop</label>
          <select class="form-select" id="ir-crop">
            <option value="">None</option>
            ${crops.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Date *</label>
          <input class="form-input" id="ir-date" type="date" value="${today()}"></div>
        <div class="form-group"><label class="form-label">Method</label>
          <select class="form-select" id="ir-method">
            ${METHODS.map(m => `<option>${m}</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Water Source</label>
          <select class="form-select" id="ir-source">
            ${SOURCES.map(s => `<option>${s}</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Duration (hours)</label>
          <input class="form-input" id="ir-hours" type="number" step="0.5" min="0" placeholder="e.g. 4"></div>
        <div class="form-group"><label class="form-label">Water Used (acre-inches)</label>
          <input class="form-input" id="ir-water" type="number" step="0.5" min="0" placeholder="e.g. 3"></div>
        <div class="form-group"><label class="form-label">Area Irrigated (acres)</label>
          <input class="form-input" id="ir-area" type="number" step="0.5" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Fuel/Electricity Cost PKR</label>
          <input class="form-input" id="ir-cost" type="number" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Labour Cost PKR</label>
          <input class="form-input" id="ir-labour" type="number" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Irrigation No. (this season)</label>
          <input class="form-input" id="ir-num" type="number" min="1" placeholder="1"></div>
        <div class="form-group"><label class="form-label">Soil Moisture Before</label>
          <select class="form-select" id="ir-moisture">
            <option>Dry (Cracked)</option><option>Slightly Dry</option>
            <option>Optimal</option><option>Moist</option><option>Waterlogged</option>
          </select></div>
        <div class="form-group"><label class="form-label">Next Irrigation Due</label>
          <input class="form-input" id="ir-next" type="date"></div>
      </div>
      <div class="form-group" style="margin-top:10px"><label class="form-label">Notes / Observations</label>
        <textarea class="form-textarea" id="ir-notes" placeholder="e.g. Warabandi turn received, water pressure low..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveIrrigation()">Save Log</button>`);
  };

  window.saveIrrigation = (editId = null) => {
    const date = document.getElementById('ir-date')?.value;
    if (!date) { showToast('Date required'); return; }
    const fid = document.getElementById('ir-field')?.value;
    const cid = document.getElementById('ir-crop')?.value;
    const data = {
      fieldId: fid, fieldName: fields.find(f => f.id === fid)?.name || '',

      date, method: document.getElementById('ir-method')?.value || 'Canal (Flood)',

      areaAcres: Number(document.getElementById('ir-area')?.value || 0),

      nextIrrigationDate: document.getElementById('ir-next')?.value || '',
      notes: document.getElementById('ir-notes')?.value || ''

      <div class="form-grid">
        <div class="form-group"><label class="form-label">Field</label>
          <select class="form-select" id="ir-field">
            <option value="">None</option>
            ${fields.map(f => `<option value="${f.id}"${f.id === ir.fieldId ? ' selected' : ''}>${f.name}</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Date *</label>
          <input class="form-input" id="ir-date" type="date" value="${ir.date}"></div>
        <div class="form-group"><label class="form-label">Method</label>
          <select class="form-select" id="ir-method">
            ${METHODS.map(m => `<option${m === ir.method ? ' selected' : ''}>${m}</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Water Source</label>
          <select class="form-select" id="ir-source">
            ${SOURCES.map(s => `<option${s === ir.waterSource ? ' selected' : ''}>${s}</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Duration (hrs)</label>
          <input class="form-input" id="ir-hours" type="number" step="0.5" value="${ir.durationHours || ''}"></div>
        <div class="form-group"><label class="form-label">Water (acre-in)</label>
          <input class="form-input" id="ir-water" type="number" step="0.5" value="${ir.waterAcreInches || ''}"></div>
        <div class="form-group"><label class="form-label">Area (acres)</label>
          <input class="form-input" id="ir-area" type="number" step="0.5" value="${ir.areaAcres || ''}"></div>
        <div class="form-group"><label class="form-label">Fuel Cost PKR</label>
          <input class="form-input" id="ir-cost" type="number" value="${ir.fuelCostPKR || 0}"></div>
        <div class="form-group"><label class="form-label">Labour Cost PKR</label>
          <input class="form-input" id="ir-labour" type="number" value="${ir.labourCostPKR || 0}"></div>
        <div class="form-group"><label class="form-label">Next Due</label>
          <input class="form-input" id="ir-next" type="date" value="${ir.nextIrrigationDate || ''}"></div>
        <div class="form-group"><label class="form-label">Irr. No.</label>
          <input class="form-input" id="ir-num" type="number" value="${ir.irrigationNumber || 1}"></div>
        <div class="form-group"><label class="form-label">Soil Moisture Before</label>
          <select class="form-select" id="ir-moisture">
            ${['Dry (Cracked)', 'Slightly Dry', 'Optimal', 'Moist', 'Waterlogged'].map(m => `<option${m === ir.soilMoistureBefore ? ' selected' : ''}>${m}</option>`).join('')}
          </select></div>
      </div>
      <div class="form-group" style="margin-top:10px"><label class="form-label">Notes</label>
        <textarea class="form-textarea" id="ir-notes">${ir.notes || ''}</textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveIrrigation('${id}')">Save</button>`);

        </div>`;

  <div class="section">

      ${sorted.map(l => {

        return `<div class="list-item">
          <div class="li-icon">💧</div>
          <div class="li-body">
            <div class="li-title">${l.fieldName || 'Field'} ${l.cropName ? '· ' + l.cropName : ''}</div>
            <div style="display:flex;gap:5px;margin:4px 0;flex-wrap:wrap">

            <div class="li-meta">${l.date}
              ${l.durationHours ? ` · ${l.durationHours}h` : ''}

              ${l.areaAcres ? ` · ${l.areaAcres}ac` : ''}
              ${cost ? ` · ${formatPKR(cost)}` : ''}
            </div>

window.calcNPK = () => {
  const cropName = document.getElementById('npk-crop')?.value;
  const area = Number(document.getElementById('npk-area')?.value || 1);
  const CROP_RECS = {
    'Wheat': { N: 120, P: 90, K: 60 }, 'Rice (Basmati)': { N: 100, P: 60, K: 60 },
    'Rice (IRRI)': { N: 120, P: 75, K: 60 }, 'Maize': { N: 150, P: 90, K: 60 },
    'Sugarcane': { N: 200, P: 100, K: 150 }, 'Cotton': { N: 120, P: 75, K: 60 },
    'Potato': { N: 180, P: 120, K: 200 }, 'Sunflower': { N: 100, P: 75, K: 60 },
    'Canola': { N: 120, P: 90, K: 60 }, 'Chickpea': { N: 25, P: 60, K: 40 }
  };
  const SOURCES = [
    { name: 'Urea', N: 46, P: 0, K: 0, price: 3800, bagKg: 50 },
    { name: 'DAP', N: 18, P: 46, K: 0, price: 8200, bagKg: 50 },
    { name: 'SOP', N: 0, P: 0, K: 50, price: 6500, bagKg: 50 },
    { name: 'MOP', N: 0, P: 0, K: 60, price: 4500, bagKg: 50 },
    { name: 'SSP', N: 0, P: 18, K: 0, price: 1200, bagKg: 50 },
  ];
  // Auto-fill from crop
  const rec = CROP_RECS[cropName];
  if (rec) {
    const ni = document.getElementById('npk-n'), pi = document.getElementById('npk-p'), ki = document.getElementById('npk-k');
    if (ni && !ni.dataset.manual) ni.value = rec.N;
    if (pi && !pi.dataset.manual) pi.value = rec.P;
    if (ki && !ki.dataset.manual) ki.value = rec.K;
  }
  const N_kgha = Number(document.getElementById('npk-n')?.value || 0);
  const P_kgha = Number(document.getElementById('npk-p')?.value || 0);
  const K_kgha = Number(document.getElementById('npk-k')?.value || 0);
  if (!N_kgha && !P_kgha && !K_kgha) return;

  // Convert kg/ha to kg/acre (1 ha = 2.47 acres)
  const N = N_kgha / 2.47 * area;
  const P = P_kgha / 2.47 * area;
  const K = K_kgha / 2.47 * area;

  // Calculate bags needed
  // Strategy: DAP first for P, then SOP for K, then Urea for remaining N
  const dapBagsFloat = P / (0.46 * 50); // DAP provides P
  const dapBags = Math.ceil(dapBagsFloat);
  const dapKg = dapBags * 50;
  const nFromDap = dapKg * 0.18;

  const sopBags = Math.ceil(K / (0.5 * 50));
  const sopKg = sopBags * 50;

  const remainingN = Math.max(0, N - nFromDap);
  const ureaBags = Math.ceil(remainingN / (0.46 * 50));
  const ureaKg = ureaBags * 50;

  const ureaCost = ureaBags * 3800;
  const dapCost = dapBags * 8200;
  const sopCost = sopBags * 6500;
  const totalCost = ureaCost + dapCost + sopCost;

  const el = document.getElementById('npk-result');
  if (!el) return;
  el.innerHTML = `
  <div class="card section">
    <div class="card-hd"><div class="card-title">FERTILIZER RECOMMENDATION — ${area} ACRES</div></div>
    <div class="card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
        <div class="stat-card"><div class="stat-val" style="color:var(--b3)">${N.toFixed(1)}</div><div class="stat-label">N needed (kg)</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--a)">${P.toFixed(1)}</div><div class="stat-label">P₂O₅ (kg)</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--p)">${K.toFixed(1)}</div><div class="stat-label">K₂O (kg)</div></div>
      </div>
      <div class="divider"></div>
      <div style="font-family:var(--mono);font-size:.62rem;color:var(--t3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em">Recommended Products</div>
      ${dapBags > 0 ? `<div class="finance-row"><div><div class="fr-label">DAP (18-46-0)</div><div class="fr-meta">For phosphorus supply</div></div><div style="text-align:right"><span class="badge badge-gold">${dapBags} bags (${dapKg}kg)</span><div class="fr-meta">${formatPKR(dapCost)}</div></div></div>` : ''}
      ${sopBags > 0 ? `<div class="finance-row"><div><div class="fr-label">SOP (0-0-50)</div><div class="fr-meta">For potassium supply</div></div><div style="text-align:right"><span class="badge badge-green">${sopBags} bags (${sopKg}kg)</span><div class="fr-meta">${formatPKR(sopCost)}</div></div></div>` : ''}
      ${ureaBags > 0 ? `<div class="finance-row"><div><div class="fr-label">Urea (46-0-0)</div><div class="fr-meta">Remaining nitrogen (split)</div></div><div style="text-align:right"><span class="badge badge-blue">${ureaBags} bags (${ureaKg}kg)</span><div class="fr-meta">${formatPKR(ureaCost)}</div></div></div>` : ''}
      <div class="divider"></div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:700;color:var(--t1)">Estimated Total Cost</span>
        <span style="font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--p)">${formatPKR(totalCost)}</span>
      </div>
      <div class="alert alert-i" style="margin-top:12px">
        💡 Prices approximate (Sheikhupura market). Split Urea: apply 50% basal, 50% at tillering/vegetative stage. Verify current rates before purchase.
      </div>
    </div>
  </div>`;
};

  if (!logs.length) return `
    <div class="empty-state">
      <div class="empty-icon">💊</div>
      <div class="empty-title">No Pesticide Records</div>
      <div class="empty-desc">Log every pesticide application — product, dose, area, cost, PHI. Essential for food safety compliance and expense tracking.</div>
      <button class="btn btn-primary" onclick="showAddPesticideModal()">+ Log Application</button>
    </div>
    <button class="fab" onclick="showAddPesticideModal()">+</button>`;

  const sorted = [...logs].sort((a, b) => b.date.localeCompare(a.date));
  const TC = { Insecticide: 'badge-red', Herbicide: 'badge-green', Fungicide: 'badge-amber', Bactericide: 'badge-blue' };

  return `
  <div class="stat-grid section">
    <div class="stat-card"><div class="stat-val">${logs.length}</div><div class="stat-label">Applications</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--orange)">${formatPKR(totalCost)}</div><div class="stat-label">Total Cost</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--yellow)">${phiWarning.length}</div><div class="stat-label">PHI Active</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--b3)">${[...new Set(logs.map(l => l.productName))].length}</div><div class="stat-label">Products</div></div>
  </div>
  ${phiWarning.length ? `<div class="alert alert-w section">⚠️ ${phiWarning.length} field${phiWarning.length > 1 ? 's' : ''} still within Pre-Harvest Interval — do NOT harvest yet.</div>` : ''}
  <div class="section">
    <div class="sec-hd"><div class="sec-title">SPRAY LOG</div><button class="btn btn-primary btn-sm" onclick="showAddPesticideModal()">+ Log</button></div>
    <div class="card">
      ${sorted.map(l => {
        const phiActive = l.harvestSafeDate && l.harvestSafeDate >= today_d;
        return `<div class="list-item">
          <div class="li-icon">💊</div>
          <div class="li-body">
            <div class="li-title">${l.productName}${l.activeIngredient ? ` <span style="color:var(--t3);font-size:.72rem">(${l.activeIngredient})</span>` : ''}</div>
            <div style="display:flex;gap:5px;margin:4px 0;flex-wrap:wrap">
              <span class="badge ${TC[l.pesticideType] || 'badge-muted'}">${l.pesticideType}</span>
              ${l.targetPest ? `<span class="badge badge-muted">🎯${l.targetPest}</span>` : ''}
              ${l.cropName ? `<span class="badge badge-muted">🌾${l.cropName}</span>` : ''}
              ${phiActive ? `<span class="badge badge-red">PHI active until ${l.harvestSafeDate}</span>` : ''}
            </div>
            <div class="li-meta">${l.date}
              ${l.dosePerAcre ? ` · ${l.dosePerAcre}/ac` : ''}
              ${l.areaSprayedAcres ? ` · ${l.areaSprayedAcres}ac` : ''}
              ${l.totalCostPKR ? ` · ${formatPKR(l.totalCostPKR)}` : ''}
              ${l.effectiveness !== 'Not assessed yet' ? ` · ${l.effectiveness}` : ''}
            </div>
          </div>
          <div class="li-actions">
            <button class="btn btn-ghost btn-sm btn-icon" onclick="editPesticide('${l.id}')">✏</button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="delPesticide('${l.id}')">🗑</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>
  <button class="fab" onclick="showAddPesticideModal()">+</button>`;
};

  window.showAddSeedModal = () => {
    openModal('Add Seed Stock', `
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Crop Type *</label>
          <input class="form-input" id="sd-crop" placeholder="e.g. Wheat, Rice, Maize"></div>
        <div class="form-group"><label class="form-label">Variety / Brand *</label>
          <input class="form-input" id="sd-variety" placeholder="e.g. NIBGE-2, Super Basmati"></div>
        <div class="form-group"><label class="form-label">Seed Category</label>
          <select class="form-select" id="sd-cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>

        <div class="form-group"><label class="form-label">Quantity *</label>
          <input class="form-input" id="sd-qty" type="number" step="0.5" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Unit</label>
          <select class="form-select" id="sd-unit">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Cost per Unit PKR</label>
          <input class="form-input" id="sd-unitcost" type="number" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Total Cost PKR</label>
          <input class="form-input" id="sd-cost" type="number" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Germination % (label)</label>
          <input class="form-input" id="sd-germ" type="number" min="0" max="100" placeholder="e.g. 90"></div>
        <div class="form-group"><label class="form-label">Seed Treatment Applied</label>
          <input class="form-input" id="sd-treat" placeholder="e.g. Thiram, Imidacloprid"></div>
        <div class="form-group"><label class="form-label">Supplier / Shop</label>
          <input class="form-input" id="sd-supplier" placeholder="e.g. Punjab Seed Corp"></div>
        <div class="form-group"><label class="form-label">Storage Location</label>
          <input class="form-input" id="sd-storage" placeholder="e.g. Store room, cool dry place"></div>
        <div class="form-group"><label class="form-label">Expiry / Use Before</label>
          <input class="form-input" id="sd-expiry" type="date"></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-select" id="sd-status"><option>In Stock</option><option>Used</option><option>Partially Used</option><option>Expired</option></select></div>
      </div>
      <div class="form-group" style="margin-top:10px"><label class="form-label">Notes</label>
        <textarea class="form-textarea" id="sd-notes" placeholder="Source, quality observations, test results..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveSeed()">Save</button>`);
  };

  window.saveSeed = (editId=null) => {
    const crop = document.getElementById('sd-crop')?.value?.trim();
    const variety = document.getElementById('sd-variety')?.value?.trim();
    if (!crop||!variety){showToast('Crop and variety required');return;}
    const qty = Number(document.getElementById('sd-qty')?.value||0);
    const unitCost = Number(document.getElementById('sd-unitcost')?.value||0);
    const totalCost = Number(document.getElementById('sd-cost')?.value||0)||(qty*unitCost);
    const data = {
      cropType:crop, variety, category:document.getElementById('sd-cat')?.value||'Certified',
      lotNumber:document.getElementById('sd-lot')?.value||'',
      purchaseDate:document.getElementById('sd-date')?.value||today(),
      quantityKg:qty, unit:document.getElementById('sd-unit')?.value||'kg',
      costPerUnit:unitCost, totalCostPKR:totalCost,
      germinationPct:Number(document.getElementById('sd-germ')?.value||0),
      seedTreatment:document.getElementById('sd-treat')?.value||'',
      supplier:document.getElementById('sd-supplier')?.value||'',
      storageLocation:document.getElementById('sd-storage')?.value||'',
      expiryDate:document.getElementById('sd-expiry')?.value||'',
      status:document.getElementById('sd-status')?.value||'In Stock',
      notes:document.getElementById('sd-notes')?.value||''
    };
    if(editId) DB.updateItem('seeds',editId,data); else DB.addItem('seeds',data);
    closeModal(); navigate('seeds'); showToast(editId?'✓ Updated':'✓ Seed added');
  };

  window.editSeed = (id) => {
    const sd = DB.getList('seeds').find(x=>x.id===id); if(!sd) return;
    openModal('Edit Seed', `
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Crop Type *</label><input class="form-input" id="sd-crop" value="${sd.cropType}"></div>
        <div class="form-group"><label class="form-label">Variety *</label><input class="form-input" id="sd-variety" value="${sd.variety}"></div>
        <div class="form-group"><label class="form-label">Category</label><select class="form-select" id="sd-cat">${CATS.map(c=>`<option${c===sd.category?' selected':''}>${c}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Lot No.</label><input class="form-input" id="sd-lot" value="${sd.lotNumber||''}"></div>
        <div class="form-group"><label class="form-label">Purchase Date</label><input class="form-input" id="sd-date" type="date" value="${sd.purchaseDate||''}"></div>
        <div class="form-group"><label class="form-label">Quantity</label><input class="form-input" id="sd-qty" type="number" step="0.5" value="${sd.quantityKg||0}"></div>
        <div class="form-group"><label class="form-label">Unit</label><select class="form-select" id="sd-unit">${UNITS.map(u=>`<option${u===sd.unit?' selected':''}>${u}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Total Cost PKR</label><input class="form-input" id="sd-cost" type="number" value="${sd.totalCostPKR||0}"></div>
        <div class="form-group"><label class="form-label">Germination %</label><input class="form-input" id="sd-germ" type="number" value="${sd.germinationPct||''}"></div>
        <div class="form-group"><label class="form-label">Seed Treatment</label><input class="form-input" id="sd-treat" value="${sd.seedTreatment||''}"></div>
        <div class="form-group"><label class="form-label">Storage Location</label><input class="form-input" id="sd-storage" value="${sd.storageLocation||''}"></div>
        <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="sd-status">${['In Stock','Used','Partially Used','Expired'].map(s=>`<option${s===sd.status?' selected':''}>${s}</option>`).join('')}</select></div>
        <div style="display:none"><input id="sd-unitcost" value="0"><input id="sd-expiry" value="${sd.expiryDate||''}"><input id="sd-supplier" value="${sd.supplier||''}"></div>
      </div>
      <div class="form-group" style="margin-top:10px"><label class="form-label">Notes</label><textarea class="form-textarea" id="sd-notes">${sd.notes||''}</textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveSeed('${id}')">Save</button>`);
  };

  window.delSeed = (id) => {
    const sd = DB.getList('seeds').find(x=>x.id===id);
    openConfirm(`Delete ${sd?.variety||'seed'} record?`,()=>{DB.deleteItem('seeds',id);navigate('seeds');showToast('Deleted');});
  };

  const inStock = seeds.filter(s=>s.status==='In Stock'||s.status==='Partially Used');
  const totalCost = seeds.reduce((s,x)=>s+Number(x.totalCostPKR||0),0);
  const expired = seeds.filter(s=>s.expiryDate && s.expiryDate < today()).length;

  if(!seeds.length) return `<div class="empty-state"><div class="empty-icon">🌱</div><div class="empty-title">No Seed Records</div><div class="empty-desc">Track seed inventory — variety, lot, germination %, treatment, and cost. Never lose track of what seed you have in store.</div><button class="btn btn-primary" onclick="showAddSeedModal()">+ Add Seed</button></div><button class="fab" onclick="showAddSeedModal()">+</button>`;

  const SC = {'In Stock':'badge-green','Partially Used':'badge-amber','Used':'badge-muted','Expired':'badge-red'};
  return `
  <div class="stat-grid section">
    <div class="stat-card"><div class="stat-val" style="color:var(--p)">${inStock.length}</div><div class="stat-label">In Stock</div></div>
    <div class="stat-card"><div class="stat-val">${seeds.length}</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--orange)">${formatPKR(totalCost)}</div><div class="stat-label">Total Value</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--red)">${expired}</div><div class="stat-label">Expired</div></div>
  </div>
  <div class="section">
    <div class="sec-hd"><div class="sec-title">SEED INVENTORY</div><button class="btn btn-primary btn-sm" onclick="showAddSeedModal()">+ Add</button></div>
    <div class="card">
      ${[...seeds].reverse().map(sd=>`
        <div class="list-item">
          <div class="li-icon">🌱</div>
          <div class="li-body">
            <div class="li-title">${sd.variety} <span style="color:var(--t3);font-size:.75rem">${sd.cropType}</span></div>
            <div style="display:flex;gap:5px;margin:4px 0;flex-wrap:wrap">
              <span class="badge ${SC[sd.status]||'badge-muted'}">${sd.status}</span>
              <span class="badge badge-muted">${sd.category}</span>
              ${sd.germinationPct?`<span class="badge badge-blue">Germ: ${sd.germinationPct}%</span>`:''}
              ${sd.seedTreatment?`<span class="badge badge-purple">Treated</span>`:''}
            </div>
            <div class="li-meta">${sd.purchaseDate||''} · ${sd.quantityKg||0} ${sd.unit||'kg'}${sd.totalCostPKR?` · ${formatPKR(sd.totalCostPKR)}`:''}${sd.supplier?' · '+sd.supplier:''}${sd.expiryDate?' · Exp:'+sd.expiryDate:''}</div>
            ${sd.notes?`<div style="font-size:.7rem;color:var(--t4);margin-top:2px">${sd.notes.slice(0,80)}</div>`:''}
          </div>
          <div class="li-actions">
            <button class="btn btn-ghost btn-sm btn-icon" onclick="editSeed('${sd.id}')">✏</button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="delSeed('${sd.id}')">🗑</button>
          </div>
        </div>`).join('')}
    </div>
  </div>
  <button class="fab" onclick="showAddSeedModal()">+</button>`;
};

PAGES.maintenance = function() {
  const logs = DB.getList('maintenance');
  const equipment = DB.getList('equipment');
  const TYPES = ['Routine Service','Oil Change','Filter Change','Tyre Repair/Replace','Battery','Engine Repair','Hydraulic Repair','Electrical','Welding','Greasing','Cleaning','Inspection','Other'];

  window.showAddMaintModal = () => {
    openModal('Log Maintenance', `
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Equipment *</label>
          <select class="form-select" id="mt-equip">
            <option value="">Select equipment</option>
            ${equipment.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Maintenance Type</label>
          <select class="form-select" id="mt-type">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Date *</label>
          <input class="form-input" id="mt-date" type="date" value="${today()}"></div>
        <div class="form-group"><label class="form-label">Performed By</label>
          <select class="form-select" id="mt-by"><option>Self</option><option>Local Mechanic</option><option>Authorized Workshop</option><option>Company Service</option></select></div>
        <div class="form-group"><label class="form-label">Parts Cost PKR</label>
          <input class="form-input" id="mt-parts" type="number" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Labour Cost PKR</label>
          <input class="form-input" id="mt-labour" type="number" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Engine Hours at Service</label>
          <input class="form-input" id="mt-hours" type="number" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Next Service Due (date)</label>
          <input class="form-input" id="mt-next" type="date"></div>
        <div class="form-group"><label class="form-label">Next Service (hours)</label>
          <input class="form-input" id="mt-nexthours" type="number" min="0" placeholder="e.g. 500"></div>
      </div>
      <div class="form-group" style="margin-top:10px"><label class="form-label">Work Done / Parts Used</label>
        <textarea class="form-textarea" id="mt-notes" placeholder="Describe work done, parts replaced..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveMaintenance()">Save</button>`);
  };

  window.saveMaintenance = (editId=null) => {
    const date = document.getElementById('mt-date')?.value;
    if(!date){showToast('Date required');return;}
    const eid = document.getElementById('mt-equip')?.value;
    const parts = Number(document.getElementById('mt-parts')?.value||0);
    const labour = Number(document.getElementById('mt-labour')?.value||0);
    const data = {
      equipmentId:eid, equipmentName:equipment.find(e=>e.id===eid)?.name||'',
      maintenanceType:document.getElementById('mt-type')?.value||'Routine Service',
      date, performedBy:document.getElementById('mt-by')?.value||'Self',
      partsCostPKR:parts, labourCostPKR:labour, totalCostPKR:parts+labour,
      engineHoursAtService:Number(document.getElementById('mt-hours')?.value||0),
      nextServiceDate:document.getElementById('mt-next')?.value||'',
      nextServiceHours:Number(document.getElementById('mt-nexthours')?.value||0),
      notes:document.getElementById('mt-notes')?.value||''
    };
    if(editId) DB.updateItem('maintenance',editId,data); else DB.addItem('maintenance',data);
    // Update equipment next service date
    if(eid&&data.nextServiceDate) DB.updateItem('equipment',eid,{nextServiceDate:data.nextServiceDate});
    closeModal(); navigate('maintenance'); showToast(editId?'✓ Updated':'✓ Maintenance logged');
  };

  window.delMaintenance = (id) => openConfirm('Delete this maintenance record?',()=>{DB.deleteItem('maintenance',id);navigate('maintenance');showToast('Deleted');});

  const totalCost = logs.reduce((s,l)=>s+Number(l.totalCostPKR||0),0);

  if(!logs.length) return `<div class="empty-state"><div class="empty-icon">🔩</div><div class="empty-title">No Maintenance Records</div><div class="empty-desc">Log every service, repair, and oil change. Track costs and schedule preventive maintenance.</div>${equipment.length?'<button class="btn btn-primary" onclick="showAddMaintModal()">+ Log Maintenance</button>':'<div class="alert alert-i" style="margin:14px auto;max-width:280px">Add equipment first in the Equipment module</div>'}</div><button class="fab" onclick="showAddMaintModal()">+</button>`;

  return `
  <div class="stat-grid section">
    <div class="stat-card"><div class="stat-val">${logs.length}</div><div class="stat-label">Services</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--orange)">${formatPKR(totalCost)}</div><div class="stat-label">Total Cost</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--b3)">${formatPKR(logs.reduce((s,l)=>s+Number(l.partsCostPKR||0),0))}</div><div class="stat-label">Parts</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--a)">${formatPKR(logs.reduce((s,l)=>s+Number(l.labourCostPKR||0),0))}</div><div class="stat-label">Labour</div></div>
  </div>
  <div class="section">
    <div class="sec-hd"><div class="sec-title">MAINTENANCE HISTORY</div><button class="btn btn-primary btn-sm" onclick="showAddMaintModal()">+ Log</button></div>
    <div class="card">
      ${[...logs].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`
        <div class="list-item">
          <div class="li-icon">🔩</div>
          <div class="li-body">
            <div class="li-title">${l.equipmentName||'Equipment'} — ${l.maintenanceType}</div>
            <div style="display:flex;gap:5px;margin:4px 0;flex-wrap:wrap">
              <span class="badge badge-muted">${l.performedBy}</span>
              ${l.totalCostPKR?`<span class="badge badge-amber">${formatPKR(l.totalCostPKR)}</span>`:''}
            </div>
            <div class="li-meta">${l.date}${l.engineHoursAtService?' · '+l.engineHoursAtService+'h':''}${l.nextServiceDate?' · Next: '+l.nextServiceDate:''}</div>
            ${l.notes?`<div style="font-size:.7rem;color:var(--t4);margin-top:2px">${l.notes.slice(0,100)}</div>`:''}
          </div>
          <button class="btn btn-danger btn-sm btn-icon" onclick="delMaintenance('${l.id}')">🗑</button>
        </div>`).join('')}
    </div>
  </div>
  <button class="fab" onclick="showAddMaintModal()">+</button>`;
};

PAGES.storage = function() {

  const crops = DB.getList('crops');
  const UNITS = ['Maunds','kg','Tonnes','Bags (50kg)','Quintals'];
  const TYPES = ['Grain','Vegetable','Fruit','Seed','Other'];

  window.showAddStorageModal = () => {
    openModal('Add Storage Entry', `
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Commodity *</label>
          <input class="form-input" id="st2-commodity" placeholder="e.g. Wheat, Rice, Potato"></div>
        <div class="form-group"><label class="form-label">Crop (link)</label>
          <select class="form-select" id="st2-crop">
            <option value="">None</option>
            ${crops.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
          </select></div>

          <input class="form-input" id="st2-qty" type="number" step="0.5" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Unit</label>
          <select class="form-select" id="st2-unit">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Storage Date *</label>
          <input class="form-input" id="st2-date" type="date" value="${today()}"></div>
        <div class="form-group"><label class="form-label">Storage Location</label>
          <input class="form-input" id="st2-loc" placeholder="e.g. Own store, rented warehouse"></div>
        <div class="form-group"><label class="form-label">Storage Type</label>
          <select class="form-select" id="st2-type">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Moisture % at Storage</label>
          <input class="form-input" id="st2-moisture" type="number" step="0.1" placeholder="e.g. 12.5"></div>
        <div class="form-group"><label class="form-label">Cost of Production/unit PKR</label>
          <input class="form-input" id="st2-cop" type="number" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Storage Cost/Month PKR</label>
          <input class="form-input" id="st2-cost" type="number" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-select" id="st2-status"><option>In Store</option><option>Partially Sold</option><option>Sold</option></select></div>
        <div class="form-group"><label class="form-label">Target Sell Price/unit PKR</label>
          <input class="form-input" id="st2-target" type="number" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Sell Before Date</label>
          <input class="form-input" id="st2-sell" type="date"></div>
      </div>
      <div class="form-group" style="margin-top:10px"><label class="form-label">Notes</label>
        <textarea class="form-textarea" id="st2-notes" placeholder="Treatment applied, pest proofing, insurance..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveStorage()">Save</button>`);
  };

  window.saveStorage = (editId=null) => {
    const commodity = document.getElementById('st2-commodity')?.value?.trim();
    const qty = Number(document.getElementById('st2-qty')?.value||0);
    const date = document.getElementById('st2-date')?.value;
    if(!commodity||!date){showToast('Commodity and date required');return;}
    const cid = document.getElementById('st2-crop')?.value;
    const data = {
      commodity, cropId:cid, cropName:crops.find(c=>c.id===cid)?.name||'',
      quantity:qty, unit:document.getElementById('st2-unit')?.value||'Maunds',
      storageDate:date, location:document.getElementById('st2-loc')?.value||'',
      storageType:document.getElementById('st2-type')?.value||'Grain',
      moisturePct:Number(document.getElementById('st2-moisture')?.value||0),
      costOfProductionPerUnit:Number(document.getElementById('st2-cop')?.value||0),
      storageMonthCostPKR:Number(document.getElementById('st2-cost')?.value||0),
      status:document.getElementById('st2-status')?.value||'In Store',
      targetSellPricePerUnit:Number(document.getElementById('st2-target')?.value||0),
      sellBeforeDate:document.getElementById('st2-sell')?.value||'',
      notes:document.getElementById('st2-notes')?.value||''
    };
    if(editId) DB.updateItem('storage',editId,data); else DB.addItem('storage',data);
    closeModal(); navigate('storage'); showToast(editId?'✓ Updated':'✓ Stored');
  };

  window.editStorage = (id) => {
    const st = DB.getList('storage').find(x=>x.id===id); if(!st) return;
    openModal('Edit Storage',`
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Commodity</label><input class="form-input" id="st2-commodity" value="${st.commodity}"></div>
        <div class="form-group"><label class="form-label">Quantity</label><input class="form-input" id="st2-qty" type="number" step="0.5" value="${st.quantity||0}"></div>
        <div class="form-group"><label class="form-label">Unit</label><select class="form-select" id="st2-unit">${UNITS.map(u=>`<option${u===st.unit?' selected':''}>${u}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Date</label><input class="form-input" id="st2-date" type="date" value="${st.storageDate}"></div>
        <div class="form-group"><label class="form-label">Location</label><input class="form-input" id="st2-loc" value="${st.location||''}"></div>
        <div class="form-group"><label class="form-label">Moisture %</label><input class="form-input" id="st2-moisture" type="number" step="0.1" value="${st.moisturePct||''}"></div>
        <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="st2-status">${['In Store','Partially Sold','Sold'].map(s=>`<option${s===st.status?' selected':''}>${s}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Target Price/unit PKR</label><input class="form-input" id="st2-target" type="number" value="${st.targetSellPricePerUnit||0}"></div>
        <div class="form-group"><label class="form-label">Sell Before</label><input class="form-input" id="st2-sell" type="date" value="${st.sellBeforeDate||''}"></div>
        <div style="display:none"><input id="st2-crop" value="${st.cropId||''}"><input id="st2-type" value="${st.storageType||''}"><input id="st2-cop" value="${st.costOfProductionPerUnit||0}"><input id="st2-cost" value="${st.storageMonthCostPKR||0}"></div>
      </div>
      <div class="form-group" style="margin-top:10px"><label class="form-label">Notes</label><textarea class="form-textarea" id="st2-notes">${st.notes||''}</textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveStorage('${id}')">Save</button>`);
  };

  window.delStorage = (id) => openConfirm('Delete this storage entry?',()=>{DB.deleteItem('storage',id);navigate('storage');showToast('Deleted');});

  const inStore = stocks.filter(s=>s.status==='In Store'||s.status==='Partially Sold');
  const totalQty = inStore.reduce((s,x)=>s+Number(x.quantity||0),0);
  const SC = {'In Store':'badge-green','Partially Sold':'badge-amber','Sold':'badge-muted'};

  if(!stocks.length) return `<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-title">No Storage Records</div><div class="empty-desc">Track stored grain, produce, and seeds. Monitor quantity, moisture, and optimal sell timing.</div><button class="btn btn-primary" onclick="showAddStorageModal()">+ Add to Storage</button></div><button class="fab" onclick="showAddStorageModal()">+</button>`;

  return `
  <div class="stat-grid section">
    <div class="stat-card"><div class="stat-val" style="color:var(--p)">${inStore.length}</div><div class="stat-label">In Store</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--a)">${totalQty.toFixed(0)}</div><div class="stat-label">Total Units</div></div>
    <div class="stat-card"><div class="stat-val">${stocks.length}</div><div class="stat-label">All Entries</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--b3)">${stocks.filter(s=>s.sellBeforeDate&&s.sellBeforeDate>=today()&&s.status!=='Sold').length}</div><div class="stat-label">Sell Deadlines</div></div>
  </div>
  <div class="section">
    <div class="sec-hd"><div class="sec-title">STORAGE INVENTORY</div><button class="btn btn-primary btn-sm" onclick="showAddStorageModal()">+ Add</button></div>
    <div class="card">
      ${[...stocks].reverse().map(st=>{
        const d = st.sellBeforeDate ? daysUntil(st.sellBeforeDate) : null;
        return `<div class="list-item">
          <div class="li-icon">📦</div>
          <div class="li-body">
            <div class="li-title">${st.commodity} ${st.cropName?'· '+st.cropName:''}</div>
            <div style="display:flex;gap:5px;margin:4px 0;flex-wrap:wrap">
              <span class="badge ${SC[st.status]||'badge-muted'}">${st.status}</span>
              <span class="badge badge-blue">${st.quantity||0} ${st.unit}</span>
              ${st.moisturePct?`<span class="badge badge-muted">💧${st.moisturePct}%</span>`:''}
              ${d!==null&&d<=7&&st.status!=='Sold'?`<span class="badge badge-red">Sell in ${d}d</span>`:''}
            </div>
            <div class="li-meta">${st.storageDate} · ${st.location||'—'}${st.targetSellPricePerUnit?' · Target:'+formatPKR(st.targetSellPricePerUnit):''}${st.sellBeforeDate?' · Deadline:'+st.sellBeforeDate:''}</div>
            ${st.notes?`<div style="font-size:.7rem;color:var(--t4);margin-top:2px">${st.notes.slice(0,80)}</div>`:''}
          </div>
          <div class="li-actions">
            <button class="btn btn-ghost btn-sm btn-icon" onclick="editStorage('${st.id}')">✏</button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="delStorage('${st.id}')">🗑</button>
          </div>
        </div>`;}).join('')}
    </div>
  </div>
  <button class="fab" onclick="showAddStorageModal()">+</button>`;
};

            ${fields.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Harvest Date *</label>
          <input class="form-input" id="hl-date" type="date" value="${today()}"></div>
        <div class="form-group"><label class="form-label">Area Harvested (acres)</label>

          <select class="form-select" id="hl-quality"><option>A — Premium</option><option>B — Standard</option><option>C — Below Standard</option></select></div>
        <div class="form-group"><label class="form-label">Harvest Method</label>
          <select class="form-select" id="hl-method"><option>Combine Harvester</option><option>Manual (labour)</option><option>Thresher</option><option>Mixed</option></select></div>
        <div class="form-group"><label class="form-label">Harvest Cost PKR</label>
          <input class="form-input" id="hl-cost" type="number" min="0" placeholder="Combine hire, labour etc"></div>
        <div class="form-group"><label class="form-label">Sale Price/Maund PKR</label>
          <input class="form-input" id="hl-price" type="number" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Total Revenue PKR</label>
          <input class="form-input" id="hl-revenue" type="number" min="0" placeholder="Auto or manual"></div>
        <div class="form-group"><label class="form-label">Buyer Name</label>
          <input class="form-input" id="hl-buyer" placeholder="Mandi name or buyer"></div>
      </div>

        <textarea class="form-textarea" id="hl-notes" placeholder="Weather at harvest, losses, grade issues..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveHarvest()">Save</button>`);
  };

  window.saveHarvest = (editId=null) => {
    const date = document.getElementById('hl-date')?.value;
    if(!date){showToast('Date required');return;}
    const cid = document.getElementById('hl-crop')?.value;
    const fid = document.getElementById('hl-field')?.value;
    const totalYield = Number(document.getElementById('hl-yield')?.value||0);
    const area = Number(document.getElementById('hl-area')?.value||0);
    const yieldPerAc = Number(document.getElementById('hl-yield-ac')?.value||0)||(area>0?totalYield/area:0);
    const price = Number(document.getElementById('hl-price')?.value||0);
    const revenue = Number(document.getElementById('hl-revenue')?.value||0)||(totalYield*price);
    const data = {
      cropId:cid, cropName:crops.find(c=>c.id===cid)?.name||'',
      fieldId:fid, fieldName:fields.find(f=>f.id===fid)?.name||'',
      harvestDate:date, areaHarvestedAcres:area,
      totalYieldMaunds:totalYield, yieldPerAcreMaunds:Number(yieldPerAc.toFixed(2)),
      moistureAtHarvestPct:Number(document.getElementById('hl-moisture')?.value||0),
      grainQuality:document.getElementById('hl-quality')?.value||'B',
      harvestMethod:document.getElementById('hl-method')?.value||'Combine Harvester',
      harvestCostPKR:Number(document.getElementById('hl-cost')?.value||0),
      salePricePerMaundPKR:price, totalRevenuePKR:revenue,
      buyerName:document.getElementById('hl-buyer')?.value||'',
      notes:document.getElementById('hl-notes')?.value||''
    };
    if(editId) DB.updateItem('harvest_log',editId,data); else DB.addItem('harvest_log',data);
    // Update crop status to Harvested
    if(cid) DB.updateItem('crops',cid,{status:'Harvested',actualHarvestDate:date,actualYieldMaundsPerAcre:yieldPerAc,totalRevenuePKR:revenue});
    closeModal(); navigate('harvest_log'); showToast(editId?'✓ Updated':'✓ Harvest recorded');
  };

  window.delHarvest = (id) => openConfirm('Delete this harvest record?',()=>{DB.deleteItem('harvest_log',id);navigate('harvest_log');showToast('Deleted');});

  const totalYield = logs.reduce((s,l)=>s+Number(l.totalYieldMaunds||0),0);
  const totalRev = logs.reduce((s,l)=>s+Number(l.totalRevenuePKR||0),0);
  const avgYield = logs.length?( logs.reduce((s,l)=>s+Number(l.yieldPerAcreMaunds||0),0)/logs.length).toFixed(1):0;

  if(!logs.length) return `<div class="empty-state"><div class="empty-icon">🌾</div><div class="empty-title">No Harvest Records</div><div class="empty-desc">Log every harvest — yield per acre, moisture, quality grade, sale price and buyer. Builds your historical yield data.</div><button class="btn btn-primary" onclick="showAddHarvestModal()">+ Log Harvest</button></div><button class="fab" onclick="showAddHarvestModal()">+</button>`;

  return `
  <div class="stat-grid section">
    <div class="stat-card"><div class="stat-val" style="color:var(--p)">${totalYield.toFixed(0)}</div><div class="stat-label">Total Maunds</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--a)">${avgYield}</div><div class="stat-label">Avg M/Acre</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--p)">${formatPKR(totalRev)}</div><div class="stat-label">Total Revenue</div></div>
    <div class="stat-card"><div class="stat-val">${logs.length}</div><div class="stat-label">Harvests</div></div>
  </div>
  <div class="section">
    <div class="sec-hd"><div class="sec-title">HARVEST HISTORY</div><button class="btn btn-primary btn-sm" onclick="showAddHarvestModal()">+ Log</button></div>
    <div class="card">
      ${[...logs].sort((a,b)=>b.harvestDate.localeCompare(a.harvestDate)).map(l=>`
        <div class="list-item">
          <div class="li-icon">🌾</div>
          <div class="li-body">
            <div class="li-title">${l.cropName||'Crop'} ${l.fieldName?'· '+l.fieldName:''}</div>
            <div style="display:flex;gap:5px;margin:4px 0;flex-wrap:wrap">
              <span class="badge badge-green">${l.yieldPerAcreMaunds||0} M/ac</span>
              <span class="badge badge-muted">${l.grainQuality?.split(' ')[0]||'B'}</span>
              ${l.totalRevenuePKR?`<span class="badge badge-gold">${formatPKR(l.totalRevenuePKR)}</span>`:''}
            </div>
            <div class="li-meta">${l.harvestDate} · ${l.totalYieldMaunds||0} Maunds total${l.areaHarvestedAcres?' · '+l.areaHarvestedAcres+'ac':''}${l.moistureAtHarvestPct?' · '+l.moistureAtHarvestPct+'% moisture':''}${l.buyerName?' · '+l.buyerName:''}</div>
            ${l.notes?`<div style="font-size:.7rem;color:var(--t4);margin-top:2px">${l.notes.slice(0,80)}</div>`:''}
          </div>
          <button class="btn btn-danger btn-sm btn-icon" onclick="delHarvest('${l.id}')">🗑</button>
        </div>`).join('')}
    </div>
  </div>
  <button class="fab" onclick="showAddHarvestModal()">+</button>`;
};

    <div class="card">
      ${[...loans].sort((a,b)=>b.disbursementDate.localeCompare(a.disbursementDate)).map(ln=>{
        const out = Number(ln.outstandingPKR||ln.principalPKR||0);
        const pct = ln.principalPKR>0?Math.round((1-out/ln.principalPKR)*100):0;
        return `<div class="list-item">

};

// ─── CASHFLOW ─────────────────────────
PAGES.cashflow = function() {
  const finance = DB.getList('finance');
  const loans = DB.getList('loans');
  // Group finance by month
  const byMonth = {};
  finance.forEach(f => {
    const m = f.date.slice(0,7);
    if(!byMonth[m]) byMonth[m]={income:0,expense:0};
    if(f.type==='Income') byMonth[m].income+=Number(f.amount||0);
    else byMonth[m].expense+=Number(f.amount||0);
  });
  const months = Object.keys(byMonth).sort().reverse();
  const totalIn = finance.filter(f=>f.type==='Income').reduce((s,f)=>s+Number(f.amount||0),0);
  const totalOut = finance.filter(f=>f.type==='Expense').reduce((s,f)=>s+Number(f.amount||0),0);
  const netCash = totalIn - totalOut;
  const outstanding = loans.filter(l=>l.status==='Active'||l.status==='Partially Repaid').reduce((s,l)=>s+Number(l.outstandingPKR||0),0);

  return `
  <div class="stat-grid section">
    <div class="stat-card"><div class="stat-val income">${formatPKR(totalIn)}</div><div class="stat-label">Total In</div></div>
    <div class="stat-card"><div class="stat-val expense">${formatPKR(totalOut)}</div><div class="stat-label">Total Out</div></div>
    <div class="stat-card"><div class="stat-val" style="color:${netCash>=0?'var(--p)':'var(--red)'}">${formatPKR(Math.abs(netCash))}</div><div class="stat-label">${netCash>=0?'Net Positive':'Net Deficit'}</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--orange)">${formatPKR(outstanding)}</div><div class="stat-label">Loan Liability</div></div>
  </div>
  ${months.length===0?`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No Cash Flow Data</div><div class="empty-desc">Add income and expense entries in the Finance module to see monthly cash flow analysis.</div><button class="btn btn-primary" onclick="navigate('finance')">Go to Finance</button></div>`:`
  <div class="section">
    <div class="sec-hd"><div class="sec-title">MONTHLY CASH FLOW</div></div>
    <div class="card">
      ${months.map(m=>{
        const {income,expense} = byMonth[m];
        const net = income - expense;
        const [yr,mo] = m.split('-');
        const mName = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(mo)];
        return `<div style="padding:13px 18px;border-bottom:1px solid var(--gl)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-weight:700;color:var(--t1)">${mName} ${yr}</span>
            <span style="font-family:var(--mono);font-size:.82rem;font-weight:700;color:${net>=0?'var(--p)':'var(--red)'}">${net>=0?'+':''}${formatPKR(net)}</span>
          </div>
          <div style="display:flex;gap:10px;margin-bottom:6px">
            <span style="font-family:var(--mono);font-size:.65rem;color:var(--p)">↑ ${formatPKR(income)}</span>
            <span style="font-family:var(--mono);font-size:.65rem;color:var(--red)">↓ ${formatPKR(expense)}</span>
          </div>
          <div style="display:flex;gap:3px">
            <div style="height:5px;border-radius:3px;background:var(--p);width:${income>0?Math.round(income/(income+expense)*100):0}%;min-width:${income>0?4:0}px;flex-shrink:0"></div>
            <div style="height:5px;border-radius:3px;background:var(--red);flex:1"></div>
          </div>
        </div>`;}).join('')}
    </div>
  </div>
  <div class="section">
    <div class="sec-hd"><div class="sec-title">EXPENSE CATEGORIES</div></div>
    <div class="card card-body">
      ${(()=>{
        const cats={};
        finance.filter(f=>f.type==='Expense').forEach(f=>{cats[f.category]=(cats[f.category]||0)+Number(f.amount||0);});
        const tot = Object.values(cats).reduce((s,v)=>s+v,0)||1;
        return Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
          <div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="font-size:.78rem;color:var(--t1)">${cat}</span>
              <span style="font-family:var(--mono);font-size:.7rem;color:var(--a)">${formatPKR(amt)} (${Math.round(amt/tot*100)}%)</span>
            </div>
            <div class="progress"><div class="progress-fill" style="width:${Math.round(amt/tot*100)}%"></div></div>
          </div>`).join('');
      })()}
    </div>
  </div>`}`;
};

// ─── PROFIT & LOSS ────────────────────
PAGES.profit_loss = function() {
  const crops = DB.getList('crops');
  const finance = DB.getList('finance');
  const harvest = DB.getList('harvest_log');
  const fertilizer = DB.getList('fertilizer');
  const pesticide = DB.getList('pesticide');
  const irrigation = DB.getList('irrigation');

  // Per-crop P&L
  const cropPL = crops.map(c=>{
    const cIncome = finance.filter(f=>f.type==='Income'&&f.cropId===c.id).reduce((s,f)=>s+Number(f.amount||0),0)
      + harvest.filter(h=>h.cropId===c.id).reduce((s,h)=>s+Number(h.totalRevenuePKR||0),0);
    const cExpense = finance.filter(f=>f.type==='Expense'&&f.cropId===c.id).reduce((s,f)=>s+Number(f.amount||0),0)
      + fertilizer.filter(f=>f.cropId===c.id).reduce((s,f)=>s+Number(f.totalCostPKR||0),0)
      + pesticide.filter(f=>f.cropId===c.id).reduce((s,f)=>s+Number(f.totalCostPKR||0),0)
      + irrigation.filter(f=>f.cropId===c.id).reduce((s,f)=>s+Number(f.fuelCostPKR||0)+Number(f.labourCostPKR||0),0)
      + Number(c.seedCostPKR||0);
    return {...c, income:cIncome, expense:cExpense, net:cIncome-cExpense};
  }).sort((a,b)=>b.net-a.net);

  const totalIn = finance.filter(f=>f.type==='Income').reduce((s,f)=>s+Number(f.amount||0),0);
  const totalOut = finance.filter(f=>f.type==='Expense').reduce((s,f)=>s+Number(f.amount||0),0);
  const net = totalIn - totalOut;

  return `
  <div class="stat-grid section">
    <div class="stat-card"><div class="stat-val income">${formatPKR(totalIn)}</div><div class="stat-label">Total Revenue</div></div>
    <div class="stat-card"><div class="stat-val expense">${formatPKR(totalOut)}</div><div class="stat-label">Total Costs</div></div>
    <div class="stat-card"><div class="stat-val" style="color:${net>=0?'var(--p)':'var(--red)'}">${formatPKR(Math.abs(net))}</div><div class="stat-label">${net>=0?'Net Profit':'Net Loss'}</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--a)">${totalIn>0?Math.round(net/totalIn*100):0}%</div><div class="stat-label">Margin</div></div>
  </div>
  <div class="section">
    <div class="sec-hd"><div class="sec-title">PROFIT & LOSS BY CROP</div></div>
    ${cropPL.length===0?`<div class="empty-state"><div class="empty-icon">💰</div><div class="empty-title">No crop data yet</div><div class="empty-desc">Link income and expense records to crops to see per-crop profitability.</div></div>`:`
    <div class="card">
      ${cropPL.map(c=>`
        <div style="padding:14px 18px;border-bottom:1px solid var(--gl)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div style="flex:1">
              <div style="font-weight:700;color:var(--t1)">${c.name} <span style="color:var(--t3);font-weight:400;font-size:.75rem">${c.type}</span></div>
              <div style="font-family:var(--mono);font-size:.62rem;color:var(--t3);margin-top:3px">${c.areaAcres}ac · ${c.status}</div>
              <div style="display:flex;gap:10px;margin-top:6px">
                <span style="font-family:var(--mono);font-size:.65rem;color:var(--p)">↑ ${formatPKR(c.income)}</span>
                <span style="font-family:var(--mono);font-size:.65rem;color:var(--red)">↓ ${formatPKR(c.expense)}</span>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-family:var(--mono);font-size:.95rem;font-weight:700;color:${c.net>=0?'var(--p)':'var(--red)'}">${c.net>=0?'+':''}${formatPKR(c.net)}</div>
              ${c.areaAcres>0?`<div style="font-family:var(--mono);font-size:.62rem;color:var(--t3)">${formatPKR(Math.round(c.net/c.areaAcres))}/ac</div>`:''}
            </div>
          </div>
          ${c.expense>0?`<div class="progress" style="margin-top:8px"><div class="progress-fill" style="width:${Math.min(100,Math.round(c.income/(c.income+c.expense||1)*100))}%"></div></div>`:''}
        </div>`).join('')}
    </div>`}
  <div class="section" style="margin-top:18px">
    <div class="sec-hd"><div class="sec-title">OVERALL P&L STATEMENT</div></div>
    <div class="card card-body">
      ${[['Seeds & Planting','Seeds'],['Fertilizer & Inputs','Fertilizer'],['Pesticides & Herbicides','Pesticide'],['Irrigation Costs','Irrigation'],['Labour','Labour'],['Transport','Transport'],['Equipment & Maintenance','Equipment'],['Land Rent','Land Rent'],['Loan Payments','Loan Payment'],['Other Expenses','Other']].map(([label,cat])=>{
        const amt = finance.filter(f=>f.type==='Expense'&&f.category===cat).reduce((s,f)=>s+Number(f.amount||0),0);
        return amt>0?`<div class="finance-row"><div class="fr-label">${label}</div><span class="fr-amount expense">-${formatPKR(amt)}</span></div>`:'';
      }).join('')}
      <div class="divider"></div>
      <div class="finance-row"><div><div class="fr-label" style="font-size:.95rem">Net ${net>=0?'Profit':'Loss'}</div></div><span class="fr-amount" style="color:${net>=0?'var(--p)':'var(--red)'};font-size:1.05rem">${net>=0?'+':''}${formatPKR(Math.abs(net))}</span></div>
    </div>
  </div>`;
};

// ─── ET CALCULATOR ────────────────────
PAGES.et_calc = function() {
  return `
  <div class="section"><div class="alert alert-i">💧 Reference Evapotranspiration (ET₀) helps schedule irrigation. Based on Penman-Monteith simplified formula for Punjab conditions.</div></div>
  <div class="card section">
    <div class="card-hd"><div class="card-title">ET₀ CALCULATOR</div></div>
    <div class="card-body">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Max Temperature (°C)</label>

        <div class="form-group"><label class="form-label">Min Temperature (°C)</label>

    </div>
  </div>`;

window.calcET = () => {
  const tmax = Number(document.getElementById('et-tmax')?.value||0);
  const tmin = Number(document.getElementById('et-tmin')?.value||0);
  const rh = Number(document.getElementById('et-rh')?.value||60);
  const wind = Number(document.getElementById('et-wind')?.value||5)/3.6; // convert to m/s
  const sun = Number(document.getElementById('et-sun')?.value||8);
  const kc = Number(document.getElementById('et-crop')?.value||1.15);
  const area = Number(document.getElementById('et-area')?.value||1);
  const eff = Number(document.getElementById('et-eff')?.value||70)/100;
  const el = document.getElementById('et-result'); if(!el) return;
  if(!tmax||!tmin){el.innerHTML=''; return;}
  const tmean = (tmax+tmin)/2;
  // Hargreaves-Samani simplified (reasonable for Punjab without full met data)
  const ra = 15*Math.sin((new Date().getMonth()-1)*0.5235+0.5); // approximate daily radiation
  const et0 = Math.max(0, 0.0023*(tmean+17.8)*Math.sqrt(tmax-tmin)*(ra||8));
  const etcDay = et0*kc; // crop ET
  const acreInchPerDay = etcDay*0.00984; // mm to acre-inches
  const weeklyNeed = etcDay*7; // mm/week
  const acreInchWeek = acreInchPerDay*7;
  const grossIrrWeek = acreInchWeek/eff;
  const totalForArea = grossIrrWeek*area;
  el.innerHTML = `
  <div class="card section">
    <div class="card-hd"><div class="card-title">CALCULATION RESULT</div></div>
    <div class="card-body">
      <div class="stat-grid" style="margin-bottom:16px">
        <div class="stat-card"><div class="stat-val" style="color:var(--b3)">${et0.toFixed(2)}</div><div class="stat-label">ET₀ mm/day</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--p)">${etcDay.toFixed(2)}</div><div class="stat-label">Crop ET mm/day</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--a)">${weeklyNeed.toFixed(1)}</div><div class="stat-label">Weekly Need mm</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--orange)">${grossIrrWeek.toFixed(2)}</div><div class="stat-label">Gross Irr (ac-in/ac)</div></div>
      </div>
      <div class="alert alert-s">
        💡 For ${area} acre${area>1?'s':''}: Apply <strong>${totalForArea.toFixed(2)} acre-inches</strong> per week (at ${Math.round(eff*100)}% efficiency).
        At flood irrigation, this = approx <strong>${Math.round(etcDay*24/area)} hours</strong> of tubewell/canal flow per acre.
      </div>
    </div>
  </div>`;
};

PAGES.gypsum = function() {
  return `
  <div class="section"><div class="alert alert-i">🧮 Gypsum (Calcium Sulphate) improves saline-sodic soils common in Sheikhupura district. Required when EC > 4 dS/m or SAR > 13.</div></div>
  <div class="card section">

    <div class="card-body">

          <input class="form-input" id="gy-ph" type="number" step="0.1" min="6" max="10" placeholder="e.g. 8.5" oninput="calcGypsum()"></div>
        <div class="form-group"><label class="form-label">EC (dS/m)</label>
          <input class="form-input" id="gy-ec" type="number" step="0.1" min="0" placeholder="e.g. 4.5" oninput="calcGypsum()"></div>
        <div class="form-group"><label class="form-label">SAR (Sodium Adsorption Ratio)</label>
          <input class="form-input" id="gy-sar" type="number" step="0.5" min="0" placeholder="From soil test"></div>
        <div class="form-group"><label class="form-label">Soil Depth to Reclaim (cm)</label>
          <select class="form-select" id="gy-depth" onchange="calcGypsum()">
            <option value="15">15 cm (6 inches)</option>
            <option value="30" selected>30 cm (1 foot)</option>
            <option value="45">45 cm (18 inches)</option>
          </select></div>
        <div class="form-group"><label class="form-label">Field Area (acres)</label>
          <input class="form-input" id="gy-area" type="number" step="0.5" value="1" oninput="calcGypsum()"></div>
        <div class="form-group"><label class="form-label">Gypsum Purity %</label>
          <input class="form-input" id="gy-purity" type="number" value="70" min="50" max="100" oninput="calcGypsum()"></div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px" onclick="calcGypsum()">🧮 Calculate Gypsum Dose</button>
      <div id="gy-result" style="margin-top:14px"></div>
    </div>
  </div>
  <div class="card section">
    <div class="card-hd"><div class="card-title">GENERAL GUIDELINES — Punjab Sodic Soils</div></div>
    <div class="card-body">
      ${[['pH < 8.0, EC < 2 dS/m','No gypsum needed. Normal fertilization.','badge-green'],['pH 8.0-8.5, EC 2-4 dS/m','Light sodicity. 1-2 tonnes gypsum/acre.','badge-amber'],['pH 8.5-9.0, EC 4-6 dS/m','Moderate sodicity. 2-4 tonnes/acre. Leach with water.','badge-red'],['pH > 9.0, EC > 6 dS/m','Severe sodicity. 4+ tonnes/acre. Multiple applications.','badge-red']].map(([cond,action,badge])=>`
        <div style="padding:9px 0;border-bottom:1px solid var(--gl)">
          <div style="display:flex;align-items:flex-start;gap:10px">
            <span class="badge ${badge}" style="flex-shrink:0;margin-top:2px">•</span>
            <div><div style="font-size:.78rem;font-weight:600;color:var(--t1)">${cond}</div><div style="font-size:.73rem;color:var(--t3);margin-top:2px">${action}</div></div>
          </div>
        </div>`).join('')}

window.calcGypsum = () => {
  const ph = Number(document.getElementById('gy-ph')?.value||0);
  const ec = Number(document.getElementById('gy-ec')?.value||0);
  const depth = Number(document.getElementById('gy-depth')?.value||30);
  const area = Number(document.getElementById('gy-area')?.value||1);
  const purity = Number(document.getElementById('gy-purity')?.value||70)/100;
  const el = document.getElementById('gy-result'); if(!el) return;
  if(!ph&&!ec){return;}
  // Gypsum requirement based on EC and pH (simplified Punjab AARI formula)
  // GR (t/ha) = (ECe - 4) * 1.72 for EC > 4, adjusted for depth and purity
  let grTPerHa = 0;
  if(ec>4) grTPerHa = (ec-4)*1.72*(depth/30);
  else if(ph>8.5) grTPerHa = (ph-8.5)*3.5*(depth/30);
  const grPure = grTPerHa/purity;
  const grPerAcre = grPure/2.47;
  const totalTonnes = grPerAcre*area;
  const bags50kg = Math.ceil(totalTonnes*1000/50);
  const costEstimate = bags50kg*250; // ~Rs.250 per 50kg bag
  el.innerHTML = totalTonnes<0.1?`<div class="alert alert-s">✅ Soil does not appear to need gypsum application based on entered values.</div>`:`
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val" style="color:var(--a)">${grPerAcre.toFixed(2)}</div><div class="stat-label">Tonnes/acre</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--p)">${totalTonnes.toFixed(2)}</div><div class="stat-label">Total tonnes (${area}ac)</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--b3)">${bags50kg}</div><div class="stat-label">Bags (50kg)</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--orange)">${formatPKR(costEstimate)}</div><div class="stat-label">Est. Cost</div></div>
  </div>
  <div class="alert alert-i" style="margin-top:12px">Apply gypsum before irrigation, plough in lightly. Follow with 3-4 heavy irrigations to leach salts. Reassess soil after 6 months.</div>`;
};

PAGES.resilience = function() {
  const fields = DB.getList('fields');
  const crops = DB.getList('crops');
  const soilTests = DB.getList('soil_tests');
  const bioHealth = DB.getList('bio_health');
  const finance = DB.getList('finance');

  // Calculate resilience scores
  const diversityScore = Math.min(10, crops.filter(c=>c.status==='Growing'||c.status==='At Risk').length * 2.5);
  const soilScore = soilTests.length > 0 ? Math.min(10, soilTests.reduce((s,t)=>{
    let sc=5; if(t.pH>=6.5&&t.pH<=8.0) sc+=2; if(t.ec&&t.ec<4) sc+=1.5; if(t.organicMatterPercent&&t.organicMatterPercent>0.75) sc+=1.5; return s+sc;
  },0)/soilTests.length) : 3;
  const bioScore = bioHealth.length > 0 ? bioHealth[bioHealth.length-1].overallScore : 3;
  const waterScore = fields.some(f=>f.waterSource?.includes('Tubewell')&&f.waterSource?.includes('Canal')) ? 8 : fields.some(f=>f.waterSource?.length>1) ? 6 : 4;
  const finScore = Math.min(10, finance.filter(f=>f.type==='Income').reduce((s,f)=>s+Number(f.amount||0),0) / Math.max(1,finance.filter(f=>f.type==='Expense').reduce((s,f)=>s+Number(f.amount||0),0)) * 5);
  const overallScore = ((diversityScore+soilScore+bioScore+waterScore+finScore)/5).toFixed(1);

  const metrics = [
    {label:'Crop Diversity',score:diversityScore.toFixed(1),desc:'Variety of crops grown simultaneously',tip:'Grow 3+ crop types to reduce market and pest risk'},
    {label:'Soil Health',score:soilScore.toFixed(1),desc:'Based on soil test data (pH, EC, OM)',tip:'Regular gypsum, compost, and balanced nutrition'},
    {label:'Biological Health',score:bioScore.toFixed(1),desc:'Earthworms, aggregates, root development',tip:'Reduce tillage, add organic matter'},
    {label:'Water Security',score:waterScore.toFixed(1),desc:'Diversity of water sources',tip:'Have both canal and tubewell access'},
    {label:'Financial Health',score:finScore.toFixed(1),desc:'Income to expense ratio',tip:'Keep income/expense ratio > 1.5'},
  ];

  return `
  <div class="wx-widget section" style="text-align:center">
    <div style="font-family:var(--mono);font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Farm Resilience Index</div>
    <div style="font-size:4rem;font-weight:800;color:${Number(overallScore)>=7?'var(--p)':Number(overallScore)>=5?'var(--a)':'var(--red)'};line-height:1;letter-spacing:-.04em">${overallScore}</div>
    <div style="font-family:var(--mono);font-size:.65rem;color:var(--t3);margin-top:6px">out of 10 · ${Number(overallScore)>=7?'Strong':'Medium'} Resilience</div>
  </div>
  <div class="card section">
    <div class="card-hd"><div class="card-title">RESILIENCE BREAKDOWN</div></div>
    <div class="card-body">
      ${metrics.map(m=>`
        <div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div><div style="font-size:.82rem;font-weight:600;color:var(--t1)">${m.label}</div>
              <div style="font-family:var(--mono);font-size:.58rem;color:var(--t4)">${m.desc}</div></div>
            <span style="font-family:var(--mono);font-weight:700;font-size:.9rem;color:${Number(m.score)>=7?'var(--p)':Number(m.score)>=5?'var(--a)':'var(--red)'}">${m.score}/10</span>
          </div>
          <div class="progress"><div class="progress-fill" style="width:${Number(m.score)*10}%;background:${Number(m.score)>=7?'var(--p)':Number(m.score)>=5?'var(--a)':'var(--red)'}"></div></div>
          <div style="font-family:var(--mono);font-size:.58rem;color:var(--t3);margin-top:3px">💡 ${m.tip}</div>
        </div>`).join('')}
    </div>
  </div>
  <div class="alert alert-i section">Resilience scores auto-calculate from your logged data. The more you record, the more accurate your score becomes. Update soil tests, crop diversity, and financial records regularly.</div>`;
};

PAGES.cost_per_acre = function() {
  const crops = DB.getList('crops');
  const finance = DB.getList('finance');
  const fertilizer = DB.getList('fertilizer');
  const pesticide = DB.getList('pesticide');
  const irrigation = DB.getList('irrigation');
  const seeds = DB.getList('seeds');

  if(!crops.length) return `<div class="empty-state"><div class="empty-icon">💰</div><div class="empty-title">No Crops Added</div><div class="empty-desc">Add crops first, then link your expenses to them to see cost-per-acre breakdown.</div><button class="btn btn-primary" onclick="navigate('crops')">Go to Crops</button></div>`;

  const cropCosts = crops.map(c=>{
    const finExp = finance.filter(f=>f.type==='Expense'&&f.cropId===c.id).reduce((s,f)=>s+Number(f.amount||0),0);
    const fertCost = fertilizer.filter(f=>f.cropId===c.id).reduce((s,f)=>s+Number(f.totalCostPKR||0),0);
    const pestCost = pesticide.filter(f=>f.cropId===c.id).reduce((s,f)=>s+Number(f.totalCostPKR||0),0);
    const irrCost = irrigation.filter(f=>f.cropId===c.id).reduce((s,f)=>s+Number(f.fuelCostPKR||0)+Number(f.labourCostPKR||0),0);
    const seedCost = Number(c.seedCostPKR||0);
    const total = finExp+fertCost+pestCost+irrCost+seedCost;
    const perAcre = c.areaAcres>0?(total/c.areaAcres).toFixed(0):0;
    return {...c, finExp, fertCost, pestCost, irrCost, seedCost, total, perAcre:Number(perAcre)};
  }).sort((a,b)=>b.perAcre-a.perAcre);

  return `
  <div class="section">
    <div class="sec-hd"><div class="sec-title">COST PER ACRE BY CROP</div></div>
    <div class="alert alert-i section">Costs pulled from Finance, Fertilizer, Pesticide, Irrigation logs linked to each crop. Link your expense entries to crops for accurate analysis.</div>
    ${cropCosts.map(c=>`
      <div class="card section">
        <div class="card-hd">
          <div><div class="card-title">${c.name}</div><div style="font-size:.65rem;color:var(--t3);padding-left:10px">${c.type} · ${c.areaAcres}ac · ${c.status}</div></div>
          <div style="text-align:right"><div style="font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--a)">${formatPKR(c.perAcre)}</div><div style="font-size:.58rem;color:var(--t4)">per acre</div></div>
        </div>
        <div class="card-body">
          ${c.seedCost?`<div class="finance-row"><div class="fr-label">Seed Cost</div><span class="fr-amount expense">-${formatPKR(c.seedCost)}</span></div>`:''}
          ${c.fertCost?`<div class="finance-row"><div class="fr-label">Fertilizer</div><span class="fr-amount expense">-${formatPKR(c.fertCost)}</span></div>`:''}
          ${c.pestCost?`<div class="finance-row"><div class="fr-label">Pesticides</div><span class="fr-amount expense">-${formatPKR(c.pestCost)}</span></div>`:''}
          ${c.irrCost?`<div class="finance-row"><div class="fr-label">Irrigation</div><span class="fr-amount expense">-${formatPKR(c.irrCost)}</span></div>`:''}
          ${c.finExp?`<div class="finance-row"><div class="fr-label">Other Expenses</div><span class="fr-amount expense">-${formatPKR(c.finExp)}</span></div>`:''}
          ${c.total===0?`<div style="color:var(--t4);font-family:var(--mono);font-size:.68rem">No linked expenses yet. Attach expense records to this crop.</div>`:
          `<div class="divider"></div>
          <div class="finance-row"><div><div class="fr-label" style="font-size:.9rem">Total Cost</div>${c.areaAcres>0?`<div class="fr-meta">${formatPKR(c.perAcre)}/acre</div>`:''}</div><span class="fr-amount expense" style="font-size:1rem">-${formatPKR(c.total)}</span></div>`}
        </div>
      </div>`).join('')}
  </div>`;
};
