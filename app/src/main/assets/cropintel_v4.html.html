<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050a05">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CropIntel — Agricultural OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@300;400;500&family=Noto+Nastaliq+Urdu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@300;400;500&family=Noto+Nastaliq+Urdu:wght@400;500;700&display=swap');

/* ═══════════════════════════════════════
   CROPINTEL — NEXT-GEN PRECISION AG UI
   Premium Dark • Glassmorphism • Bold
═══════════════════════════════════════ */

:root {
  /* Core backgrounds - deep rich blacks */
  --void:     #030507;
  --bg0:      #060a0f;
  --bg1:      #090e15;
  --bg2:      #0d1420;
  --bg3:      #111b2a;
  --bg4:      #162235;
  --bg5:      #1a2a40;

  /* Primary - electric emerald */
  --p:        #00d48a;
  --p-dim:    #00a96e;
  --p-dark:   #006b45;
  --p-glow:   rgba(0,212,138,0.18);
  --p-glowl:  rgba(0,212,138,0.08);

  /* Accent - amber gold */
  --a:        #f5a623;
  --a-dim:    #c4841c;
  --a-glow:   rgba(245,166,35,0.15);

  /* Blue accent */
  --blue:     #3d9eff;
  --blue-glow:rgba(61,158,255,0.15);

  /* Text */
  --t1:       #eef4ff;
  --t2:       #8ba3c7;
  --t3:       #4a6285;
  --t4:       #253550;
  --t5:       #152030;

  /* Glass borders */
  --gl:       rgba(255,255,255,0.06);
  --gl2:      rgba(255,255,255,0.03);
  --gl-p:     rgba(0,212,138,0.2);
  --gl-pa:    rgba(0,212,138,0.08);

  /* Status */
  --green:    #00d48a;
  --red:      #ff4f6d;
  --orange:   #ff8c42;
  --yellow:   #f5a623;
  --cyan:     #00c8ff;

  /* Fonts */
  --font:     'Cabinet Grotesk', sans-serif;
  --display:  'Clash Display', sans-serif;
  --mono:     'JetBrains Mono', monospace;
  --urdu:     'Noto Nastaliq Urdu', serif;

  /* Radius */
  --r-sm:   8px;
  --r-md:   14px;
  --r-lg:   20px;
  --r-xl:   28px;

  /* Sidebar */
  --sb-w: 264px;
}

/* THEMES */
[data-theme="neon"] {
  --p:#bf00ff; --p-dim:#9900cc; --p-dark:#5c007a;
  --p-glow:rgba(191,0,255,0.18); --p-glowl:rgba(191,0,255,0.08);
  --a:#00ffcc; --a-glow:rgba(0,255,204,0.15);
  --gl-p:rgba(191,0,255,0.2); --gl-pa:rgba(191,0,255,0.08);
}
[data-theme="solar"] {
  --bg0:#08060f; --bg1:#0e0a1a; --bg2:#140f25; --bg3:#1a1530; --bg4:#201c3a;
  --p:#ff6b35; --p-dim:#cc5529; --p-dark:#7a3319;
  --p-glow:rgba(255,107,53,0.18); --p-glowl:rgba(255,107,53,0.08);
  --a:#ffd700; --a-glow:rgba(255,215,0,0.15);
  --gl-p:rgba(255,107,53,0.2); --gl-pa:rgba(255,107,53,0.08);
}
[data-theme="ocean"] {
  --bg0:#020610; --bg1:#050c1e; --bg2:#08122c; --bg3:#0c183a; --bg4:#101e48;
  --p:#00c8ff; --p-dim:#009acc; --p-dark:#005c7a;
  --p-glow:rgba(0,200,255,0.18); --p-glowl:rgba(0,200,255,0.08);
  --a:#ff6b9d; --a-glow:rgba(255,107,157,0.15);
  --gl-p:rgba(0,200,255,0.2); --gl-pa:rgba(0,200,255,0.08);
}
[data-theme="gold"] {
  --bg0:#080700; --bg1:#100e00; --bg2:#181500; --bg3:#201c00; --bg4:#282300;
  --p:#f5c842; --p-dim:#c4a035; --p-dark:#7a6320;
  --p-glow:rgba(245,200,66,0.18); --p-glowl:rgba(245,200,66,0.08);
  --a:#ff5f5f; --a-glow:rgba(255,95,95,0.15);
  --gl-p:rgba(245,200,66,0.2); --gl-pa:rgba(245,200,66,0.08);
  --t2:#b8a870; --t3:#7a6e40; --t4:#40380a;
}
[data-theme="light"] {
  --void:#f0f4ff; --bg0:#e8eeff; --bg1:#dde6ff; --bg2:#d0daff;
  --bg3:#c3cef5; --bg4:#b5c0eb; --bg5:#a8b2e0;
  --t1:#0a1628; --t2:#2a4470; --t3:#4a6490; --t4:#8aa0c0;
  --gl:rgba(0,0,0,0.07); --gl2:rgba(0,0,0,0.03);
  --gl-p:rgba(0,180,110,0.25); --gl-pa:rgba(0,180,110,0.08);
  --p:#00a86b; --p-dim:#007a4e; --p-dark:#004d31;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg0);
  color: var(--t1);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Animated background gradient */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 30%, rgba(0,212,138,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 85% 70%, rgba(61,158,255,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 50% 10%, rgba(245,166,35,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
  animation: bgShift 20s ease-in-out infinite alternate;
}
@keyframes bgShift {
  0%   { opacity: 1; }
  50%  { opacity: 0.7; }
  100% { opacity: 1; }
}

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--t4); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--p); }

/* ═══════════════════════════════════
   LAYOUT
═══════════════════════════════════ */
#app {
  position: relative;
  z-index: 1;
  display: flex;
  height: 100dvh;
  overflow: hidden;
}

/* ─── SIDEBAR ────────────────────── */
#sidebar {
  width: var(--sb-w);
  min-width: var(--sb-w);
  background: linear-gradient(180deg, rgba(9,14,21,0.98) 0%, rgba(6,10,15,0.99) 100%);
  border-right: 1px solid var(--gl);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  z-index: 10;
  backdrop-filter: blur(24px);
}

#sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 9;
}

@media(max-width:768px) {
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #sidebar-overlay.show { display: block; }
}

/* Sidebar logo */
.sidebar-logo {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--gl);
  flex-shrink: 0;
  position: relative;
}

.sidebar-logo::after {
  content: '';
  position: absolute;
  bottom: 0; left: 20px; right: 20px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--p-dim), transparent);
  opacity: 0.4;
}

.logo-text {
  font-family: var(--display);
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--t1);
  line-height: 1;
}
.logo-text span {
  color: var(--p);
  filter: drop-shadow(0 0 12px var(--p));
}

.logo-sub {
  font-family: var(--mono);
  font-size: 0.55rem;
  color: var(--t4);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-top: 5px;
}

/* Sidebar nav */
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 24px;
  overscroll-behavior: contain;
}

.nav-cat { margin-bottom: 1px; }

.nav-cat-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 18px 7px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--t4);
  font-family: var(--mono);
  font-size: 0.57rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
  transition: color 0.15s;
  text-align: left;
  margin-top: 8px;
}
.nav-cat-btn:hover { color: var(--t3); }
.nav-cat-btn .cat-icon { font-size: 0.85rem; line-height: 1; }
.nav-cat-btn .cat-label { flex: 1; }
.nav-cat-btn .chev { font-size: 0.5rem; transition: transform 0.2s; opacity: 0.5; }
.nav-cat.open .chev { transform: rotate(180deg); }
.nav-items { display: none; }
.nav-cat.open .nav-items { display: block; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 18px 6px 28px;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--t3);
  cursor: pointer;
  transition: all 0.15s;
  border-left: 2px solid transparent;
  text-decoration: none;
  position: relative;
}
.nav-item:hover {
  color: var(--t2);
  background: var(--gl2);
  padding-left: 32px;
}
.nav-item.active {
  color: var(--p);
  background: var(--gl-pa);
  border-left-color: var(--p);
  font-weight: 600;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: -1px; top: 0; bottom: 0;
  width: 2px;
  background: var(--p);
  box-shadow: 0 0 8px var(--p);
}

.badge-new {
  font-family: var(--mono);
  font-size: 0.44rem;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(245,166,35,0.15);
  color: var(--a);
  border: 1px solid rgba(245,166,35,0.3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-left: auto;
}

/* Sidebar footer */
.sidebar-footer {
  padding: 14px 18px;
  border-top: 1px solid var(--gl);
  flex-shrink: 0;
}
.sidebar-footer-loc {
  font-family: var(--mono);
  font-size: 0.56rem;
  color: var(--t4);
  letter-spacing: 0.06em;
}

/* ─── MAIN AREA ──────────────────── */
#main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ─── TOPBAR ─────────────────────── */
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  height: 56px;
  background: rgba(9,14,21,0.85);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--gl);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 5;
}

#menu-btn {
  display: none;
  background: none;
  border: 1px solid var(--gl);
  border-radius: var(--r-sm);
  color: var(--t3);
  cursor: pointer;
  padding: 7px 9px;
  font-size: 1rem;
  transition: all 0.15s;
  line-height: 1;
}
#menu-btn:hover { color: var(--t1); border-color: var(--gl-p); background: var(--gl-pa); }
@media(max-width:768px) { #menu-btn { display: flex; align-items: center; } }

#page-title {
  font-family: var(--display);
  font-size: 1rem;
  font-weight: 600;
  color: var(--t1);
  flex: 1;
  letter-spacing: -0.02em;
}

.topbar-clock {
  font-family: var(--mono);
  text-align: right;
}
.topbar-clock .time {
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--t1);
  letter-spacing: 0.05em;
}
#clock-date {
  font-size: 0.58rem;
  color: var(--t3);
  letter-spacing: 0.04em;
}

.lang-btn {
  background: linear-gradient(145deg, var(--bg3) 0%, var(--bg2) 100%);
  border: 1px solid var(--gl);
  border-radius: 30px;
  padding: 3px;
  display: flex;
  gap: 2px;
}
.lang-btn button {
  padding: 4px 12px;
  border-radius: 26px;
  border: none;
  background: transparent;
  color: var(--t3);
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s;
}
.lang-btn button.active {
  background: var(--p);
  color: var(--void);
  font-weight: 700;
  box-shadow: 0 0 12px var(--p-glow);
}

.topbar-icon-btn {
  width: 34px; height: 34px;
  border-radius: var(--r-sm);
  border: 1px solid var(--gl);
  background: transparent;
  color: var(--t3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem;
  transition: all 0.15s;
}
.topbar-icon-btn:hover { color: var(--t1); border-color: var(--gl-p); background: var(--gl-pa); }

/* ─── PAGE CONTENT ───────────────── */
#page-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  padding-bottom: 100px;
  animation: pageIn 0.22s cubic-bezier(0.4,0,0.2,1);
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════
   GLASS CARD SYSTEM
═══════════════════════════════════ */
.card {
  background: linear-gradient(145deg, rgba(17,27,42,0.9) 0%, rgba(9,14,21,0.95) 100%);
  border: 1px solid var(--gl);
  border-radius: var(--r-lg);
  overflow: hidden;
  backdrop-filter: blur(12px);
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
}
.card:hover { border-color: var(--gl-p); }

.card-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--gl);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.card-title {
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--p);
  display: flex; align-items: center; gap: 8px;
}
.card-title::before {
  content: '';
  width: 3px; height: 12px;
  background: var(--p);
  border-radius: 2px;
  box-shadow: 0 0 8px var(--p);
}
.card-body { padding: 16px 20px; }

/* ─── STAT CARDS ─────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 12px;
}

.stat-card {
  background: linear-gradient(135deg, var(--bg3) 0%, var(--bg2) 100%);
  border: 1px solid var(--gl);
  border-radius: var(--r-md);
  padding: 16px 14px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all 0.2s;
}
.stat-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--p-glowl), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}
.stat-card:hover { border-color: var(--gl-p); transform: translateY(-2px); }
.stat-card:hover::after { opacity: 1; }

.stat-val {
  font-family: var(--display);
  font-size: 1.65rem;
  font-weight: 700;
  color: var(--t1);
  letter-spacing: -0.03em;
  line-height: 1;
}
.stat-label {
  font-family: var(--mono);
  font-size: 0.53rem;
  color: var(--t3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 5px;
}

/* ─── BUTTONS ────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 18px;
  border-radius: var(--r-sm);
  font-family: var(--font);
  font-size: 0.8rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all 0.18s;
  letter-spacing: 0.01em;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  overflow: hidden;
}
.btn:active { transform: scale(0.96); }

.btn-primary {
  background: var(--p);
  color: var(--void);
  box-shadow: 0 4px 16px rgba(0,212,138,0.25);
}
.btn-primary:hover {
  background: #00f0a0;
  box-shadow: 0 6px 24px rgba(0,212,138,0.4);
  transform: translateY(-1px);
}

.btn-ghost {
  background: transparent;
  color: var(--t2);
  border: 1px solid var(--gl);
}
.btn-ghost:hover {
  color: var(--t1);
  border-color: var(--gl-p);
  background: var(--gl-pa);
}

.btn-danger {
  background: rgba(255,79,109,0.12);
  color: #ff4f6d;
  border: 1px solid rgba(255,79,109,0.25);
}
.btn-danger:hover { background: rgba(255,79,109,0.2); }

.btn-amber {
  background: rgba(245,166,35,0.12);
  color: var(--a);
  border: 1px solid rgba(245,166,35,0.25);
}
.btn-amber:hover { background: rgba(245,166,35,0.22); }

.btn-sm { padding: 5px 12px; font-size: 0.7rem; border-radius: 6px; }
.btn-icon { padding: 7px 8px; }

/* ─── BADGES ─────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px;
  border-radius: 20px;
  font-family: var(--mono);
  font-size: 0.58rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  border: 1px solid;
}
.badge-green  { background: rgba(0,212,138,0.12); color: #00d48a; border-color: rgba(0,212,138,0.25); }
.badge-gold   { background: rgba(245,166,35,0.12); color: #f5a623; border-color: rgba(245,166,35,0.25); }
.badge-red    { background: rgba(255,79,109,0.12); color: #ff4f6d; border-color: rgba(255,79,109,0.25); }
.badge-amber  { background: rgba(255,140,66,0.12); color: #ff8c42; border-color: rgba(255,140,66,0.25); }
.badge-blue   { background: rgba(0,200,255,0.12); color: #00c8ff; border-color: rgba(0,200,255,0.25); }
.badge-muted  { background: rgba(255,255,255,0.04); color: var(--t3); border-color: var(--gl); }
.badge-purple { background: rgba(168,85,247,0.12); color: #a855f7; border-color: rgba(168,85,247,0.25); }

/* ─── FORMS ──────────────────────── */
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--t3);
}
.form-input, .form-select, .form-textarea {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--gl);
  border-radius: var(--r-sm);
  padding: 10px 14px;
  color: var(--t1);
  font-family: var(--font);
  font-size: 0.85rem;
  outline: none;
  transition: all 0.18s;
  width: 100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--p);
  background: rgba(0,212,138,0.04);
  box-shadow: 0 0 0 3px rgba(0,212,138,0.1);
}
.form-input:hover, .form-select:hover, .form-textarea:hover {
  border-color: rgba(255,255,255,0.12);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--t4); }
.form-select { appearance: none; cursor: pointer; }
.form-select option { background: var(--bg2); color: var(--t1); }
.form-textarea { resize: vertical; min-height: 72px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media(max-width:480px) { .form-grid { grid-template-columns: 1fr; } }

/* ─── FAB ────────────────────────── */
.fab {
  position: fixed; bottom: 28px; right: 22px;
  width: 54px; height: 54px;
  border-radius: 50%;
  background: var(--p);
  color: var(--void);
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(0,212,138,0.4);
  transition: all 0.18s;
  z-index: 6;
  font-weight: 700;
}
.fab:hover { background: #00f0a0; transform: scale(1.08) translateY(-2px); box-shadow: 0 12px 40px rgba(0,212,138,0.5); }
.fab:active { transform: scale(0.94); }

/* ─── MODAL ──────────────────────── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
@media(min-width:600px) { .modal-overlay { align-items: center; } }

.modal {
  background: linear-gradient(145deg, var(--bg2) 0%, var(--bg1) 100%);
  border: 1px solid var(--gl);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  width: 100%;
  max-width: 600px;
  max-height: 92dvh;
  overflow: hidden;
  display: flex; flex-direction: column;
  animation: modalUp 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 -24px 60px rgba(0,0,0,0.5);
}
@media(min-width:600px) {
  .modal { border-radius: var(--r-xl); box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
}
@keyframes modalUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.modal-handle { display: flex; justify-content: center; padding: 12px 0 4px; }
.modal-handle-bar {
  width: 38px; height: 4px;
  background: var(--gl);
  border-radius: 2px;
}
@media(min-width:600px) { .modal-handle { display: none; } }

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px 16px;
  border-bottom: 1px solid var(--gl);
  flex-shrink: 0;
}
.modal-title {
  font-family: var(--display);
  font-size: 1rem;
  font-weight: 600;
  color: var(--t1);
  letter-spacing: -0.02em;
}
.modal-close {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--gl);
  color: var(--t3);
  cursor: pointer;
  width: 30px; height: 30px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem;
  transition: all 0.15s;
}
.modal-close:hover { color: var(--t1); border-color: var(--gl-p); background: var(--gl-pa); }
.modal-body { overflow-y: auto; padding: 20px 22px; flex: 1; }
.modal-footer {
  padding: 16px 22px;
  border-top: 1px solid var(--gl);
  display: flex; gap: 10px;
  flex-shrink: 0;
}
.modal-footer .btn { flex: 1; justify-content: center; }

/* ─── TABLES ─────────────────────── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  font-family: var(--mono);
  font-size: 0.57rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--t3);
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--gl);
  white-space: nowrap;
  background: rgba(0,212,138,0.03);
}
.data-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--gl);
  color: var(--t2);
  font-size: 0.81rem;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--gl2); }

/* ─── INLINE EDIT ────────────────── */
.ie {
  display: inline-flex; align-items: center; gap: 5px;
  cursor: pointer; padding: 2px 6px; border-radius: 6px;
  transition: background 0.12s;
  max-width: 100%;
}
.ie:hover { background: var(--gl-pa); }
.ie .ie-icon { opacity: 0; font-size: 0.6rem; color: var(--p); transition: opacity 0.12s; flex-shrink: 0; }
.ie:hover .ie-icon { opacity: 1; }
.ie-editing input, .ie-editing select {
  background: rgba(0,212,138,0.06); border: 1px solid var(--p);
  border-radius: 6px; padding: 3px 10px;
  color: var(--t1); font-family: var(--font); font-size: inherit;
  outline: none; box-shadow: 0 0 0 3px var(--p-glow);
  min-width: 60px; max-width: 200px;
}

/* ─── PROGRESS ───────────────────── */
.progress { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--p-dark), var(--p));
  box-shadow: 0 0 8px var(--p-glow);
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}

/* ─── ALERTS ─────────────────────── */
.alert {
  padding: 12px 16px;
  border-radius: var(--r-sm);
  font-size: 0.79rem;
  display: flex; gap: 10px; align-items: flex-start;
  line-height: 1.5;
}
.alert-w { background: rgba(255,140,66,0.08); border: 1px solid rgba(255,140,66,0.2); color: #ff8c42; }
.alert-s { background: rgba(0,212,138,0.08); border: 1px solid rgba(0,212,138,0.2); color: var(--p); }
.alert-d { background: rgba(255,79,109,0.08); border: 1px solid rgba(255,79,109,0.2); color: #ff4f6d; }
.alert-i { background: rgba(61,158,255,0.08); border: 1px solid rgba(61,158,255,0.2); color: var(--blue); }

/* ─── CHAT ───────────────────────── */
.chat-list { display: flex; flex-direction: column; gap: 12px; }
.chat-msg {
  max-width: 88%; padding: 12px 16px;
  border-radius: var(--r-md); font-size: 0.83rem; line-height: 1.65; white-space: pre-wrap;
}
.chat-user {
  background: linear-gradient(135deg, var(--p-dark), rgba(0,212,138,0.2));
  color: var(--t1); align-self: flex-end;
  border-bottom-right-radius: 4px;
  border: 1px solid var(--gl-p);
}
.chat-ai {
  background: linear-gradient(135deg, var(--bg3), var(--bg2));
  color: var(--t2); align-self: flex-start;
  border-bottom-left-radius: 4px;
  border: 1px solid var(--gl);
  border-left: 2px solid var(--p);
}
.chat-thinking {
  display: flex; gap: 5px; align-items: center;
  padding: 14px 16px;
  background: var(--bg3); border-radius: var(--r-md);
  align-self: flex-start; border: 1px solid var(--gl);
  border-bottom-left-radius: 4px;
}
.chat-thinking span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--p); animation: think 1.2s infinite;
}
.chat-thinking span:nth-child(2) { animation-delay: 0.2s; }
.chat-thinking span:nth-child(3) { animation-delay: 0.4s; }
@keyframes think {
  0%,80%,100% { transform:scale(0.4); opacity:0.3; }
  40% { transform:scale(1); opacity:1; box-shadow: 0 0 8px var(--p); }
}

/* ─── TOGGLE ─────────────────────── */
.toggle { position: relative; width: 44px; height: 25px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: var(--bg4); border: 1px solid var(--gl);
  border-radius: 13px; cursor: pointer; transition: all 0.22s;
}
.toggle-slider::before {
  content: ''; position: absolute;
  width: 17px; height: 17px;
  left: 3px; top: 3px;
  background: var(--t3); border-radius: 50%;
  transition: all 0.22s;
}
.toggle input:checked + .toggle-slider {
  background: var(--p-dark);
  border-color: var(--p);
  box-shadow: 0 0 12px var(--p-glow);
}
.toggle input:checked + .toggle-slider::before {
  transform: translateX(19px);
  background: var(--p);
  box-shadow: 0 0 6px var(--p);
}

/* ─── WEATHER WIDGET ─────────────── */
.weather-widget {
  background: linear-gradient(135deg, rgba(0,212,138,0.06) 0%, rgba(9,14,21,0) 60%),
              linear-gradient(200deg, var(--bg3) 0%, var(--bg2) 100%);
  border: 1px solid var(--gl-p);
  border-radius: var(--r-xl);
  padding: 22px;
  position: relative; overflow: hidden;
}
.weather-widget::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 160px; height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--p-glow), transparent 70%);
  filter: blur(20px);
}
.weather-temp {
  font-family: var(--display);
  font-size: 3.5rem;
  font-weight: 700;
  color: var(--t1);
  line-height: 1;
  letter-spacing: -0.04em;
}
.weather-meta { font-family: var(--mono); font-size: 0.66rem; color: var(--t3); margin-top: 4px; }
.weather-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
.weather-stat {
  background: rgba(0,0,0,0.25);
  border-radius: var(--r-sm);
  padding: 10px 8px; text-align: center;
  border: 1px solid var(--gl);
}
.weather-stat-val { font-family: var(--mono); font-size: 0.92rem; font-weight: 500; color: var(--t1); }
.weather-stat-label { font-family: var(--mono); font-size: 0.5rem; color: var(--t4); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }

/* ─── MODULE TILES ───────────────── */
.tiles-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
@media(max-width:360px) { .tiles-grid { grid-template-columns: repeat(2,1fr); } }

.tile {
  background: linear-gradient(145deg, var(--bg3) 0%, var(--bg2) 100%);
  border: 1px solid var(--gl);
  border-radius: var(--r-md);
  padding: 16px 14px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.tile::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, var(--p-glowl), transparent 70%);
  opacity: 0; transition: opacity 0.2s;
}
.tile::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
}
.tile:hover {
  border-color: var(--gl-p);
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 1px var(--gl-p);
}
.tile:hover::after { opacity: 1; }
.tile:active { transform: translateY(0) scale(0.97); }

.tile-icon { font-size: 1.5rem; line-height: 1; position: relative; z-index: 1; }
.tile-name {
  font-family: var(--font);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--t2);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1.2;
  position: relative; z-index: 1;
}
.tile-sub { font-family: var(--mono); font-size: 0.55rem; color: var(--t4); position: relative; z-index: 1; }

.tile.featured {
  grid-column: span 2;
  flex-direction: row;
  align-items: center;
  padding: 18px 20px;
  gap: 16px;
  border-color: var(--gl-p);
  background: linear-gradient(135deg, rgba(0,212,138,0.08) 0%, var(--bg2) 60%);
}
.tile.featured .tile-icon { font-size: 2rem; }
.tile.featured .tile-name { font-size: 0.82rem; color: var(--t1); }

/* ─── LIST ITEMS ─────────────────── */
.list-item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--gl);
  transition: background 0.15s;
}
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: var(--gl2); }

.list-item-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--bg4), var(--bg3));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem; flex-shrink: 0;
  border: 1px solid var(--gl);
}
.list-item-content { flex: 1; min-width: 0; }
.list-item-title { font-size: 0.85rem; font-weight: 600; color: var(--t1); }
.list-item-meta { font-family: var(--mono); font-size: 0.62rem; color: var(--t3); margin-top: 3px; }
.list-item-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: flex-start; padding-top: 1px; }

/* ─── SECTION ────────────────────── */
.section { margin-bottom: 20px; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.section-title {
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--t3);
  display: flex; align-items: center; gap: 8px;
}
.section-title::before {
  content: '';
  width: 12px; height: 2px;
  background: var(--p);
  border-radius: 1px;
  box-shadow: 0 0 6px var(--p);
}

/* ─── EMPTY STATE ────────────────── */
.empty-state { text-align: center; padding: 52px 20px; }
.empty-icon { font-size: 3rem; margin-bottom: 16px; filter: grayscale(0.3); }
.empty-title {
  font-family: var(--display);
  font-size: 0.95rem; font-weight: 600; color: var(--t2);
  margin-bottom: 8px; letter-spacing: -0.02em;
}
.empty-desc {
  font-family: var(--mono);
  font-size: 0.68rem; color: var(--t4); line-height: 1.7;
  max-width: 280px; margin: 0 auto 22px;
}

/* ─── SCROLL TABS ────────────────── */
.scroll-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 16px; }
.scroll-tabs::-webkit-scrollbar { height: 0; }
.scroll-tab {
  padding: 7px 16px; border-radius: 30px;
  border: 1px solid var(--gl);
  background: transparent; color: var(--t3);
  font-family: var(--mono); font-size: 0.64rem; font-weight: 500;
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.scroll-tab.active {
  background: var(--p); border-color: var(--p);
  color: var(--void); font-weight: 700;
  box-shadow: 0 4px 14px rgba(0,212,138,0.3);
}
.scroll-tab:hover:not(.active) { color: var(--t2); border-color: var(--gl-p); background: var(--gl-pa); }

/* ─── THEME GRID ─────────────────── */
.theme-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.theme-option {
  padding: 12px; border-radius: var(--r-md);
  border: 2px solid var(--gl); cursor: pointer;
  text-align: center; transition: all 0.18s; background: var(--bg3);
}
.theme-option:hover { border-color: var(--gl-p); }
.theme-option.active { border-color: var(--p); box-shadow: 0 0 0 1px var(--p); }
.theme-swatch { height: 40px; border-radius: 8px; margin-bottom: 8px; }
.theme-name { font-family: var(--mono); font-size: 0.58rem; color: var(--t3); text-transform: uppercase; letter-spacing: 0.06em; }

/* ─── CONFIRM ────────────────────── */
#confirm-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  z-index: 200; align-items: center; justify-content: center; padding: 20px;
}
#confirm-overlay.show { display: flex; }
#confirm-box {
  background: linear-gradient(145deg, var(--bg3), var(--bg2));
  border: 1px solid rgba(255,79,109,0.3);
  border-radius: var(--r-xl); padding: 28px; max-width: 340px; width: 100%;
  text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.7);
}
#confirm-icon { font-size: 2.2rem; margin-bottom: 12px; }
#confirm-msg { font-size: 0.82rem; color: var(--t2); margin-bottom: 22px; line-height: 1.6; }

/* ─── FINANCE ROWS ───────────────── */
.finance-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--gl);
}
.finance-row:last-child { border-bottom: none; }
.finance-row-label { font-size: 0.82rem; color: var(--t1); font-weight: 600; }
.finance-row-meta { font-family: var(--mono); font-size: 0.61rem; color: var(--t3); margin-top: 2px; }
.finance-row-amount { font-family: var(--mono); font-size: 0.9rem; font-weight: 600; }
.income { color: var(--p); }
.expense { color: #ff4f6d; }

/* ─── SOIL PARAM ─────────────────── */
.soil-param { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--gl); }
.soil-param:last-child { border-bottom: none; }
.soil-param-name { font-family: var(--mono); font-size: 0.62rem; color: var(--t3); width: 110px; flex-shrink: 0; }
.soil-param-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.soil-param-fill { height: 100%; border-radius: 3px; }
.soil-param-val { font-family: var(--mono); font-size: 0.7rem; font-weight: 500; color: var(--t1); width: 45px; text-align: right; flex-shrink: 0; }
.soil-param-unit { font-family: var(--mono); font-size: 0.55rem; color: var(--t4); width: 35px; }

/* ─── AI ACTIONS ─────────────────── */
.ai-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.ai-action-btn {
  font-family: var(--mono); font-size: 0.6rem; color: var(--t3);
  background: rgba(255,255,255,0.04); border: 1px solid var(--gl);
  border-radius: 6px; padding: 4px 10px; cursor: pointer;
  transition: all 0.15s;
}
.ai-action-btn:hover { color: var(--p); border-color: var(--gl-p); background: var(--gl-pa); }

/* ─── DIVIDER ────────────────────── */
.divider { height: 1px; background: var(--gl); margin: 16px 0; }

/* ─── RESPONSIVE ─────────────────── */
@media(max-width:640px) {
  #page-content { padding: 14px; padding-bottom: 120px; }
  .tiles-grid { grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 8px; }
  .stat-grid { grid-template-columns: repeat(2,1fr); gap: 8px; }
}

/* ─── BOTTOM NAV (Mobile Template — style.css integration) ─── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  width: 100%;
  background: rgba(9,14,21,0.97);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--gl);
  z-index: 7;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.35);
}
.bottom-nav button {
  background: none;
  border: none;
  color: #2c3e50; /* original color from style.css */
  color: var(--t3);
  font-size: 14px;
  font-size: 0.56rem;
  font-family: var(--mono);
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 5px 18px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  -webkit-tap-highlight-color: transparent;
}
.bottom-nav button .bnav-icon {
  font-size: 1.2rem;
  line-height: 1;
  transition: transform 0.15s;
}
.bottom-nav button.bnav-active {
  color: var(--p);
}
.bottom-nav button.bnav-active .bnav-icon {
  filter: drop-shadow(0 0 6px var(--p));
  transform: scale(1.18);
}
.bottom-nav button:hover:not(.bnav-active) {
  color: var(--t2);
  background: var(--gl2);
}
/* .content-area from mobile template maps to #page-content */
.content-area { padding: 70px 20px 80px; }
/* .app-header from mobile template maps to #topbar */
.app-header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
  font-weight: bold;
  position: fixed;
  top: 0; width: 100%;
}
</style>
</head>
<body>

<div id="app">
  <!-- Sidebar -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-text">Crop<span>Intel</span></div>
      <div class="logo-sub">Agricultural OS v3.0</div>
    </div>
    <div class="sidebar-scroll" id="sidebar-nav"></div>
    <div class="sidebar-footer">
      <div class="sidebar-footer-loc" id="farm-location-display">Kirto Sharif, Sheikhupura</div>
      <div class="sidebar-footer-loc" style="margin-top:3px;font-size:0.5rem;" id="sidebar-season">— SEASON —</div>
    </div>
  </nav>

  <!-- Main -->
  <div id="main-area">
    <div id="topbar">
      <button id="menu-btn" onclick="toggleSidebar()">☰</button>
      <div id="page-title">Dashboard</div>
      <div class="topbar-clock">
        <div class="time" id="clock-time">00:00</div>
        <div id="clock-date">Loading...</div>
      </div>
      <div class="lang-btn">
        <button onclick="setLang('en')" id="lang-en" class="active">EN</button>
        <button onclick="setLang('ur')" id="lang-ur" style="font-family:var(--urdu);font-size:0.72rem">اردو</button>
      </div>
      <button class="topbar-icon-btn" onclick="navigate('settings')" title="Settings">⚙</button>
    </div>
    <div id="page-content"></div>
  </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-handle"><div class="modal-handle-bar"></div></div>
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Modal</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="confirm-overlay">
  <div id="confirm-box">
    <div id="confirm-icon">🗑️</div>

function buildSidebar() {
  const nav = document.getElementById('sidebar-nav');

  NAV.forEach(cat => {
    const div = document.createElement('div');
    div.className = 'nav-cat' + (cat.id === 'overview' || cat.id === 'ai_features' ? ' open' : '');
    div.innerHTML = `
      <button class="nav-cat-btn" onclick="this.parentElement.classList.toggle('open')">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-label">${cat.label}</span>
        <span class="chev">▼</span>
      </button>
      <div class="nav-items">
        ${cat.items.map(item => `
          <div class="nav-item${item.id === APP.page ? ' active' : ''}" id="nav-${item.id}" onclick="navigate('${item.id}')">
            ${APP.lang === 'ur' && item.labelUr ? item.labelUr : item.label}
            ${item.isNew ? '<span class="badge-new">NEW</span>' : ''}
          </div>
        `).join('')}
      </div>
    `;
    nav.appendChild(div);
  });
  // Update season
  const m = new Date().getMonth() + 1;
  const season = m >= 4 && m <= 10 ? 'KHARIF SEASON' : 'RABI SEASON';
  document.getElementById('sidebar-season').textContent = season;
  const p = DB.getProfile();
  document.getElementById('farm-location-display').textContent = p.village ? `${p.village}, ${p.district}` : 'Set location in Settings';
}

// ═══════════════════════════════════════
function navigate(pageId) {
  APP.page = pageId;
  // Sync bottom nav active state (mobile template integration)
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('bnav-active'));
  const bnavMap = { dashboard:'bnav-home', advisor:'bnav-advisor', tasks:'bnav-tasks', finance:'bnav-finance', settings:'bnav-settings' };
  if (bnavMap[pageId]) document.getElementById(bnavMap[pageId])?.classList.add('bnav-active');
  // Update active nav items
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.getElementById('nav-' + pageId);
  if (activeEl) {
    activeEl.classList.add('active');
    // Open parent cat
    activeEl.closest('.nav-cat')?.classList.add('open');
  }
  // Close sidebar on mobile
  if (window.innerWidth < 768) closeSidebar();
  // Find page title
  let title = pageId;
  for (const cat of NAV) {
    const item = cat.items.find(i => i.id === pageId);
    if (item) { title = APP.lang === 'ur' && item.labelUr ? item.labelUr : item.label; break; }
  }
  document.getElementById('page-title').textContent = title;
  // Render page
  renderPage(pageId);
}

// INLINE EDIT
// ═══════════════════════════════════════
function makeEditable(value, onSave, type='text', options=[]) {
  const span = document.createElement('span');
  span.className = 'ie';
  span.innerHTML = `<span class="ie-val">${value||'—'}</span><span class="ie-icon">✏</span>`;
  span.onclick = (e) => {
    e.stopPropagation();
    const rect = span.getBoundingClientRect();
    let input;
    if (type === 'select') {
      input = document.createElement('select');
      input.className = 'form-select';
      input.style.cssText = 'padding:2px 8px;font-size:inherit;min-width:120px;';
      options.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.label;
        if (o.value === value) opt.selected = true;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement('input');
      input.className = 'form-input';
      input.type = type;
      input.value = value || '';
      input.style.cssText = 'padding:2px 8px;font-size:inherit;min-width:80px;max-width:200px;';
    }
    span.innerHTML = '';
    span.appendChild(input);
    span.classList.add('ie-editing');
    input.focus();
    if (type !== 'date') { try { input.select(); } catch {} }
    const save = () => {
      const newVal = input.value;
      onSave(newVal);
      span.innerHTML = `<span class="ie-val">${newVal||'—'}</span><span class="ie-icon">✏</span>`;
      span.classList.remove('ie-editing');
    };
    input.onblur = save;
    input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); save(); } if (e.key === 'Escape') { span.innerHTML = `<span class="ie-val">${value||'—'}</span><span class="ie-icon">✏</span>`; span.classList.remove('ie-editing'); } };
  };
  return span;
}

let weatherCache = null;
async function fetchWeather() {
  const p = DB.getProfile();
  const key = p.weatherKey;
  if (!key) return null;
  try {
    let lat = 31.7131, lon = 73.9853;
    if (navigator.geolocation) {
      try {
        const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout:5000}));
        lat = pos.coords.latitude; lon = pos.coords.longitude;
      } catch {}
    }
    const r = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${key}&units=metric`);
    if (!r.ok) return null;
    const d = await r.json();
    weatherCache = {
      temp: Math.round(d.main.temp),
      feelsLike: Math.round(d.main.feels_like),
      humidity: d.main.humidity,
      wind: Math.round(d.wind.speed * 3.6),
      condition: d.weather[0].main,
      desc: d.weather[0].description,
      location: d.name,
      et0: (d.main.temp * 0.15).toFixed(1),
      gdd: Math.max(0, Math.round(((d.main.temp + 3) + (d.main.temp - 3)) / 2 - 10)),
      icon: d.weather[0].icon,
      updated: new Date().toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'}),
    };
    return weatherCache;
  } catch { return null; }
}

function buildFarmContext() {
  const p = DB.getProfile();
  const crops = DB.getList('crops');
  const fields = DB.getList('fields');
  const tasks = DB.getList('tasks');
  const activities = DB.getList('activities');
  const finance = DB.getList('finance');
  const soilTests = DB.getList('soil_tests');
  const today = new Date().toISOString().split('T')[0];
  const m = new Date().getMonth() + 1;
  const season = m >= 4 && m <= 10 ? 'Kharif' : 'Rabi';
  const overdue = tasks.filter(t => t.status !== 'Done' && t.dueDate < today);
  const activeCrops = crops.filter(c => c.status === 'Growing' || c.status === 'At Risk');
  const totalExpense = finance.filter(f=>f.type==='Expense').reduce((s,f)=>s+Number(f.amount||0),0);
  const totalIncome = finance.filter(f=>f.type==='Income').reduce((s,f)=>s+Number(f.amount||0),0);
  return {
    farmerName: p.farmerName, farmName: p.farmName,
    location: `${p.village||'Kirto Sharif'}, ${p.district||'Sheikhupura'}, Punjab`,
    season, today,
    totalFields: fields.length, totalAcres: fields.reduce((s,f)=>s+Number(f.areaAcres||0),0),
    activeCrops: activeCrops.map(c => ({name:c.name,type:c.type,variety:c.variety,acres:c.areaAcres,stage:c.growthStage,status:c.status,sowingDate:c.sowingDate})),
    fields: fields.map(f => ({name:f.name,acres:f.areaAcres,soilType:f.soilType,pH:f.soilPH,water:f.waterSource})),
    overdueTasks: overdue.map(t=>({title:t.title,due:t.dueDate,priority:t.priority})),
    recentActivities: activities.slice(-10).map(a=>({type:a.type,date:a.date,field:a.fieldName,crop:a.cropName})),
    latestSoilTests: soilTests.slice(-5).map(s=>({field:s.fieldName,pH:s.pH,date:s.testDate})),
    financial: { totalIncomePKR:totalIncome, totalExpensePKR:totalExpense, netPKR:totalIncome-totalExpense },
    weather: weatherCache,
  };
}

// GROWTH STAGE CALCULATOR
// ═══════════════════════════════════════
function calcGrowthStage(type, sowingDate) {
  const days = Math.floor((Date.now() - new Date(sowingDate)) / 86400000);
  const STAGES = {
    Wheat: [{d:0,s:'Germination'},{d:8,s:'Seedling'},{d:20,s:'Tillering'},{d:46,s:'Jointing'},{d:66,s:'Heading'},{d:81,s:'Grain Fill'},{d:101,s:'Maturity'},{d:121,s:'Harvest Ready'}],
    'Rice (Basmati)': [{d:0,s:'Seedling'},{d:25,s:'Vegetative'},{d:55,s:'Tillering'},{d:85,s:'Flowering'},{d:110,s:'Grain Fill'},{d:140,s:'Maturity'},{d:155,s:'Harvest Ready'}],
    Maize: [{d:0,s:'Germination'},{d:10,s:'Seedling'},{d:25,s:'Vegetative'},{d:55,s:'Flowering'},{d:75,s:'Grain Fill'},{d:95,s:'Maturity'},{d:110,s:'Harvest Ready'}],
    Sugarcane: [{d:0,s:'Germination'},{d:30,s:'Tillering'},{d:90,s:'Vegetative'},{d:240,s:'Grand Growth'},{d:300,s:'Maturity'},{d:330,s:'Harvest Ready'}],
  };
  const stages = STAGES[type] || STAGES.Wheat;
  if (days < 0) return 'Pre-Sowing';
  let stage = 'Germination';
  for (const s of stages) { if (days >= s.d) stage = s.s; }
  return stage;
}

function daysUntil(dateStr) { return Math.ceil((new Date(dateStr) - new Date()) / 86400000); }
function isOverdue(dateStr) { return new Date(dateStr) < new Date(new Date().toDateString()); }
function formatPKR(n) { n=Number(n||0); if(n>=10000000) return `Rs.${(n/10000000).toFixed(2)} Cr`; if(n>=100000) return `Rs.${(n/100000).toFixed(2)} L`; return `Rs.${n.toLocaleString()}`; }
function today() { return new Date().toISOString().split('T')[0]; }

      const dth = c.expectedHarvestDate ? daysUntil(c.expectedHarvestDate) : null;
      const profitStr = c.totalRevenuePKR && c.totalCostPKR ? formatPKR(c.totalRevenuePKR - c.totalCostPKR) : '';
      return `<div class="list-item">
        <div class="list-item-icon">🌾</div>
        <div class="list-item-content">
          <div class="list-item-title">${c.name}</div>
          <div style="display:flex;gap:6px;margin:4px 0;flex-wrap:wrap">
            <span class="badge ${STATUS_COL[c.status]||'badge-muted'}">${c.status}</span>
            <span class="badge badge-muted">${c.type}</span>
            <span class="badge badge-muted">${stage}</span>
            ${c.fieldName?`<span class="badge badge-muted">📍 ${c.fieldName}</span>`:''}
          </div>
          <div class="list-item-meta">
            ${c.areaAcres} ac · Sown: ${c.sowingDate}
            ${dth!==null ? ` · ${dth<0?`<span style="color:var(--a)">Harvest passed ${Math.abs(dth)}d ago</span>`:`<span style="color:var(--p2)">${dth}d to harvest</span>`}` : ''}
            ${profitStr ? ` · <span style="color:var(--p1)">${profitStr}</span>` : ''}
          </div>
        </div>
        <div class="list-item-actions">
          <button class="btn btn-ghost btn-sm" onclick="editCrop('${c.id}')">✏</button>
          <button class="btn btn-danger btn-sm" onclick="deleteCrop('${c.id}')">🗑</button>
        </div>
      </div>`;
    }).join('')}
  </div>
  <button class="fab" onclick="_showAddCropModal()">+</button>`;
}
};

// ─── FIELDS ───────────────────────────
PAGES.fields = function() {
  const fields = DB.getList('fields');
  const SOIL_TYPES = ['Sandy','Sandy Loam','Loam','Clay Loam','Clay','Silty Clay','Silty Loam'];
  const WATER = ['Canal','Tubewell','Rainfed'];

  window._showAddFieldModal = () => {
    openModal('Add Field', `
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Field Name *</label><input class="form-input" id="fi-name" placeholder="e.g. North Field"></div>
        <div class="form-group"><label class="form-label">Location/Address</label><input class="form-input" id="fi-loc" placeholder="Near canal, south side"></div>
        <div class="form-group"><label class="form-label">Area (Acres) *</label><input class="form-input" id="fi-acres" type="number" step="0.5" min="0.1"></div>
        <div class="form-group"><label class="form-label">Kanals</label><input class="form-input" id="fi-kanals" type="number" min="0" placeholder="auto-calc"></div>
        <div class="form-group"><label class="form-label">Soil Type</label><select class="form-select" id="fi-soil">${SOIL_TYPES.map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Soil pH</label><input class="form-input" id="fi-ph" type="number" step="0.1" min="4" max="10" placeholder="e.g. 7.5"></div>
        <div class="form-group"><label class="form-label">EC (dS/m)</label><input class="form-input" id="fi-ec" type="number" step="0.1" min="0" placeholder="e.g. 2.1"></div>
        <div class="form-group"><label class="form-label">Ownership</label><select class="form-select" id="fi-own"><option>Owned</option><option>Leased</option><option>Shared</option></select></div>
        <div class="form-group"><label class="form-label">Rent/Acre (PKR)</label><input class="form-input" id="fi-rent" type="number" min="0" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Water Source</label><select class="form-select" id="fi-water">${WATER.map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">GPS Latitude</label><input class="form-input" id="fi-lat" type="number" step="0.0001" placeholder="31.7131"></div>
        <div class="form-group"><label class="form-label">GPS Longitude</label><input class="form-input" id="fi-lon" type="number" step="0.0001" placeholder="73.9853"></div>
      </div>
      <div class="form-group" style="margin-top:12px"><label class="form-label">Notes</label><textarea class="form-textarea" id="fi-notes" placeholder="Any details about this field..."></textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="saveField()">Add Field</button>
       <button class="btn btn-ghost btn-sm" onclick="getGPS()" style="margin-left:4px">📍 GPS</button>`
    );
  };

  window.getGPS = () => {
    if (!navigator.geolocation) { showToast('GPS not available'); return; }
    navigator.geolocation.getCurrentPosition(p => {
      document.getElementById('fi-lat').value = p.coords.latitude.toFixed(6);
      document.getElementById('fi-lon').value = p.coords.longitude.toFixed(6);
      showToast('✓ GPS location set');
    }, () => showToast('Could not get GPS'));
  };

  window.saveField = (editId=null) => {
    const name = document.getElementById('fi-name')?.value?.trim();
    const acres = document.getElementById('fi-acres')?.value;
    if (!name || !acres) { showToast('Fill required fields'); return; }
    const data = {
      name, location:document.getElementById('fi-loc')?.value||'',
      areaAcres:Number(acres), areaKanals:Number(acres)*8, areaHectares:(Number(acres)*0.4047).toFixed(3),
      soilType:document.getElementById('fi-soil')?.value||'Loam',
      soilPH:Number(document.getElementById('fi-ph')?.value)||null,
      soilEC:Number(document.getElementById('fi-ec')?.value)||null,
      ownership:document.getElementById('fi-own')?.value||'Owned',
      rentPerAcrePKR:Number(document.getElementById('fi-rent')?.value)||0,
      waterSource:[document.getElementById('fi-water')?.value||'Canal'],
      gpsLat:Number(document.getElementById('fi-lat')?.value)||null,
      gpsLon:Number(document.getElementById('fi-lon')?.value)||null,
      notes:document.getElementById('fi-notes')?.value||'',
    };
    if (editId) { DB.updateItem('fields', editId, data); showToast('✓ Field updated'); }
    else { DB.addItem('fields', data); showToast('✓ Field added'); }
    closeModal(); navigate('fields');
  };

  window.editField = (id) => {
    const f = DB.getList('fields').find(x=>x.id===id);
    if (!f) return;
    openModal('Edit Field', `
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Field Name *</label><input class="form-input" id="fi-name" value="${f.name}"></div>
        <div class="form-group"><label class="form-label">Location</label><input class="form-input" id="fi-loc" value="${f.location||''}"></div>
        <div class="form-group"><label class="form-label">Area (Acres) *</label><input class="form-input" id="fi-acres" type="number" step="0.5" value="${f.areaAcres}"></div>
        <div class="form-group"><label class="form-label">Soil Type</label><select class="form-select" id="fi-soil">${SOIL_TYPES.map(x=>`<option${x===f.soilType?' selected':''}>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Soil pH</label><input class="form-input" id="fi-ph" type="number" step="0.1" value="${f.soilPH||''}"></div>
        <div class="form-group"><label class="form-label">EC (dS/m)</label><input class="form-input" id="fi-ec" type="number" step="0.1" value="${f.soilEC||''}"></div>
        <div class="form-group"><label class="form-label">Ownership</label><select class="form-select" id="fi-own"><option${f.ownership==='Owned'?' selected':''}>Owned</option><option${f.ownership==='Leased'?' selected':''}>Leased</option><option${f.ownership==='Shared'?' selected':''}>Shared</option></select></div>
        <div class="form-group"><label class="form-label">Rent/Acre PKR</label><input class="form-input" id="fi-rent" type="number" value="${f.rentPerAcrePKR||0}"></div>
        <div class="form-group"><label class="form-label">Water Source</label><select class="form-select" id="fi-water">${WATER.map(x=>`<option${f.waterSource?.includes(x)?' selected':''}>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">GPS Lat</label><input class="form-input" id="fi-lat" type="number" value="${f.gpsLat||''}"></div>
        <div class="form-group"><label class="form-label">GPS Lon</label><input class="form-input" id="fi-lon" type="number" value="${f.gpsLon||''}"></div>
      </div>
      <div class="form-group" style="margin-top:12px"><label class="form-label">Notes</label><textarea class="form-textarea" id="fi-notes">${f.notes||''}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="saveField('${id}')">Save Changes</button>`
    );
  };

  window.deleteField = (id) => { const _f=DB.getList('fields').find(x=>x.id===id); openConfirm('Delete field '+(_f?_f.name:'')+'?', () => { DB.deleteItem('fields', id); navigate('fields'); showToast('Field deleted'); }); };

  if (fields.length === 0) return `<div class="empty-state"><div class="empty-icon">🗺️</div><div class="empty-title">No Fields Added</div><div class="empty-desc">Add your fields to start tracking crops, soil health, and activities.</div><button class="btn btn-primary" onclick="_showAddFieldModal()">+ Add Field</button></div><button class="fab" onclick="_showAddFieldModal()">+</button>`;

  return `
  <div class="stat-grid section">
    <div class="stat-card"><div class="stat-val">${fields.length}</div><div class="stat-label">Fields</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--a)">${fields.reduce((s,f)=>s+Number(f.areaAcres||0),0).toFixed(1)}</div><div class="stat-label">Total Acres</div></div>
    <div class="stat-card"><div class="stat-val">${fields.filter(f=>f.ownership==='Owned').length}</div><div class="stat-label">Owned</div></div>
    <div class="stat-card"><div class="stat-val">${fields.filter(f=>f.ownership==='Leased').length}</div><div class="stat-label">Leased</div></div>
  </div>
  <div class="card">
    ${fields.map(f=>`<div class="list-item">
      <div class="list-item-icon">🗺️</div>
      <div class="list-item-content">
        <div class="list-item-title">${f.name}</div>
        <div style="display:flex;gap:6px;margin:4px 0;flex-wrap:wrap">
          <span class="badge badge-muted">${f.areaAcres} ac / ${(f.areaAcres*8).toFixed(0)} kanals</span>
          <span class="badge badge-muted">${f.soilType||'—'}</span>
          ${f.soilPH ? `<span class="badge badge-${f.soilPH>8?'amber':f.soilPH<6.5?'red':'green'}">pH ${f.soilPH}</span>` : ''}
          <span class="badge badge-muted">${f.ownership}</span>
        </div>
        <div class="list-item-meta">
          ${f.waterSource?.join(', ')||'—'}
          ${f.gpsLat ? ` · 📍 ${Number(f.gpsLat).toFixed(4)}, ${Number(f.gpsLon).toFixed(4)}` : ''}
          ${f.rentPerAcrePKR ? ` · Rent: ${formatPKR(f.rentPerAcrePKR)}/ac` : ''}
        </div>
      </div>
      <div class="list-item-actions">
        <button class="btn btn-ghost btn-sm" onclick="editField('${f.id}')">✏</button>
        <button class="btn btn-danger btn-sm" onclick="deleteField('${f.id}')">🗑</button>

    </div>`).join('')}
  </div>
  <button class="fab" onclick="_showAddFieldModal()">+</button>`;
},

// ─── TASKS ────────────────────────────
PAGES.tasks = function() {
  const tasks = DB.getList('tasks');
  const crops = DB.getList('crops');
  const fields = DB.getList('fields');
  const CATS = ['Irrigation','Fertilizer','Pesticide','Scouting','Harvest','Tillage','Market','Financial','Equipment','General'];
  const PRIOS = ['Critical','High','Medium','Low'];
  const PRIO_COL = {Critical:'badge-red',High:'badge-amber',Medium:'badge-green',Low:'badge-muted'};
  const CAT_ICONS = {Irrigation:'💧',Fertilizer:'🧪',Pesticide:'💊',Scouting:'🔍',Harvest:'🌾',Tillage:'🚜',Market:'📊',Financial:'💰',Equipment:'🔧',General:'📋'};
  const todayStr = today();

  window._showAddTaskModal = () => {
    openModal('Add Task', `
      <div class="form-group"><label class="form-label">Title *</label><input class="form-input" id="tk-title" placeholder="e.g. Irrigate wheat field"></div>
      <div class="form-grid" style="margin-top:12px">
        <div class="form-group"><label class="form-label">Category</label><select class="form-select" id="tk-cat">${CATS.map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="tk-prio">${PRIOS.map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Due Date *</label><input class="form-input" id="tk-due" type="date" value="${todayStr}"></div>
        <div class="form-group"><label class="form-label">Due Time</label><input class="form-input" id="tk-time" type="time"></div>
        <div class="form-group"><label class="form-label">Crop</label><select class="form-select" id="tk-crop"><option value="">None</option>${crops.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Field</label><select class="form-select" id="tk-field"><option value="">None</option>${fields.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Est. Cost (PKR)</label><input class="form-input" id="tk-cost" type="number" min="0" placeholder="0"></div>
      </div>
      <div class="form-group" style="margin-top:12px"><label class="form-label">Notes</label><textarea class="form-textarea" id="tk-notes" placeholder="Details..."></textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="saveTask()">Add Task</button>`
    );
  };

  window.saveTask = (editId=null) => {
    const title = document.getElementById('tk-title')?.value?.trim();
    const due = document.getElementById('tk-due')?.value;
    if (!title || !due) { showToast('Fill required fields'); return; }
    const cropId = document.getElementById('tk-crop')?.value;
    const fieldId = document.getElementById('tk-field')?.value;
    const data = {
      title, category:document.getElementById('tk-cat')?.value||'General',
      priority:document.getElementById('tk-prio')?.value||'Medium',
      dueDate:due, dueTime:document.getElementById('tk-time')?.value||'',
      status:'Pending', cropId, cropName:crops.find(c=>c.id===cropId)?.name||'',
      fieldId, fieldName:fields.find(f=>f.id===fieldId)?.name||'',
      estimatedCostPKR:Number(document.getElementById('tk-cost')?.value||0),
      notes:document.getElementById('tk-notes')?.value||'',
    };
    if (editId) { DB.updateItem('tasks', editId, data); showToast('✓ Task updated'); }
    else { DB.addItem('tasks', data); showToast('✓ Task added'); }
    closeModal(); navigate('tasks');
  };

  window.toggleTaskDone = (id) => {
    const task = DB.getList('tasks').find(t=>t.id===id);
    if (!task) return;
    DB.updateItem('tasks', id, { status: task.status==='Done'?'Pending':'Done', completedAt: task.status==='Done'?null:new Date().toISOString() });
    navigate('tasks');
  };

  window.editTask = (id) => {
    const tk = DB.getList('tasks').find(x=>x.id===id);
    if (!tk) return;
    openModal('Edit Task', `
      <div class="form-group"><label class="form-label">Title *</label><input class="form-input" id="tk-title" value="${tk.title}"></div>
      <div class="form-grid" style="margin-top:12px">
        <div class="form-group"><label class="form-label">Category</label><select class="form-select" id="tk-cat">${CATS.map(x=>`<option${x===tk.category?' selected':''}>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="tk-prio">${PRIOS.map(x=>`<option${x===tk.priority?' selected':''}>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Due Date *</label><input class="form-input" id="tk-due" type="date" value="${tk.dueDate}"></div>
        <div class="form-group"><label class="form-label">Due Time</label><input class="form-input" id="tk-time" type="time" value="${tk.dueTime||''}"></div>
        <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="tk-status"><option${tk.status==='Pending'?' selected':''}>Pending</option><option${tk.status==='Done'?' selected':''}>Done</option><option${tk.status==='Cancelled'?' selected':''}>Cancelled</option></select></div>
        <div class="form-group"><label class="form-label">Actual Cost (PKR)</label><input class="form-input" id="tk-cost" type="number" value="${tk.actualCostPKR||tk.estimatedCostPKR||0}"></div>
      </div>
      <div class="form-group" style="margin-top:12px"><label class="form-label">Notes</label><textarea class="form-textarea" id="tk-notes">${tk.notes||''}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="saveTask('${id}')">Save</button>`
    );
  };

  window.deleteTask = (id) => { const _t=DB.getList('tasks').find(x=>x.id===id); openConfirm('Delete task '+(_t?_t.title:'')+'?', () => { DB.deleteItem('tasks', id); navigate('tasks'); showToast('Task deleted'); }); };

  const sorted = [...tasks].sort((a,b) => {
    if (a.status==='Done' && b.status!=='Done') return 1;
    if (a.status!=='Done' && b.status==='Done') return -1;
    const pd = PRIOS.indexOf(a.priority) - PRIOS.indexOf(b.priority);
    if (pd!==0) return pd;
    return a.dueDate.localeCompare(b.dueDate);
  });

  const overdue = sorted.filter(t=>t.status!=='Done'&&isOverdue(t.dueDate));
  const todayList = sorted.filter(t=>t.dueDate===todayStr&&t.status!=='Done');
  const done = sorted.filter(t=>t.status==='Done');

  return `
  <div class="stat-grid section">
    <div class="stat-card"><div class="stat-val">${tasks.length}</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--p1)">${todayList.length}</div><div class="stat-label">Today</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#ffcc80">${overdue.length}</div><div class="stat-label">Overdue</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--a)">${done.length}</div><div class="stat-label">Done</div></div>
  </div>
  ${tasks.length===0?`<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No Tasks Yet</div><div class="empty-desc">Add farm tasks to track irrigation, spraying, harvesting and more.</div><button class="btn btn-primary" onclick="_showAddTaskModal()">+ Add Task</button></div>`:`
  <div class="card">
    ${sorted.map(task=>{
      const od = task.status!=='Done' && isOverdue(task.dueDate);
      const isToday = task.dueDate===todayStr && task.status!=='Done';
      const days = daysUntil(task.dueDate);
      return `<div class="list-item" style="${od?'border-left:2px solid var(--w);':isToday?'border-left:2px solid var(--p1);':''}${task.status==='Done'?'opacity:0.55':''}">
        <button style="width:22px;height:22px;border-radius:50%;border:2px solid ${task.status==='Done'?'var(--p)':'var(--b)'};background:${task.status==='Done'?'var(--p)':'transparent'};cursor:pointer;flex-shrink:0;font-size:0.7rem;margin-top:6px;transition:all 0.15s" onclick="toggleTaskDone('${task.id}')">${task.status==='Done'?'✓':''}</button>
        <div class="list-item-content">
          <div class="list-item-title" style="${task.status==='Done'?'text-decoration:line-through;color:var(--t3)':''}">${task.title}</div>
          <div style="display:flex;gap:5px;margin:4px 0;flex-wrap:wrap">
            <span class="badge ${PRIO_COL[task.priority]||'badge-muted'}">${task.priority}</span>
            <span class="badge badge-muted">${CAT_ICONS[task.category]||''} ${task.category}</span>
            ${task.cropName?`<span class="badge badge-muted">🌾 ${task.cropName}</span>`:''}
          </div>
          <div class="list-item-meta" style="${od?'color:var(--w)':isToday?'color:var(--p1)':''}">
            ${od ? `⚠ ${Math.abs(days)}d overdue · ` : isToday ? '🟢 Today · ' : days>0?`${days}d · `:''}
            ${task.dueDate}${task.dueTime?' '+task.dueTime:''}
            ${task.estimatedCostPKR?` · ${formatPKR(task.estimatedCostPKR)}`:''}
          </div>
          ${task.notes?`<div style="font-size:0.72rem;color:var(--t3);margin-top:3px;font-style:italic">${task.notes}</div>`:''}
        </div>
        <div class="list-item-actions">
          <button class="btn btn-ghost btn-sm" onclick="editTask('${task.id}')">✏</button>
          <button class="btn btn-danger btn-sm" onclick="deleteTask('${task.id}')">🗑</button>
        </div>
      </div>`;
    }).join('')}
  </div>`}
  <button class="fab" onclick="_showAddTaskModal()">+</button>`;
},

      <div class="form-group" style="margin-top:12px"><label class="form-label">Notes</label><textarea class="form-textarea" id="fn-notes" placeholder="Any notes..."></textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="saveFinance()">Save</button>`
    );
  };
  window._fnCats = (t) => CATS[t] || CATS.Expense;

  window.saveFinance = (editId=null) => {
    const desc = document.getElementById('fn-desc')?.value?.trim();
    const amt = document.getElementById('fn-amt')?.value;
    const date = document.getElementById('fn-date')?.value;
    if (!desc || !amt || !date) { showToast('Fill required fields'); return; }
    const cropId = document.getElementById('fn-crop')?.value;
    const data = {
      description:desc, type:document.getElementById('fn-type')?.value||'Expense',
      category:document.getElementById('fn-cat')?.value||'Other',
      amount:Number(amt), date,
      cropId, cropName:crops.find(c=>c.id===cropId)?.name||'',
      partyName:document.getElementById('fn-party')?.value||'',
      paymentMethod:document.getElementById('fn-pay')?.value||'Cash',
      invoiceNumber:document.getElementById('fn-inv')?.value||'',
      notes:document.getElementById('fn-notes')?.value||'',
    };
    if (editId) { DB.updateItem('finance', editId, data); showToast('✓ Updated'); }
    else { DB.addItem('finance', data); showToast('✓ Added'); }
    closeModal(); navigate('finance');
  };

  window.editFinance = (id) => {
    const e = DB.getList('finance').find(x=>x.id===id);
    if (!e) return;
    const cats = CATS[e.type]||CATS.Expense;
    openModal('Edit Entry', `
      <div class="form-group"><label class="form-label">Description *</label><input class="form-input" id="fn-desc" value="${e.description}"></div>
      <div class="form-grid" style="margin-top:12px">
        <div class="form-group"><label class="form-label">Type</label><select class="form-select" id="fn-type"><option${e.type==='Expense'?' selected':''}>Expense</option><option${e.type==='Income'?' selected':''}>Income</option></select></div>
        <div class="form-group"><label class="form-label">Category</label><select class="form-select" id="fn-cat">${cats.map(x=>`<option${x===e.category?' selected':''}>${x}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Amount (PKR) *</label><input class="form-input" id="fn-amt" type="number" value="${e.amount}"></div>
        <div class="form-group"><label class="form-label">Date *</label><input class="form-input" id="fn-date" type="date" value="${e.date}"></div>
        <div class="form-group"><label class="form-label">Party Name</label><input class="form-input" id="fn-party" value="${e.partyName||''}"></div>
        <div class="form-group"><label class="form-label">Payment Method</label><select class="form-select" id="fn-pay"><option${e.paymentMethod==='Cash'?' selected':''}>Cash</option><option${e.paymentMethod==='Bank Transfer'?' selected':''}>Bank Transfer</option><option${e.paymentMethod==='Cheque'?' selected':''}>Cheque</option></select></div>
      </div>
      <div class="form-group" style="margin-top:12px"><label class="form-label">Notes</label><textarea class="form-textarea" id="fn-notes">${e.notes||''}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="saveFinance('${id}')">Save</button>`
    );
  };
  window.deleteFinance = (id) => { const _e=DB.getList('finance').find(x=>x.id===id); openConfirm('Delete '+(_e?_e.description:'entry')+'?', () => { DB.deleteItem('finance', id); navigate('finance'); showToast('Deleted'); }); };

  const totalIncome = entries.filter(e=>e.type==='Income').reduce((s,e)=>s+Number(e.amount||0),0);
  const totalExpense = entries.filter(e=>e.type==='Expense').reduce((s,e)=>s+Number(e.amount||0),0);
  const net = totalIncome - totalExpense;
  const sorted = [...entries].sort((a,b)=>b.date.localeCompare(a.date));

  return `
  <div class="stat-grid section">
    <div class="stat-card"><div class="stat-val income">${formatPKR(totalIncome)}</div><div class="stat-label">Total Income</div></div>
    <div class="stat-card"><div class="stat-val expense">${formatPKR(totalExpense)}</div><div class="stat-label">Total Expense</div></div>
    <div class="stat-card"><div class="stat-val" style="color:${net>=0?'var(--p1)':'#ef9a9a'}">${formatPKR(Math.abs(net))}</div><div class="stat-label">${net>=0?'Net Profit':'Net Loss'}</div></div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="btn btn-primary" onclick="_showAddFinanceModal('Income')">+ Income</button>
    <button class="btn btn-ghost" onclick="_showAddFinanceModal('Expense')">+ Expense</button>
    <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="exportFinancePDF()">PDF</button>
  </div>
  ${entries.length===0?`<div class="empty-state"><div class="empty-icon">💰</div><div class="empty-title">No Entries Yet</div><div class="empty-desc">Track your farm income and expenses here.</div></div>`:`
  <div class="card">
    ${sorted.map(e=>`<div class="finance-row">
      <div>
        <div class="finance-row-label">${e.description}</div>
        <div class="finance-row-meta">${e.date} · ${e.category} · ${e.paymentMethod||'Cash'}${e.cropName?' · '+e.cropName:''}${e.partyName?' · '+e.partyName:''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="finance-row-amount ${e.type==='Income'?'income':'expense'}">${e.type==='Income'?'+':'-'}${formatPKR(e.amount)}</span>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="editFinance('${e.id}')">✏</button>
        <button class="btn btn-danger btn-sm btn-icon" onclick="deleteFinance('${e.id}')">🗑</button>
      </div>
    </div>`).join('')}
  </div>`}
  <button class="fab" onclick="_showAddFinanceModal()">+</button>`;
};

window.exportFinancePDF = () => {
  const entries = DB.getList('finance');
  const income = entries.filter(e=>e.type==='Income').reduce((s,e)=>s+Number(e.amount||0),0);
  const expense = entries.filter(e=>e.type==='Expense').reduce((s,e)=>s+Number(e.amount||0),0);
  exportToPDF('Finance Report', `<h1>CropIntel Finance Report</h1><p>${new Date().toLocaleDateString()}</p><h2>Summary</h2><p>Total Income: Rs.${income.toLocaleString()} | Total Expense: Rs.${expense.toLocaleString()} | Net: Rs.${(income-expense).toLocaleString()}</p><h2>Transactions</h2><table><tr><th>Date</th><th>Description</th><th>Type</th><th>Category</th><th>Amount</th></tr>${entries.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${e.date}</td><td>${e.description}</td><td>${e.type}</td><td>${e.category}</td><td>${e.type==='Income'?'+':'-'}Rs.${Number(e.amount).toLocaleString()}</td></tr>`).join('')}</table>`);
};

PAGES.soil = function() {

        <div class="form-group"><label class="form-label">N (ppm)</label><input class="form-input" id="st-n" type="number" step="0.1" placeholder="0"></div>

      pH:Number(ph), ec:Number(document.getElementById('st-ec')?.value)||null,

      nitrogenPpm:Number(document.getElementById('st-n')?.value)||null,
      phosphorusPpm:Number(document.getElementById('st-p')?.value)||null,
      potassiumPpm:Number(document.getElementById('st-k')?.value)||null,
      zincPpm:Number(document.getElementById('st-zn')?.value)||null,
      boronPpm:Number(document.getElementById('st-b')?.value)||null,

  return `

        ${st.ec!=null?`<div class="soil-param"><span class="soil-param-name">EC</span><div class="soil-param-bar"><div class="soil-param-fill" style="width:${Math.min((st.ec/8)*100,100)}%;background:${ecColor}"></div></div><span class="soil-param-val" style="color:${ecColor}">${st.ec}</span><span class="soil-param-unit">dS/m</span></div>`:''}
        ${st.organicMatterPercent!=null?`<div class="soil-param"><span class="soil-param-name">Organic Matter</span><div class="soil-param-bar"><div class="soil-param-fill" style="width:${Math.min(st.organicMatterPercent*20,100)}%;background:#81c784"></div></div><span class="soil-param-val">${st.organicMatterPercent}</span><span class="soil-param-unit">%</span></div>`:''}
        ${st.nitrogenPpm!=null?`<div class="soil-param"><span class="soil-param-name">Nitrogen</span><div class="soil-param-bar"><div class="soil-param-fill" style="width:${Math.min((st.nitrogenPpm/50)*100,100)}%;background:var(--p1)"></div></div><span class="soil-param-val">${st.nitrogenPpm}</span><span class="soil-param-unit">ppm</span></div>`:''}
        ${st.phosphorusPpm!=null?`<div class="soil-param"><span class="soil-param-name">Phosphorus</span><div class="soil-param-bar"><div class="soil-param-fill" style="width:${Math.min((st.phosphorusPpm/20)*100,100)}%;background:var(--a)"></div></div><span class="soil-param-val">${st.phosphorusPpm}</span><span class="soil-param-unit">ppm</span></div>`:''}
        ${st.potassiumPpm!=null?`<div class="soil-param"><span class="soil-param-name">Potassium</span><div class="soil-param-bar"><div class="soil-param-fill" style="width:${Math.min((st.potassiumPpm/200)*100,100)}%;background:#81d4fa"></div></div><span class="soil-param-val">${st.potassiumPpm}</span><span class="soil-param-unit">ppm</span></div>`:''}
        ${st.zincPpm!=null?`<div class="soil-param"><span class="soil-param-name">Zinc</span><div class="soil-param-bar"><div class="soil-param-fill" style="width:${Math.min((st.zincPpm/5)*100,100)}%;background:#ce93d8"></div></div><span class="soil-param-val">${st.zincPpm}</span><span class="soil-param-unit">ppm</span></div>`:''}
        ${st.recommendations?`<div class="divider"></div><div style="font-size:0.75rem;color:var(--t2);line-height:1.6">${st.recommendations}</div>`:''}
      </div>
    </div>`;
  }).join('')}
  <button class="fab" onclick="_showAddSoilModal()">+</button>`;
};
