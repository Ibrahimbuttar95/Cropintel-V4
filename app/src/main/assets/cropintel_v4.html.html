window.calcTransport = () => {
  const dist = Number(document.getElementById('tc-dist')?.value||0);

PAGES.crop_growth = function() {
  const crops = DB.getList('crops').filter(c=>c.status==='Growing'||c.status==='At Risk'||c.status==='Planned');
  const GROWTH_STAGES = {
    Wheat:['Germination (0-7d)','Seedling (8-20d)','Tillering (21-45d)','Jointing (46-65d)','Heading (66-80d)','Grain Fill (81-100d)','Maturity (101-120d)','Harvest Ready'],
    'Rice (Basmati)':['Seedling (0-25d)','Vegetative (26-54d)','Tillering (55-84d)','Flowering (85-109d)','Grain Fill (110-139d)','Harvest Ready'],
    Maize:['Germination (0-10d)','Seedling (11-24d)','Vegetative (25-54d)','Flowering (55-74d)','Grain Fill (75-94d)','Harvest Ready'],
    Sugarcane:['Germination (0-30d)','Tillering (31-90d)','Grand Growth (91-270d)','Maturation (271-360d)','Harvest Ready'],
  };

  if(!crops.length) return `<div class="empty-state"><div class="empty-icon">📈</div><div class="empty-title">No Active Crops</div><div class="empty-desc">Add crops with sowing dates to track growth stages and harvest countdown.</div><button class="btn btn-primary" onclick="navigate('crops')">Go to Crops</button></div>`;

  return `
  <div class="section">
    <div class="sec-hd"><div class="sec-title">ACTIVE CROP GROWTH TRACKER</div></div>
    ${crops.map(c=>{
      const sown = new Date(c.sowingDate);
      const daysGrown = Math.floor((Date.now()-sown)/86400000);
      const dth = c.expectedHarvestDate ? daysUntil(c.expectedHarvestDate) : null;
      const stages = GROWTH_STAGES[c.type]||GROWTH_STAGES.Wheat;
      const totalDays = c.type==='Wheat'?130:c.type==='Rice (Basmati)'?150:c.type==='Maize'?100:360;
      const progress = Math.min(100,Math.max(0,Math.round(daysGrown/totalDays*100)));
      const stage = calcGrowthStage(c.type, c.sowingDate);

      return `<div class="card section">
        <div class="card-hd">
          <div><div class="card-title">${c.name}</div><div style="font-family:var(--mono);font-size:.6rem;color:var(--t3);padding-left:10px">${c.type} · ${c.areaAcres}ac · Sown: ${c.sowingDate}</div></div>
          <span class="badge ${c.status==='At Risk'?'badge-amber':'badge-green'}">${stage}</span>
        </div>
        <div class="card-body">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-family:var(--mono);font-size:.62rem;color:var(--t3)">Day ${Math.max(0,daysGrown)} of ~${totalDays}</span>
            <span style="font-family:var(--mono);font-size:.62rem;color:var(--p)">${progress}% complete</span>
          </div>
          <div class="progress" style="height:8px"><div class="progress-fill" style="width:${progress}%"></div></div>
          <div style="display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:4px">
            ${stages.map(s=>{
              const isCurrent = s.split(' ')[0]===stage.split(' ')[0]||stage.includes(s.split(' ')[0]);
              return `<div style="flex-shrink:0;padding:5px 10px;border-radius:6px;font-size:.6rem;font-family:var(--mono);background:${isCurrent?'var(--p)':'var(--bg3)'};color:${isCurrent?'#060a0f':'var(--t4)'};border:1px solid ${isCurrent?'var(--p)':'var(--gl)'};white-space:nowrap">${s.split(' (')[0]}</div>`;
            }).join('')}
          </div>
          ${dth!==null?`<div style="margin-top:10px;font-family:var(--mono);font-size:.65rem;color:${dth<14?'var(--orange)':dth<30?'var(--a)':'var(--t3)'}">🌾 ${dth>0?dth+'d to expected harvest':'Harvest window reached!'} — ${c.expectedHarvestDate}</div>`:''}
          ${c.notes?`<div style="font-size:.72rem;color:var(--t4);margin-top:6px">${c.notes.slice(0,100)}</div>`:''}
        </div>
      </div>`;
    }).join('')}`;
};

          <select class="form-select" id="gm-rec"><option>Use for sowing</option><option>Increase seed rate by 10%</option><option>Increase seed rate by 20%</option><option>Discard — too low germination</option></select></div>
      </div>
      <div class="form-group" style="margin-top:10px"><label class="form-label">Notes</label>
        <textarea class="form-textarea" id="gm-notes" placeholder="Storage conditions, treatment applied, observations..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveGermTest()">Save</button>`);
  };

  window.calcGerm = () => {
    const total = Number(document.getElementById('gm-total')?.value||100);
    const sprouted = Number(document.getElementById('gm-sprouted')?.value||0);
    const pct = document.getElementById('gm-pct');
    if(pct) pct.value = total>0?((sprouted/total)*100).toFixed(1):0;
  };

  window.saveGermTest = (editId=null) => {
    const variety = document.getElementById('gm-variety')?.value?.trim();
    const start = document.getElementById('gm-start')?.value;
    if(!variety||!start){showToast('Variety and date required');return;}
    const total = Number(document.getElementById('gm-total')?.value||100);
    const sprouted = Number(document.getElementById('gm-sprouted')?.value||0);
    const pct = total>0?Number(((sprouted/total)*100).toFixed(1)):0;
    const data = {
      variety, cropType:document.getElementById('gm-crop')?.value||'',
      startDate:start, seedsTested:total, germinated:sprouted,
      germinationPct:pct, daysToGermination:Number(document.getElementById('gm-days')?.value||0),
      lotNumber:document.getElementById('gm-lot')?.value||'',
      vigourIndex:document.getElementById('gm-vigour')?.value||'Good',
      recommendation:document.getElementById('gm-rec')?.value||'Use for sowing',
      notes:document.getElementById('gm-notes')?.value||''
    };
    if(editId) DB.updateItem('germination_tests',editId,data); else DB.addItem('germination_tests',data);
    closeModal(); navigate('germination'); showToast('✓ Test saved');
  };

  window.delGermTest = (id) => openConfirm('Delete this test?',()=>{DB.deleteItem('germination_tests',id);navigate('germination');showToast('Deleted');});

  if(!tests.length) return `<div class="empty-state"><div class="empty-icon">🌱</div><div class="empty-title">No Germination Tests</div><div class="empty-desc">Test seed germination before sowing. Above 85% is ideal. Adjust seed rate if below 75%.</div><button class="btn btn-primary" onclick="showAddGermModal()">+ Log Test</button></div><button class="fab" onclick="showAddGermModal()">+</button>`;

  return `
  <div class="section">
    <div class="sec-hd"><div class="sec-title">GERMINATION TEST RESULTS</div><button class="btn btn-primary btn-sm" onclick="showAddGermModal()">+ Test</button></div>
    <div class="alert alert-i section">Standard: &gt;85% = Excellent · 75-85% = Good (increase rate 10%) · &lt;75% = Poor (increase rate 20% or discard)</div>
    <div class="card">
      ${[...tests].sort((a,b)=>b.startDate.localeCompare(a.startDate)).map(t=>`
        <div class="list-item">
          <div class="li-icon">🌱</div>
          <div class="li-body">
            <div class="li-title">${t.variety} ${t.cropType?'('+t.cropType+')':''}</div>
            <div style="display:flex;gap:5px;margin:4px 0;flex-wrap:wrap">
              <span class="badge ${t.germinationPct>=85?'badge-green':t.germinationPct>=75?'badge-amber':'badge-red'}" style="font-size:.7rem">${t.germinationPct}% germination</span>
              <span class="badge badge-muted">${t.vigourIndex?.split(' ')[0]}</span>
              ${t.lotNumber?`<span class="badge badge-muted">Lot: ${t.lotNumber}</span>`:''}
            </div>
            <div class="li-meta">${t.startDate} · ${t.germinated}/${t.seedsTested} seeds${t.daysToGermination?' · '+t.daysToGermination+'d':''}</div>
            <div style="font-size:.72rem;color:${t.germinationPct>=85?'var(--p)':t.germinationPct>=75?'var(--a)':'var(--red)'};margin-top:3px">→ ${t.recommendation}</div>
          </div>
          <button class="btn btn-danger btn-sm btn-icon" onclick="delGermTest('${t.id}')">🗑</button>
        </div>`).join('')}
    </div>
  </div>
  <button class="fab" onclick="showAddGermModal()">+</button>`;
};

PAGES.crop_rotation = function() {

  const plans = DB.getList('rotation_plans');

  const ROTATION_LOGIC = {
    Wheat: { after:'Legumes (Chickpea, Mung Bean)', avoid:'Wheat consecutive', benefit:'N from legumes reduces urea need by 20-25 kg N/acre' },
    'Rice (Basmati)': { after:'Wheat, Brassica', avoid:'Rice consecutive', benefit:'Breaks sheath blight cycle; improves soil aeration' },
    Maize: { after:'Legumes, Vegetables', avoid:'Sorghum (shared pests)', benefit:'Deep roots break hardpan; good residue' },
    Cotton: { after:'Wheat, Maize', avoid:'Cotton consecutive, Okra', benefit:'Breaks bollworm cycle dramatically' },
    Sugarcane: { after:'Legumes or fallow', avoid:'Long monoculture', benefit:'Ratoon management reduces cost 40%' },
    Chickpea: { after:'Wheat, Cotton, Maize', avoid:'Legume-to-legume', benefit:'Fixes 60-80 kg N/ha; reduces next crop fertilizer cost' },
    Sunflower: { after:'Wheat, Rice, Maize', avoid:'Potato (Sclerotinia)', benefit:'Drought tolerant; breaks cereal disease cycle' },
  };

  window.showAddRotationModal = () => {
    openModal('Plan Crop Rotation', `
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Field *</label>
          <select class="form-select" id="rp-field">
            <option value="">Select field</option>
            ${fields.map(f=>`<option value="${f.id}">${f.name} (${f.areaAcres}ac)</option>`).join('')}
          </select></div>
        <div class="form-group"><label class="form-label">Current/Last Crop</label>
          <input class="form-input" id="rp-current" placeholder="e.g. Wheat 2024-25"></div>
        <div class="form-group"><label class="form-label">Planned Next Crop *</label>
          <select class="form-select" id="rp-next" onchange="checkRotation()">
            <option value="">Select</option>
            ${Object.keys(ROTATION_LOGIC).map(c=>`<option>${c}</option>`).join('')}
            <option>Vegetables (mixed)</option><option>Fallow</option><option>Other</option>
          </select></div>
        <div class="form-group"><label class="form-label">Planned Season</label>
          <input class="form-input" id="rp-season" placeholder="e.g. Rabi 2025-26"></div>
        <div class="form-group"><label class="form-label">Rotation Objective</label>
          <select class="form-select" id="rp-objective">
            <option>Break disease cycle</option><option>Improve soil nitrogen</option><option>Improve soil structure</option><option>Market diversification</option><option>Water saving</option>
          </select></div>
      </div>
      <div id="rp-advice" style="margin:12px 0"></div>
      <div class="form-group"><label class="form-label">Notes</label>
        <textarea class="form-textarea" id="rp-notes"></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveRotationPlan()">Save Plan</button>`);
  };

  window.checkRotation = () => {
    const next = document.getElementById('rp-next')?.value;
    const el = document.getElementById('rp-advice'); if(!el) return;
    const info = ROTATION_LOGIC[next];
    if(!info){el.innerHTML=''; return;}
    el.innerHTML=`<div class="alert alert-s"><strong>Rotation Advice for ${next}:</strong><br>✅ Best after: ${info.after}<br>⚠️ Avoid: ${info.avoid}<br>💡 Benefit: ${info.benefit}</div>`;
  };

  window.saveRotationPlan = (editId=null) => {
    const fid = document.getElementById('rp-field')?.value;
    const next = document.getElementById('rp-next')?.value;
    if(!next){showToast('Select next crop');return;}
    const data = {
      fieldId:fid, fieldName:fields.find(f=>f.id===fid)?.name||'',
      currentCrop:document.getElementById('rp-current')?.value||'',
      plannedCrop:next, plannedSeason:document.getElementById('rp-season')?.value||'',
      objective:document.getElementById('rp-objective')?.value||'Break disease cycle',
      notes:document.getElementById('rp-notes')?.value||'',
      createdDate:today()
    };
    if(editId) DB.updateItem('rotation_plans',editId,data); else DB.addItem('rotation_plans',data);
    closeModal(); navigate('crop_rotation'); showToast('✓ Rotation plan saved');
  };

  window.delRotation = (id) => openConfirm('Delete rotation plan?',()=>{DB.deleteItem('rotation_plans',id);navigate('crop_rotation');showToast('Deleted');});

  return `
  <div class="card section">
    <div class="card-hd"><div class="card-title">🔄 ROTATION INTELLIGENCE</div></div>
    <div class="card-body">
      ${Object.entries(ROTATION_LOGIC).map(([crop,info])=>`

          <div style="font-weight:600;color:var(--t1);margin-bottom:4px">${crop}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px">
            <span class="badge badge-green">After: ${info.after.split(' (')[0]}</span>
            <span class="badge badge-red">Avoid: ${info.avoid}</span>
          </div>
          <div style="font-family:var(--mono);font-size:.6rem;color:var(--t3)">💡 ${info.benefit}</div>
        </div>`).join('')}
    </div>
  </div>
  <div class="section">
    <div class="sec-hd"><div class="sec-title">MY ROTATION PLANS</div><button class="btn btn-primary btn-sm" onclick="showAddRotationModal()">+ Plan</button></div>
    ${plans.length===0?`<div style="color:var(--t4);font-family:var(--mono);font-size:.72rem;text-align:center;padding:20px">No rotation plans yet. Plan ahead for better soil health and pest control.</div>`:`

      ${[...plans].reverse().map(p=>`

          <div class="li-icon">🔄</div>
          <div class="li-body">
            <div class="li-title">${p.fieldName||'Field'}: ${p.currentCrop||'—'} → ${p.plannedCrop}</div>
            <div class="li-meta">${p.plannedSeason} · ${p.objective}</div>
            ${p.notes?`<div style="font-size:.7rem;color:var(--t4);margin-top:2px">${p.notes}</div>`:''}
          </div>
          <button class="btn btn-danger btn-sm btn-icon" onclick="delRotation('${p.id}')">🗑</button>
        </div>`).join('')}
    </div>`}
  </div>
  <button class="fab" onclick="showAddRotationModal()">+</button>`;
};

    const modal = Number(document.getElementById('mc-modal')?.value||0);
    const min = Number(document.getElementById('mc-min')?.value||0);
    const max = Number(document.getElementById('mc-max')?.value||0);
    const commission = Number(document.getElementById('mc-commission')?.value||2.5);
    const netPrice = modal>0?Math.round(modal*(1-commission/100)):0;
    const data = {
      commodity, mandiName:mandi, date,
      minPricePerMaund:min, maxPricePerMaund:max,
      modalPricePerMaund:modal, netPriceAfterCommission:netPrice,

  };

  window.delMandiPrice = (id) => openConfirm('Delete price entry?',()=>{DB.deleteItem('ci_market_prices',id);navigate('mandi_compare');showToast('Deleted');});

  // Latest prices per commodity per mandi
  const byComm = {};
  prices.forEach(p=>{

    if(!byComm[key]) byComm[key]=[];
    byComm[key].push(p);

  if(!prices.length) return `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No Mandi Prices</div><div class="empty-desc">Record prices from Sheikhupura, Lahore, and Gujranwala mandis. Compare across markets to find the best rate for your produce.</div><button class="btn btn-primary" onclick="showAddMandiModal()">+ Add Price</button></div><button class="fab" onclick="showAddMandiModal()">+</button>`;

  </div>
  ${Object.entries(byComm).map(([comm,cPrices])=>{
    const latest = [...cPrices].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
    const bestPrice = Math.max(...latest.map(p=>Number(p.modalPricePerMaund||p.maxPricePerMaund||0)));
    return `<div class="card section">
      <div class="card-hd">
        <div><div class="card-title">${comm}</div><div style="font-family:var(--mono);font-size:.6rem;color:var(--t3);padding-left:10px">Best: ${formatPKR(bestPrice)}/Maund</div></div>
        <button class="btn btn-ghost btn-sm" onclick="showAddMandiModal()">+ Update</button>
      </div>
      <div class="card-body">
        ${latest.map(p=>{
          const modal = Number(p.modalPricePerMaund||p.maxPricePerMaund||0);
          const isBest = modal===bestPrice;
          return `<div class="finance-row" style="${isBest?'border-left:2px solid var(--p);padding-left:6px':''}">
            <div>
              <div class="fr-label">${p.mandiName||p.mandi||'Mandi'} ${isBest?'<span class="badge badge-green" style="font-size:.58rem">BEST</span>':''}</div>
              <div class="fr-meta">${p.date} · ${p.source||''} · After commission: ${formatPKR(p.netPriceAfterCommission||Math.round(modal*0.975))}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-family:var(--mono);font-weight:700;color:${isBest?'var(--p)':'var(--a)'}">${formatPKR(modal)}</span>
              <button class="btn btn-danger btn-sm btn-icon" onclick="delMandiPrice('${p.id}')">🗑</button>
            </div>
          </div>`;}).join('')}
      </div>
    </div>`;}).join('')}
  <button class="fab" onclick="showAddMandiModal()">+</button>`;
};

PAGES.store_sell = function() {
  const storage = DB.getList('storage').filter(s=>s.status!=='Sold');
  const prices = DB.getList('ci_market_prices');

  return `

          <input class="form-input" id="ss-commodity" placeholder="e.g. Wheat"></div>

      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px" onclick="calcStoreSell()">⚖️ Analyse Decision</button>
      <div id="ss-result" style="margin-top:16px"></div>
    </div>
  </div>
  ${storage.length?`
  <div class="section">

    <div class="card">
      ${storage.map(s=>{
        const latest = prices.filter(p=>(p.commodity||p.cropType||'').toLowerCase().includes(s.commodity.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date))[0];
        return `<div class="list-item">

            ${s.targetSellPricePerUnit?`<div style="font-size:.72rem;color:var(--a)">Target: ${formatPKR(s.targetSellPricePerUnit)}/${s.unit}</div>`:''}
            ${latest?`<div style="font-size:.72rem;color:var(--p)">Latest mandi: ${formatPKR(latest.modalPricePerMaund||latest.maxPricePerMaund||0)}/Maund (${latest.mandiName||latest.mandi||'Mandi'} · ${latest.date})</div>`:'<div style="font-size:.7rem;color:var(--t4)">No price data — add in Mandi Compare</div>'}

window.calcStoreSell = () => {
  const qty = Number(document.getElementById('ss-qty')?.value||0);
  const current = Number(document.getElementById('ss-current')?.value||0);
  const expected = Number(document.getElementById('ss-expected')?.value||0);
  const storeCostPerMaundMonth = Number(document.getElementById('ss-storecost')?.value||15);
  const interestPctMonth = Number(document.getElementById('ss-interest')?.value||1.5)/100;
  const months = Number(document.getElementById('ss-months')?.value||3);
  const commission = Number(document.getElementById('ss-commission')?.value||2.5)/100;
  const el = document.getElementById('ss-result'); if(!el) return;
  if(!qty||!current){el.innerHTML='<div class="alert alert-w">Enter quantity and current price to proceed.</div>'; return;}

  const sellNow = qty*current*(1-commission);
  const storageCost = qty*storeCostPerMaundMonth*months;
  const financeCost = sellNow*interestPctMonth*months;
  const totalHoldCost = storageCost+financeCost;
  const sellLater = qty*(expected||current)*(1-commission);
  const netGainFromHolding = sellLater - sellNow - totalHoldCost;
  const breakEvenPrice = current+(totalHoldCost/qty)+current*commission;
  const verdict = netGainFromHolding>0&&expected>current;

  el.innerHTML = `
  <div class="stat-grid" style="margin-bottom:14px">
    <div class="stat-card"><div class="stat-val income" style="font-size:.9rem">${formatPKR(sellNow)}</div><div class="stat-label">Sell Now</div></div>
    <div class="stat-card"><div class="stat-val" style="font-size:.9rem;color:var(--a)">${formatPKR(sellLater)}</div><div class="stat-label">Sell Later (est.)</div></div>
    <div class="stat-card"><div class="stat-val expense" style="font-size:.9rem">${formatPKR(totalHoldCost)}</div><div class="stat-label">Hold Cost</div></div>
    <div class="stat-card"><div class="stat-val" style="font-size:.9rem;color:${netGainFromHolding>0?'var(--p)':'var(--red)'}">${netGainFromHolding>0?'+':''}${formatPKR(netGainFromHolding)}</div><div class="stat-label">Net Gain</div></div>
  </div>
  <div class="alert ${verdict?'alert-s':'alert-d'}" style="font-size:.85rem">

window.calcYieldEst = () => {
  const cropName = document.getElementById('ye-crop')?.value||'Wheat';
  const area = Number(document.getElementById('ye-area')?.value||1);
  const soil = Number(document.getElementById('ye-soil')?.value||1);
  const input = Number(document.getElementById('ye-input')?.value||1);
  const timing = Number(document.getElementById('ye-timing')?.value||1);
  const price = Number(document.getElementById('ye-price')?.value||0);
  const BENCH = {Wheat:{min:20,avg:30,max:45},Rice:{min:15,avg:25,max:40},'Rice (Basmati)':{min:15,avg:22,max:32},Maize:{min:30,avg:50,max:80},Cotton:{min:10,avg:20,max:35},Sugarcane:{min:600,avg:800,max:1200},Potato:{min:150,avg:250,max:400},Sunflower:{min:8,avg:14,max:22}};
  const b = BENCH[cropName]||BENCH.Wheat;
  const mult = soil*input*timing;
  const est = Math.round(b.avg*mult);
  const estLow = Math.round(b.min*mult);
  const estHigh = Math.round(b.max*mult);
  const totalEst = est*area;
  const rev = price>0?totalEst*price:0;
  const el = document.getElementById('ye-result'); if(!el) return;
  el.innerHTML = `
  <div class="stat-grid" style="margin-bottom:14px">
    <div class="stat-card"><div class="stat-val" style="color:var(--red)">${(estLow*area).toFixed(0)}</div><div class="stat-label">Low Scenario</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--p)">${totalEst.toFixed(0)}</div><div class="stat-label">Expected (Maunds)</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--a)">${(estHigh*area).toFixed(0)}</div><div class="stat-label">Best Case</div></div>
    ${rev?`<div class="stat-card"><div class="stat-val income">${formatPKR(rev)}</div><div class="stat-label">Est. Revenue</div></div>`:''}
  </div>
  <div class="alert alert-i" style="font-size:.78rem">Estimated yield: <strong>${est} Maunds/acre</strong> (range: ${estLow}–${estHigh}) for ${area} acre${area>1?'s':''}. Based on Punjab averages × your input/soil/timing factors.</div>`;
};

// ─── IRRIGATION SCHEDULER ─────────────
PAGES.irr_schedule = function() {
  const crops = DB.getList('crops').filter(c=>c.status==='Growing'||c.status==='At Risk');
  const irr = DB.getList('irrigation');

  const CROP_IRR = {
    Wheat:{intervals:[21,14,14,14,14,14,21],stages:['CRI','Tillering','Jointing','Heading','Grain Fill','Dough','Maturity'],critical:[1,2,3,4],totalIrr:5},
    'Rice (Basmati)':{intervals:[7,7,7,7,7,7,7,7,7,7,7,7,7],stages:['Transplant','Tillering','Panicle','Flowering','Grain Fill','Maturity'],critical:[0,1,2,3],totalIrr:20},
    Maize:{intervals:[10,10,10,12,12,14],stages:['Germination','Knee-high','Tasseling','Silking','Grain Fill','Maturity'],critical:[2,3,4],totalIrr:6},
    Cotton:{intervals:[12,10,10,10,12,14,14],stages:['Germination','Square','Flowering','Boll Form','Opening'],critical:[1,2,3],totalIrr:7},
    Sugarcane:{intervals:[7,7,7,7,10,10,10,14,14,21],stages:['Germination','Tillering','Grand Growth','Maturity'],critical:[0,1,2],totalIrr:35}
  };

  return `
  <div class="section">
    <div class="alert alert-i">📅 Irrigation scheduling based on crop critical stages. Timely irrigation at critical stages = maximum yield. Missing critical irrigation can cut yield by 15-40%.</div>
  </div>
  ${crops.length===0?`<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No Active Crops</div><div class="empty-desc">Add crops with sowing dates to get irrigation schedules.</div><button class="btn btn-primary" onclick="navigate('crops')">Add Crops</button></div>`:''}
  ${crops.map(c=>{
    const schedule = CROP_IRR[c.type]||CROP_IRR.Wheat;
    const sown = new Date(c.sowingDate);
    let runDate = new Date(sown);
    const irrigations = schedule.stages.map((stage,i)=>{
      if(i>0) runDate = new Date(runDate.getTime()+schedule.intervals[i-1]*86400000);
      const dateStr = runDate.toISOString().split('T')[0];
      const d = daysUntil(dateStr);
      const isCritical = schedule.critical.includes(i);
      const lastIrr = irr.filter(ir=>ir.cropId===c.id&&ir.irrigationNumber===i+1).length>0;
      return {stage, date:dateStr, d, isCritical, done:lastIrr, num:i+1};
    });
    return `<div class="card section">
      <div class="card-hd"><div class="card-title">${c.name} — ${c.type}</div><div style="font-family:var(--mono);font-size:.6rem;color:var(--t3);padding-left:10px">Sown: ${c.sowingDate} · ${c.areaAcres}ac</div></div>
      <div class="card-body">
        ${irrigations.map(ir=>`
          <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--gl);opacity:${ir.done?0.5:1}">
            <div style="width:28px;height:28px;border-radius:50%;background:${ir.done?'var(--p)':ir.isCritical?'var(--red)':'var(--bg3)'};border:1px solid ${ir.isCritical?'var(--red)':'var(--gl)'};display:flex;align-items:center;justify-content:center;font-size:.65rem;color:${ir.done?'#060a0f':'var(--t1)'};">${ir.done?'✓':ir.num}</div>
            <div style="flex:1">
              <div style="font-size:.8rem;font-weight:${ir.isCritical?700:400};color:${ir.isCritical?'var(--t1)':'var(--t2)'}">#${ir.num} — ${ir.stage} ${ir.isCritical?'<span style="color:var(--red);font-size:.65rem">CRITICAL</span>':''}</div>
              <div style="font-family:var(--mono);font-size:.6rem;color:${ir.d<0?'var(--red)':ir.d<=3?'var(--orange)':ir.d<=7?'var(--a)':'var(--t3)'}">${ir.date} · ${ir.d<0?Math.abs(ir.d)+'d overdue':ir.d===0?'TODAY':ir.d+'d away'}</div>
            </div>
            ${!ir.done&&ir.d<=3?`<span class="badge ${ir.d<=0?'badge-red':'badge-amber'}">${ir.d<=0?'OVERDUE':'Soon'}</span>`:''}
          </div>`).join('')}
      </div>
    </div>`;}).join('')}
  <div class="card section">
    <div class="card-hd"><div class="card-title">CRITICAL STAGE GUIDE</div></div>
    <div class="card-body">
      ${Object.entries(CROP_IRR).map(([crop,data])=>`<div style="padding:6px 0;border-bottom:1px solid var(--gl)"><div style="font-weight:600;font-size:.8rem;color:var(--t1)">${crop}</div><div style="font-size:.7rem;color:var(--t3)">Critical: ${data.critical.map(i=>data.stages[i]).join(', ')} · Total: ${data.totalIrr} irrigations</div></div>`).join('')}
    </div>
  </div>`;
};

PAGES.spray_cal = function() {
  return `
  <div class="section">
    <div class="alert alert-i">⚙️ Spray calibration ensures correct dose reaches the target. Under-application = poor control. Over-application = waste + resistance + toxicity risk.</div>
  </div>
  <div class="card section">
    <div class="card-hd"><div class="card-title">🔧 KNAPSACK SPRAYER CALIBRATION</div></div>
    <div class="card-body">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Nozzle Type</label>
          <select class="form-select" id="spc-nozzle"><option>Flat fan (standard)</option><option>Cone nozzle</option><option>Flooding nozzle</option></select></div>
        <div class="form-group"><label class="form-label">Walking speed (m/min)</label>
          <input class="form-input" id="spc-speed" type="number" value="80" placeholder="e.g. 80" oninput="calcSprayCal()"></div>
        <div class="form-group"><label class="form-label">Nozzle output (L/min)</label>
          <input class="form-input" id="spc-output" type="number" step="0.1" value="0.8" placeholder="e.g. 0.8" oninput="calcSprayCal()"></div>
        <div class="form-group"><label class="form-label">Spray swath width (m)</label>
          <input class="form-input" id="spc-swath" type="number" step="0.1" value="0.5" placeholder="e.g. 0.5" oninput="calcSprayCal()"></div>
        <div class="form-group"><label class="form-label">Field area (acres)</label>
          <input class="form-input" id="spc-area" type="number" step="0.5" value="1" oninput="calcSprayCal()"></div>
        <div class="form-group"><label class="form-label">Product dose (ml or g/100L)</label>
          <input class="form-input" id="spc-dose" type="number" placeholder="e.g. 200" oninput="calcSprayCal()"></div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px" onclick="calcSprayCal()">⚙️ Calculate</button>
      <div id="spc-result" style="margin-top:14px"></div>
    </div>
  </div>
  <div class="card section">
    <div class="card-hd"><div class="card-title">SPRAY CALIBRATION QUICK TEST</div></div>
    <div class="card-body" style="font-size:.79rem;color:var(--t2);line-height:1.7">
      <strong>3-step field calibration:</strong><br>
      1. Fill tank with clean water.<br>
      2. Spray for exactly <strong>1 minute</strong> at your normal walking speed and pressure.<br>
      3. Measure water used from tank.<br>
      <br><strong>Formula:</strong> L/min ÷ (speed m/min × swath m) × 10,000 = L/ha<br>
      <br><strong>Standard target:</strong> Knapsack = 200-400 L/ha. Tractor boom = 100-200 L/ha.
    </div>
  </div>`;
};

window.calcSprayCal = () => {
  const speed = Number(document.getElementById('spc-speed')?.value||80);
  const output = Number(document.getElementById('spc-output')?.value||0.8);
  const swath = Number(document.getElementById('spc-swath')?.value||0.5);
  const area = Number(document.getElementById('spc-area')?.value||1);
  const dose = Number(document.getElementById('spc-dose')?.value||0);
  const el = document.getElementById('spc-result'); if(!el) return;
  const LPerHa = (output/(speed*swath))*10000;
  const LPerAcre = LPerHa/2.47;
  const totalL = LPerAcre*area;
  const productPerAcre = dose>0?(LPerAcre*dose/100).toFixed(0):null;
  const totalProduct = dose>0?(totalL*dose/100).toFixed(0):null;
  el.innerHTML = `
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val" style="color:var(--b3)">${LPerHa.toFixed(0)}</div><div class="stat-label">L/ha output</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--p)">${LPerAcre.toFixed(1)}</div><div class="stat-label">L/acre</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--a)">${totalL.toFixed(1)}</div><div class="stat-label">Total L (${area}ac)</div></div>
    ${productPerAcre?`<div class="stat-card"><div class="stat-val" style="color:var(--orange)">${productPerAcre}</div><div class="stat-label">ml/g product/ac</div></div>`:''}
  </div>
  ${LPerHa<150?`<div class="alert alert-w" style="margin-top:10px">⚠️ Low volume — risk of uneven coverage. Slow down or increase nozzle size.</div>`:LPerHa>500?`<div class="alert alert-w" style="margin-top:10px">⚠️ Very high volume — inefficient, risk of runoff. Speed up or reduce output.</div>`:`<div class="alert alert-s" style="margin-top:10px">✅ Volume within acceptable range for field crops.</div>`}`;
};

PAGES.phi_track = function() {
  const pesticide = DB.getList('pesticide');
  const today_d = today();
  const withPHI = pesticide.filter(p=>p.harvestSafeDate);
  const active = withPHI.filter(p=>p.harvestSafeDate>=today_d);
  const cleared = withPHI.filter(p=>p.harvestSafeDate<today_d);

  return `

    <div class="alert alert-i">⏱ Pre-Harvest Interval (PHI) is the mandatory waiting period after pesticide application before harvest. Harvesting within PHI = illegal residues = market rejection + food safety risk.</div>
    <div class="stat-grid" style="margin-top:14px">
      <div class="stat-card"><div class="stat-val" style="color:var(--red)">${active.length}</div><div class="stat-label">PHI Active</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--p)">${cleared.length}</div><div class="stat-label">Cleared</div></div>
      <div class="stat-card"><div class="stat-val">${withPHI.length}</div><div class="stat-label">Total Tracked</div></div>
    </div>
  </div>
  ${active.length?`
  <div class="section">
    <div class="sec-hd"><div class="sec-title" style="color:var(--red)">🚫 DO NOT HARVEST — PHI ACTIVE</div></div>
    <div class="card">
      ${active.map(p=>{
        const d = daysUntil(p.harvestSafeDate);
        return `<div class="list-item" style="border-left:2px solid var(--red)">
          <div class="li-icon">⏱</div>
          <div class="li-body">
            <div class="li-title">${p.productName} ${p.cropName?'— '+p.cropName:''}</div>
            <div class="li-meta" style="color:var(--red)">Safe from: ${p.harvestSafeDate} · ${d}d remaining (PHI: ${p.phiDays}d)</div>
            <div style="font-size:.7rem;color:var(--t3)">Applied: ${p.date} · ${p.targetPest||''}</div>
            <div class="progress" style="margin-top:5px"><div class="progress-fill" style="width:${Math.max(5,Math.round((1-d/p.phiDays)*100))}%;background:var(--red)"></div></div>
          </div>
        </div>`;}).join('')}
    </div>
  </div>`:''}
  ${cleared.length?`
  <div class="section">
    <div class="sec-hd"><div class="sec-title">✅ PHI CLEARED — SAFE TO HARVEST</div></div>
    <div class="card">
      ${cleared.slice(0,5).map(p=>`
        <div class="list-item">
          <div class="li-icon">✅</div>
          <div class="li-body">
            <div class="li-title">${p.productName} ${p.cropName?'— '+p.cropName:''}</div>
            <div class="li-meta" style="color:var(--p)">Cleared: ${p.harvestSafeDate} · PHI: ${p.phiDays}d</div>
          </div>
        </div>`).join('')}
    </div>
  </div>`:''}
  ${!withPHI.length?`<div class="empty-state"><div class="empty-icon">⏱</div><div class="empty-title">No PHI Data</div><div class="empty-desc">Log pesticide applications with PHI days in the Pesticide module to track safe harvest windows.</div><button class="btn btn-primary" onclick="navigate('pesticide')">Go to Pesticide Log</button></div>`:''}
  <div class="card section">
    <div class="card-hd"><div class="card-title">COMMON PHI VALUES — PAKISTAN</div></div>
    <div class="card-body" style="overflow-x:auto">
      <table class="data-table"><thead><tr><th>Active Ingredient</th><th>PHI (days)</th><th>Crop</th></tr></thead>
      <tbody>${[['Imidacloprid','21','Wheat, Cotton'],['Deltamethrin','7','Most crops'],['Chlorpyrifos','21','Wheat, Cotton'],['Dimethoate','14','Vegetables, Cotton'],['Profenofos','14','Cotton'],['Triazophos','21','Rice, Cotton'],['Lambda-cyhalothrin','7','Various'],['Propiconazole','14','Wheat'],['Tebuconazole','21','Wheat']].map(([ai,phi,crop])=>`<tr><td>${ai}</td><td style="color:${Number(phi)>14?'var(--red)':'var(--a)'};font-weight:700">${phi}</td><td>${crop}</td></tr>`).join('')}</tbody></table>

PAGES.soil_memory = function() {
  const tests = DB.getList('soil_tests');
  const fields = DB.getList('fields');
  const bioHealth = DB.getList('bio_health');
  const omLogs = DB.getList('organic_matter');

  if(!fields.length) return `<div class="empty-state"><div class="empty-icon">🧠</div><div class="empty-title">No Fields</div><div class="empty-desc">Add fields to track soil history over time.</div><button class="btn btn-primary" onclick="navigate('fields')">Add Fields</button></div>`;

  return `
  <div class="section">
    <div class="alert alert-i">🧠 Soil Memory tracks changes in your soil over time. Compare soil tests season-to-season to measure improvement or degradation.</div>
  </div>
  ${fields.map(f=>{
    const fTests = [...tests.filter(t=>t.fieldId===f.id)].sort((a,b)=>a.testDate.localeCompare(b.testDate));
    const fBio = bioHealth.filter(b=>b.fieldId===f.id);
    const fOM = omLogs.filter(o=>o.fieldId===f.id);
    if(!fTests.length&&!fBio.length) return '';
    const latestTest = fTests[fTests.length-1];
    const firstTest = fTests[0];
    const phTrend = fTests.length>1?(latestTest.pH-firstTest.pH).toFixed(1):null;
    const omTrend = fTests.length>1&&latestTest.organicMatterPercent&&firstTest.organicMatterPercent?(latestTest.organicMatterPercent-firstTest.organicMatterPercent).toFixed(2):null;
    return `<div class="card section">
      <div class="card-hd"><div class="card-title">${f.name} — ${f.areaAcres}ac</div></div>
      <div class="card-body">
        ${latestTest?`<div style="margin-bottom:12px"><div style="font-family:var(--mono);font-size:.58rem;color:var(--t3);margin-bottom:6px">LATEST SOIL TEST (${latestTest.testDate})</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
          <div class="stat-card" style="padding:8px"><div class="stat-val" style="font-size:1rem;color:${latestTest.pH>8.5?'var(--red)':latestTest.pH>8.0?'var(--orange)':'var(--p)'}">${latestTest.pH}</div><div class="stat-label">pH</div></div>
          ${latestTest.ec?`<div class="stat-card" style="padding:8px"><div class="stat-val" style="font-size:1rem;color:${latestTest.ec>4?'var(--red)':'var(--a)'}">${latestTest.ec}</div><div class="stat-label">EC dS/m</div></div>`:''}
          ${latestTest.organicMatterPercent?`<div class="stat-card" style="padding:8px"><div class="stat-val" style="font-size:1rem;color:var(--b3)">${latestTest.organicMatterPercent}%</div><div class="stat-label">Org. Matter</div></div>`:''}
        </div></div>`:'' }
        ${fTests.length>1?`<div style="margin-bottom:10px"><div style="font-family:var(--mono);font-size:.58rem;color:var(--t3);margin-bottom:5px">TREND (${firstTest.testDate} → ${latestTest.testDate})</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${phTrend?`<span class="badge ${Number(phTrend)<0?'badge-green':'badge-red'}">pH: ${Number(phTrend)>0?'+':''}${phTrend}</span>`:''}
          ${omTrend?`<span class="badge ${Number(omTrend)>0?'badge-green':'badge-red'}">OM: ${Number(omTrend)>0?'+':''}${omTrend}%</span>`:''}
          <span class="badge badge-muted">${fTests.length} tests</span>
        </div></div>`:''}
        ${fOM.length?`<div style="font-family:var(--mono);font-size:.6rem;color:var(--t3)">${fOM.length} organic inputs logged · Total: ${fOM.reduce((s,o)=>s+Number(o.ratePerAcre||0),0).toFixed(1)} t/ac</div>`:''}
        ${fBio.length?`<div style="font-family:var(--mono);font-size:.6rem;color:var(--t3);margin-top:3px">Latest health score: ${fBio[fBio.length-1].overallScore}/10 (${fBio[fBio.length-1].assessmentDate})</div>`:''}
      </div>
    </div>`;}).join('')}`;
};

PAGES.price_alert = function() {
  const alerts = DB.getList('price_alerts');
  const prices = DB.getList('ci_market_prices');

  window.showAddAlertModal = () => {
    openModal('Set Price Alert', `
      <div class="form-grid">

          <input class="form-input" id="pa-commodity" placeholder="e.g. Wheat, Rice, Potato"></div>
        <div class="form-group"><label class="form-label">Alert Type</label>
          <select class="form-select" id="pa-type"><option>Sell when price reaches</option><option>Buy when price drops to</option><option>Alert when price changes by</option></select></div>
        <div class="form-group"><label class="form-label">Target Price PKR/Maund</label>
          <input class="form-input" id="pa-price" type="number" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Current Price PKR/Maund</label>
          <input class="form-input" id="pa-current" type="number" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Quantity Available (Maunds)</label>
          <input class="form-input" id="pa-qty" type="number" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-select" id="pa-status"><option>Active</option><option>Triggered</option><option>Cancelled</option></select></div>
      </div>
      <div class="form-group" style="margin-top:10px"><label class="form-label">Notes</label>
        <textarea class="form-textarea" id="pa-notes" placeholder="Why this target price, expected timeline..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="savePriceAlert()">Save Alert</button>`);
  };

  window.savePriceAlert = (editId=null) => {
    const commodity = document.getElementById('pa-commodity')?.value?.trim();
    if(!commodity){showToast('Commodity required');return;}
    const target = Number(document.getElementById('pa-price')?.value||0);
    const current = Number(document.getElementById('pa-current')?.value||0);
    const data = {
      commodity, alertType:document.getElementById('pa-type')?.value||'Sell when price reaches',
      targetPricePKR:target, currentPricePKR:current,
      quantityMaunds:Number(document.getElementById('pa-qty')?.value||0),
      potentialRevenuePKR:target*Number(document.getElementById('pa-qty')?.value||0),
      status:document.getElementById('pa-status')?.value||'Active',
      notes:document.getElementById('pa-notes')?.value||'', createdDate:today()
    };
    if(editId) DB.updateItem('price_alerts',editId,data); else DB.addItem('price_alerts',data);
    closeModal(); navigate('price_alert'); showToast('✓ Alert set');
  };

  window.delPriceAlert = (id) => openConfirm('Delete alert?',()=>{DB.deleteItem('price_alerts',id);navigate('price_alert');showToast('Deleted');});

  // Check triggered alerts
  const triggered = alerts.filter(a=>{
    const latest = prices.filter(p=>(p.commodity||'').toLowerCase()===a.commodity.toLowerCase()).sort((x,y)=>y.date.localeCompare(x.date))[0];
    if(!latest) return false;
    const current = Number(latest.modalPricePerMaund||0);
    if(a.alertType?.includes('Sell')&&current>=a.targetPricePKR) return true;
    if(a.alertType?.includes('Buy')&&current<=a.targetPricePKR) return true;
    return false;
  });

  return `
  ${triggered.length?`<div class="alert alert-s section">🎯 ${triggered.length} price alert${triggered.length>1?'s':''} triggered based on latest mandi prices!</div>`:''}
  <div class="section">
    <div class="sec-hd"><div class="sec-title">PRICE ALERTS</div><button class="btn btn-primary btn-sm" onclick="showAddAlertModal()">+ Set Alert</button></div>
    ${alerts.length===0?`<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-title">No Price Alerts Set</div><div class="empty-desc">Set target sell prices for your stored produce. Get notified when mandi prices match your target.</div><button class="btn btn-primary" onclick="showAddAlertModal()">+ Set Alert</button></div>`:`
    <div class="card">
      ${[...alerts].reverse().map(a=>{
        const latest = prices.filter(p=>(p.commodity||'').toLowerCase()===a.commodity.toLowerCase()).sort((x,y)=>y.date.localeCompare(x.date))[0];
        const isTriggered = triggered.some(t=>t.id===a.id);
        return `<div class="list-item" style="${isTriggered?'border-left:2px solid var(--p)':''}">
          <div class="li-icon">${isTriggered?'🎯':'🔔'}</div>
          <div class="li-body">
            <div class="li-title">${a.commodity}</div>
            <div style="display:flex;gap:5px;margin:4px 0;flex-wrap:wrap">
              <span class="badge ${isTriggered?'badge-green':a.status==='Active'?'badge-blue':'badge-muted'}">${isTriggered?'TRIGGERED':a.status}</span>
            </div>
            <div class="li-meta">${a.alertType} ${formatPKR(a.targetPricePKR)}/M${a.quantityMaunds?' · '+a.quantityMaunds+'M':''}</div>
            ${latest?`<div style="font-size:.72rem;color:${isTriggered?'var(--p)':'var(--t3)'}">Current: ${formatPKR(latest.modalPricePerMaund||0)}/M (${latest.date})</div>`:''}
          </div>
          <button class="btn btn-danger btn-sm btn-icon" onclick="delPriceAlert('${a.id}')">🗑</button>
        </div>`;}).join('')}
    </div>`}
  </div>
  <button class="fab" onclick="showAddAlertModal()">+</button>`;
};

// ─── 3-YEAR TRENDS ────────────────────
PAGES.trends = function() {
  const finance = DB.getList('finance');
  const harvest = DB.getList('harvest_log');
  const crops = DB.getList('crops');
  const pesticide = DB.getList('pesticide');
  const fertilizer = DB.getList('fertilizer');

  // Group by year
  const years = {};
  const addYear = (date, key, val) => {
    const y = date?.slice(0,4); if(!y) return;
    if(!years[y]) years[y]={income:0,expense:0,yield:0,harvestCount:0,pestCost:0,fertCost:0};
    years[y][key]+=val;
  };
  finance.forEach(f=>{
    if(f.type==='Income') addYear(f.date,'income',Number(f.amount||0));
    else addYear(f.date,'expense',Number(f.amount||0));
  });
  harvest.forEach(h=>{addYear(h.harvestDate,'yield',Number(h.totalYieldMaunds||0));addYear(h.harvestDate,'harvestCount',1);});
  pesticide.forEach(p=>addYear(p.date,'pestCost',Number(p.totalCostPKR||0)));
  fertilizer.forEach(f=>addYear(f.date,'fertCost',Number(f.totalCostPKR||0)));

  const yearList = Object.keys(years).sort();
  if(!yearList.length) return `<div class="empty-state"><div class="empty-icon">📈</div><div class="empty-title">No Historical Data Yet</div><div class="empty-desc">Log financial records, harvests, and expenses across seasons to build your 3-year trend analysis.</div></div>`;

  return `
  <div class="section">
    <div class="alert alert-i">📈 Year-over-year analysis requires dated records in Finance, Harvest, Fertilizer, and Pesticide modules.</div>
  </div>
  <div class="card section">
    <div class="card-hd"><div class="card-title">ANNUAL FINANCIAL TREND</div></div>
    <div class="card-body">
      ${yearList.map(y=>{
        const d = years[y];
        const net = d.income-d.expense;
        const margin = d.income>0?Math.round(net/d.income*100):0;
        return `<div style="padding:13px 0;border-bottom:1px solid var(--gl)">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <span style="font-weight:700;color:var(--t1);font-size:.95rem">${y}</span>
            <span style="font-family:var(--mono);font-weight:700;color:${net>=0?'var(--p)':'var(--red)'}">${net>=0?'+':''}${formatPKR(net)}</span>
          </div>
          <div style="display:flex;gap:12px;margin-bottom:5px">
            <span style="font-family:var(--mono);font-size:.65rem;color:var(--p)">↑ ${formatPKR(d.income)}</span>
            <span style="font-family:var(--mono);font-size:.65rem;color:var(--red)">↓ ${formatPKR(d.expense)}</span>
            <span style="font-family:var(--mono);font-size:.65rem;color:var(--a)">Margin: ${margin}%</span>
          </div>
          ${d.yield?`<div style="font-family:var(--mono);font-size:.62rem;color:var(--t3)">🌾 ${d.yield.toFixed(0)} Maunds harvested (${d.harvestCount} crops)</div>`:''}
          <div class="progress" style="margin-top:6px"><div class="progress-fill" style="width:${d.income>0?Math.min(100,Math.round(d.income/(d.income+d.expense)*100)):0}%"></div></div>
        </div>`;}).join('')}
    </div>
  </div>
  <div class="card section">
    <div class="card-hd"><div class="card-title">INPUT COST TREND</div></div>
    <div class="card-body">
      ${yearList.map(y=>{
        const d = years[y];
        const total = d.pestCost+d.fertCost;
        return total>0?`<div style="padding:10px 0;border-bottom:1px solid var(--gl)">
          <div style="font-weight:600;font-size:.82rem;color:var(--t1);margin-bottom:5px">${y}</div>
          <div style="display:flex;gap:12px">
            <span style="font-family:var(--mono);font-size:.65rem;color:var(--orange)">Fertilizer: ${formatPKR(d.fertCost)}</span>
            <span style="font-family:var(--mono);font-size:.65rem;color:var(--red)">Pesticide: ${formatPKR(d.pestCost)}</span>
          </div>
        </div>`:'';}).join('')||`<div style="color:var(--t4);font-size:.78rem">No input cost data yet.</div>`}
    </div>
  </div>`;
};

async function sendToAI(userMsg, mode) {
  const chatList = document.getElementById('chat-list') || document.getElementById('ai-thinking-area')?.previousSibling;
  const thinkingArea = document.getElementById('ai-thinking-area');

  // Add user message
  const chatContainer = document.querySelector('.chat-list') || (() => {
    const el = document.createElement('div');
    el.className = 'chat-list';
    el.style.marginBottom = '16px';
    const content = document.getElementById('page-content');
    const scrollArea = content.querySelector('[style*="overflow-y:auto"]');
    if (scrollArea) scrollArea.insertBefore(el, thinkingArea);
    return el;
  })();

  if (userMsg) {
    const msgEl = document.createElement('div');
    msgEl.className = 'chat-msg chat-user';
    msgEl.textContent = userMsg;
    chatContainer.appendChild(msgEl);
  }

  // Show thinking
  const thinking = document.createElement('div');
  thinking.className = 'chat-thinking';
  thinking.innerHTML = '<span></span><span></span><span></span>';
  chatContainer.appendChild(thinking);
  thinking.scrollIntoView({behavior:'smooth'});

  const modePrompts = {
    CrisisResponse: userMsg,
    ProactiveScan: 'Run a proactive scan of my entire farm. Look at all my crops, their growth stages, pending tasks, soil data, and weather context. Give me today\'s most important alerts, what I must do TODAY, and any risks I might be missing. Be very specific.',
    StrategicPlan: `${userMsg}\n\n[Strategic mode: think 1-3 months ahead based on my real data. Include timelines and PKR costs.]`,
    MarketIntelligence: `${userMsg}\n\n[Market analysis: advise on sell timing, best mandi to sell at, pricing strategy, and storage vs sell decision for my specific crops.]`,
    SeasonStrategy: userMsg || 'Generate a comprehensive strategy for the upcoming season. Include crop selection, input budget, critical dates, and market timing based on my farm data.',
  };

  const result = await AI.ask(modePrompts[mode] || userMsg);

  // Remove thinking
  thinking.remove();

  // Add AI response
  const aiMsg = document.createElement('div');
  aiMsg.className = 'chat-msg chat-ai';
  const text = result.error ? `❌ ${result.error}` : result.text;
  aiMsg.innerHTML = text + (result.text ? `<div class="ai-actions">
    <button class="ai-action-btn" onclick="copyText(this.closest('.chat-ai').textContent.split('📋')[0])">📋 Copy</button>
    <button class="ai-action-btn" onclick="shareWhatsApp(this.closest('.chat-ai').textContent.split('📋')[0])">📱 WhatsApp</button>
    <button class="ai-action-btn" onclick="exportToPDF('AI Advice','<p>'+this.closest('.chat-ai').textContent.split('📋')[0]+'</p>')">📄 PDF</button>
  </div>` : '');
  chatContainer.appendChild(aiMsg);
  aiMsg.scrollIntoView({behavior:'smooth'});

  // Save to history
  if (result.text) {
    DB.addItem('ai_history', { userMessage: userMsg || `[${mode}]`, aiResponse: result.text, mode });
  }
}

// Voice input
function toggleVoiceInput() {
  const btn = document.getElementById('voice-btn');
  if (!window.SpeechRecognition && !window.webkitSpeechRecognition) { showToast('Voice not supported in this browser'); return; }
  if (window._voiceListening) {
    window._recognition?.stop();
    window._voiceListening = false;
    btn && (btn.style.background = 'var(--bg3)');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new SR();
  r.lang = APP.lang === 'ur' ? 'ur-PK' : 'en-PK';
  r.onstart = () => { window._voiceListening = true; btn && (btn.style.background = 'rgba(211,47,47,0.3)'); };
  r.onresult = (e) => { const t = Array.from(e.results).map(r=>r[0].transcript).join(''); const inp = document.getElementById('ai-input'); if(inp) inp.value = t; };
  r.onend = () => { window._voiceListening = false; btn && (btn.style.background = 'var(--bg3)'); };
  r.onerror = () => { window._voiceListening = false; btn && (btn.style.background = 'var(--bg3)'); };
  window._recognition = r;
  r.start();
}

// Diagnosis
function loadDiagImage(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    window._diagImageB64 = e.target.result;
    const preview = document.getElementById('diag-preview');
    if (preview) { preview.innerHTML = `<img src="${e.target.result}" style="max-width:100%;max-height:280px;border-radius:10px;object-fit:contain">`; }
    showToast('✓ Image loaded');
  };
  reader.readAsDataURL(file);
}

async function runDiagnosis() {
  if (!window._diagImageB64) { showToast('Please select an image first'); return; }
  const p = DB.getProfile();
  if (!p.geminiKey) { showToast('Add Gemini API key in Settings'); return; }
  const btn = document.getElementById('diag-btn');
  if (btn) { btn.textContent = '⏳ Analyzing...'; btn.disabled = true; }
  const modeText = {pest_id:'Identify pests, insects, or mites visible.',disease_id:'Identify plant diseases, fungal, bacterial, or viral infections.',deficiency_id:'Identify nutrient deficiencies based on symptoms.',weed_id:'Identify weed species visible.'};
  const prompt = `You are an expert agronomist. Analyze this crop image from Punjab, Pakistan. ${modeText[window._diagMode||'pest_id']} Provide: 1) Identification, 2) Severity (1-10), 3) Immediate action, 4) Specific products available in Pakistan with doses and PKR costs, 5) Prevention for next season. Respond in ${APP.lang==='ur'?'Urdu':'English'}.`;
  try {
    const [header, b64] = window._diagImageB64.split(',');
    const mime = header.match(/data:([^;]+)/)[1];
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${p.geminiKey}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents:[{role:'user',parts:[{inlineData:{mimeType:mime,data:b64}},{text:prompt}]}], generationConfig:{temperature:0.5,maxOutputTokens:1500} })
    });
    if (!r.ok) { const e=await r.json(); throw new Error(e.error?.message||'API error'); }
    const data = await r.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text||'No result';
    const resultDiv = document.getElementById('diag-result');
    if (resultDiv) resultDiv.innerHTML = `<div class="chat-msg chat-ai">${text}<div class="ai-actions"><button class="ai-action-btn" onclick="copyText(\`${text.replace(/`/g,'\\`')}\`)">📋 Copy</button><button class="ai-action-btn" onclick="shareWhatsApp(\`${text.replace(/`/g,'\\`')}\`)">📱 WhatsApp</button></div></div>`;
    DB.addItem('diagnosis_history', { type:window._diagMode, result:text, date:today() });
  } catch(e) {
    const resultDiv = document.getElementById('diag-result');
    if (resultDiv) resultDiv.innerHTML = `<div class="alert alert-d">❌ ${e.message}</div>`;
  }
  if (btn) { btn.textContent = '📸 Diagnose Image'; btn.disabled = false; }
}

    phone:document.getElementById('s-phone')?.value||p.phone,
    totalAcresOwned:Number(document.getElementById('s-owned')?.value||p.totalAcresOwned),
    totalAcresLeased:Number(document.getElementById('s-leased')?.value||p.totalAcresLeased),
    geminiKey:document.getElementById('s-gemini')?.value||p.geminiKey,
    weatherKey:document.getElementById('s-weather')?.value||p.weatherKey,
    language:document.getElementById('s-lang')?.value||p.language,
    areaUnit:document.getElementById('s-areaunit')?.value||p.areaUnit,
    yieldUnit:document.getElementById('s-yieldunit')?.value||p.yieldUnit,
    pinEnabled:document.getElementById('s-pin')?.checked||false,
    notifEnabled:document.getElementById('s-notif')?.checked||false,
    theme:APP.theme,
  };
  DB.saveProfile(updated);
  if (updated.language !== APP.lang) { setLang(updated.language); }
  buildSidebar();
  showToast('✓ Settings saved');
}

function exportBackup() {
  const data = {
    version:'3.0', exportDate:new Date().toISOString(),
    profile:DB.getProfile(),
    crops:DB.getList('crops'), fields:DB.getList('fields'),
    tasks:DB.getList('tasks'), activities:DB.getList('activities'),
    finance:DB.getList('finance'), soil_tests:DB.getList('soil_tests'),
    market_prices:DB.getList('market_prices'), seeds:DB.getList('seeds'),
    equipment:DB.getList('equipment'), ai_history:DB.getList('ai_history'),
    diagnosis_history:DB.getList('diagnosis_history'),
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`cropintel_backup_${today()}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast('✓ Backup exported');
}

function importBackup(input) {
  const file = input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.version) { showToast('Invalid backup file'); return; }
      if (!confirm(`Restore backup from ${data.exportDate}? This will overwrite current data.`)) return;
      ['crops','fields','tasks','activities','finance','soil_tests','market_prices','seeds','equipment','ai_history','diagnosis_history'].forEach(k => { if(data[k]) DB.setList(k,data[k]); });
      if (data.profile) DB.saveProfile(data.profile);
      showToast('✓ Backup restored!');
      setTimeout(()=>window.location.reload(), 1200);
    } catch { showToast('Failed to restore - file corrupted'); }
  };
  r.readAsText(file);
}

function confirmClearAll() {
  openConfirm('Delete ALL farm data? This cannot be undone. Export a backup first!', () => {
    ['crops','fields','tasks','activities','finance','soil_tests','market_prices','seeds','equipment','ai_history','diagnosis_history'].forEach(k=>localStorage.removeItem('ci_'+k));
    showToast('All data cleared');
    setTimeout(()=>window.location.reload(),1200);
  });
}

// ═══════════════════════════════════════
// WEATHER LOADER
// ═══════════════════════════════════════
async function loadDashboardWeather() {
  const el = document.getElementById('weather-dash');
  if (!el) return;
  const w = await fetchWeather();
  if (!w) return;
  const tempEl = document.getElementById('w-temp');
  const descEl = document.getElementById('w-desc');
  const statsEl = document.getElementById('w-stats');
  const updEl = document.getElementById('w-update');
  const iconEl = document.getElementById('w-icon');
  if (tempEl) tempEl.textContent = `${w.temp}°`;
  if (descEl) descEl.textContent = `${w.desc} · Feels ${w.feelsLike}° · ${w.location}`;
  if (iconEl) iconEl.textContent = {Clear:'☀️',Clouds:'⛅',Rain:'🌧️',Drizzle:'🌦️',Snow:'❄️',Thunderstorm:'⛈️',Mist:'🌫️',Fog:'🌫️'}[w.condition]||'🌤️';
  if (statsEl) statsEl.innerHTML = [
    {v:`${w.humidity}%`,l:'Humidity'},{v:`${w.wind}`,l:'Wind km/h'},{v:w.et0,l:'ET₀ mm'},{v:`${w.gdd}`,l:'GDD'},
  ].map(s=>`<div class="weather-stat"><div class="weather-stat-val">${s.v}</div><div class="weather-stat-label">${s.l}</div></div>`).join('');
  if (updEl) updEl.textContent = `Updated ${w.updated}`;
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  // Apply saved theme
  applyTheme(APP.theme);
  // Build sidebar
  buildSidebar();
  // Clock
  updateClock();
  setInterval(updateClock, 30000);
  // Navigate to dashboard
  navigate('dashboard');
  // Load weather asap
  setTimeout(loadDashboardWeather, 500);
  // Periodic weather refresh
  setInterval(loadDashboardWeather, 600000);
});

// Listen for page changes to load weather
const _origNavigate = navigate;
window.navigate = (pageId) => {
  _origNavigate(pageId);
  if (pageId === 'dashboard') setTimeout(loadDashboardWeather, 300);
};

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
</script>
